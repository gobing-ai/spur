telemetry = false

[install]
smol = true
exact = true

[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = ".coverage"
# Bun applies this table PER MEASURED FILE, not to the aggregate (verified 2026-09-28: a
# single file at 60% functions failed the whole run while the "All files" line read 99%,
# and the run still reported `0 fail`). A new module that becomes test-visible can therefore
# fail `bun test` without any failing test.
coverageThreshold = { lines = 0.9, functions = 0.9 }
passWithNoTests = true
preload = ["./tests/setup.ts"]
pathIgnorePatterns = ["vendors/**", "drizzle/**"]
# React .tsx components are exercised via happy-dom integration tests, not
# unit tests — exclude them from the per-file coverage gate so DOM branches
# (onChange/onSubmit handlers) don't drag the 90/90 threshold.
coveragePathIgnorePatterns = [
    "**/*.tsx",
    "**/tests/**/fixtures/**",
    "**/spur-wf-ext-*/**",
    "tests/setup.ts",
    "apps/server/src/index.ts",
    "../ts-libs/**",
    "packages/domain/src/schema/**",
    "apps/web/tests/**/*.ts",
    "scripts/**",
    # Build output of scripts/commands/bundle-plugin-lib.ts; its source modules are
    # covered where they live, so measuring the bundle double-counts them.
    "plugins/sp/lib/*.generated.mjs"
]
