# Workspace-local test config (task 1127 R8/AC7, mirroring apps/cli 0699 R3 precedent): without
# it, `cd scripts && bun test` — the run AGENTS.md prescribes — skipped the root preload, so these
# suites lost the shared test setup (logger muting, the util shims, and the hermeticity env that keeps
# tests off the operator's real ~/.config/spur/ config, projects registry and slash-command catalog).
# Coverage stays gated by the root bunfig (bun run test).
#
# The preload also carries the host-wide `full-gate.lock` isolation (tests/setup.ts gives every test
# process its own SPUR_GATE_LOCK_DIR), so an in-process gate never queues behind a real one. The
# preload stays required for the reasons above even without it (task 1173 R5; lock restored by 1235).
[test]
preload = ["../tests/setup.ts"]
