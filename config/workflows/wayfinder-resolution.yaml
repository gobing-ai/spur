# Wayfinder resolution pipeline — research/specification tasks without the code
# implementation pipeline (no task-pipeline / /sp:dev-run recursion).
#
# Reliability (aligned with task-pipeline / ADR-043):
#   - Soft precheck (task check + show) → failed via transitions (status file, always exit 0)
#   - collect fail-closed on non-empty input bundle
#   - investigate→verify enforces Testing content floor (0300 R2) before independent verify
#   - verify writes machine-readable PASS|PARTIAL|FAIL with expectFile
#   - HITL approve routing is exhaustive (yes/no/cancel)
#   - record → done is fail-closed on check + actual status=done
#   - Free-form agent inputs are intentional: no pure-slash research surface yet

"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
kind: state-machine
name: wayfinder-resolution
description: "Reusable resolution pipeline for research/specification tasks without invoking the code implementation pipeline"
iterationBound: 20
initialState: precheck
terminalStates:
  - done
  - failed
  - cancelled
failureStates:
  - failed
  - cancelled
vars:
  wbs: "0000"
  profile: "standard"
  spurBin: "spur"
  agent: "omp"
  stepTimeoutMs: "1800000"
  approval: "required"
  resolutionMode: "research"
  evidencePolicy: "spur-cli-first"
  __hitlAnswer: ""

states:
  - id: precheck
    description: >
      Soft precheck: task check + show, status files, always exit 0 so failures
      route to `failed` via transitions (not a raw lifecycle abort).
    onEnter:
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run/wayfinder &&
            set +e &&
            ${vars.spurBin} task check ${vars.wbs}; check_rc=$?;
            ${vars.spurBin} task show ${vars.wbs} --json > .spur/run/wayfinder/${vars.wbs}-show.json; show_rc=$?;
            set -e &&
            if [ "$check_rc" -eq 0 ] && [ "$show_rc" -eq 0 ]; then
              printf 'PASS\n' > .spur/run/wayfinder/${vars.wbs}-precheck.status;
            else
              printf 'FAIL\n' > .spur/run/wayfinder/${vars.wbs}-precheck.status;
            fi &&
            exit 0
      - kind: note
        options:
          message: "Wayfinder resolution started for task ${vars.wbs} (mode=${vars.resolutionMode}, evidence=${vars.evidencePolicy}); no code implementation pipeline is permitted."

  - id: collect
    description: "Create a deterministic local input bundle before delegation."
    onEnter:
      - kind: shell
        options:
          command: "mkdir -p .spur/run/wayfinder && ${vars.spurBin} task show ${vars.wbs} --json > .spur/run/wayfinder/${vars.wbs}-input.json"
      # `.spur/workflows/` is the runtime read path in every layout — a symlink to
      # config/workflows/ inside the Spur monorepo, a real directory in a seeded
      # project. The previous `config/workflows/…` literal only resolved in the
      # monorepo and hard-failed `collect` anywhere else.
      - kind: shell
        options:
          command: "${vars.spurBin} workflow validate .spur/workflows/wayfinder-resolution.yaml > .spur/run/wayfinder/${vars.wbs}-workflow-check.txt"
      - kind: shell
        options:
          command: "${vars.spurBin} task check ${vars.wbs} > .spur/run/wayfinder/${vars.wbs}-precheck.txt"

  - id: investigate
    description: "Resolve the task's research/specification requirements and author evidence-backed sections through Spur CLI."
    onEnter:
      - kind: agent.run
        options:
          agent: ${vars.agent}
          capture: true
          mode: text
          input: >-
            Resolve task ${vars.wbs} in resolution mode ${vars.resolutionMode} using the prepared
            local bundle `.spur/run/wayfinder/${vars.wbs}-input.json` and only local shell/file
            reads plus the `spur` CLI; do not use network search or MCP tools. Do not
            invoke task-pipeline.yaml, /sp:dev-run, /sp:dev-runall, or code implementation.
            Read the task file, map its existing Requirements and Acceptance Criteria to the
            existing Design/Plan/References, then author concise Solution, Testing, and Review
            sections through `spur task update --section --from-file`. Preserve the research
            boundary. Finish with a short summary and stop. Evidence policy: ${vars.evidencePolicy}.

            Evidence-anchor and content contract (mandatory — 0300 R1/R2): when the task's evidence
            lives in a shared evidence file (e.g. `.spur/run/wayfinder-O/implementation-evidence.md`),
            the `## <wbs>` section you author MUST (a) be substantive — more than 5 lines AND more
            than 60 words, covering the task's own requirements, not a generic 2–3 sentence
            placeholder; and (b) be anchored truthfully — after writing the section, resolve its
            real start line with `grep -n "^## <wbs> " <evidence-file>` and use that exact line
            number in every Solution/Testing `file:line` citation. NEVER copy a line number from
            another ticket's example (e.g. `:5` from an earlier WBS); each WBS anchors to its own
            section. Before finishing, re-read each cited line and confirm it names the
            requirement's subject (0299 R1 line-anchor rule).
          timeoutMs: ${vars.stepTimeoutMs}

  - id: verify
    description: "Perform an independent evidence and traceability check for the resolved research task."
    onEnter:
      - kind: shell
        options:
          command: 'rm -f .spur/run/wayfinder/${vars.wbs}-resolution-verdict.txt'
      - kind: agent.run
        options:
          agent: ${vars.agent}
          capture: true
          mode: text
          input: >-
            Verify resolved task ${vars.wbs} using only local reads and `spur` CLI. Check its
            requirements, acceptance scenarios, Solution, Testing, and Review. Confirm workflow
            orchestration uses `spur workflow` and execution uses `spur` CLI by default. Run
            `spur task check ${vars.wbs}` and update Testing/Review via the CLI only if needed.
            Do not implement plugin code. Write the final verdict word (exactly PASS, PARTIAL,
            or FAIL, nothing else) to `.spur/run/wayfinder/${vars.wbs}-resolution-verdict.txt`,
            then finish with the same verdict and stop.
          expectFile: .spur/run/wayfinder/${vars.wbs}-resolution-verdict.txt
          timeoutMs: ${vars.stepTimeoutMs}

  - id: approve
    description: "Human review gate unless the caller explicitly selects auto approval."
    pause: true
    onEnter:
      - kind: hitl.confirm
        options:
          prompt: "Approve research resolution for task ${vars.wbs}?"

  - id: record
    description: "Record the resolution through the canonical task CLI and transition only after checks pass."
    onEnter:
      # Both steps are soft (`; exit 0`) BY DESIGN, not laxity: the real gate is the
      # `record → done` guard below, which re-runs `spur task check` AND asserts the
      # status actually reached done. Hard-failing here aborted the run inside the
      # state, so the declared `record → failed` edge was unreachable and a blocked
      # lifecycle transition surfaced as a bare "Command exited with 1" instead of
      # the terminal `failed` this workflow documents.
      - kind: shell
        options:
          command: "${vars.spurBin} task check ${vars.wbs} ; exit 0"
      - kind: shell
        options:
          # PASS-only completion (preserve-list P4): lifecycle guards stay on; a forced
          # done without verdict evidence is the 0280 regression this replaces (see 0292).
          command: "${vars.spurBin} task update ${vars.wbs} done ; exit 0"

  - id: done
    description: "Research task resolved and ready to feed the implementation backlog."
    onEnter:
      - kind: note
        options:
          message: "Wayfinder research task ${vars.wbs} resolved; implementation remains deferred to the synthesized build backlog."

  - id: failed
    description: "Research resolution failed a gate; no completion transition is attempted."

  - id: cancelled
    description: "Operator cancelled the research resolution."

transitions:
  - from: precheck
    to: collect
    description: "Precheck PASS — collect deterministic local inputs."
    guard:
      kind: shell
      options:
        command: 'test "$(cat .spur/run/wayfinder/${vars.wbs}-precheck.status 2>/dev/null)" = PASS'
  - from: precheck
    to: failed
    description: "Precheck FAIL — stop before delegation."
    guard:
      kind: always
  - from: collect
    to: investigate
    description: "Input bundle collected — resolve the research task."
    guard:
      kind: shell
      options:
        command: "test -s .spur/run/wayfinder/${vars.wbs}-input.json && test -s .spur/run/wayfinder/${vars.wbs}-precheck.txt"
  - from: collect
    to: failed
    description: "Input collection failed — stop before delegation."
    guard:
      kind: shell
      options:
        command: "! test -s .spur/run/wayfinder/${vars.wbs}-input.json || ! test -s .spur/run/wayfinder/${vars.wbs}-precheck.txt"
  - from: investigate
    to: verify
    description: "Research resolution authored — verify evidence and traceability. Guard enforces the evidence content floor (0300 R2): the task's Testing section must be non-placeholder (>5 lines, >60 words) before independent verification may begin."
    guard:
      kind: shell
      options:
        command: 'test "$(${vars.spurBin} task show ${vars.wbs} --json | jq -r ".content" | awk "/^### Testing/{f=1;next} /^### /{f=0} f" | wc -l)" -gt 5 && test "$(${vars.spurBin} task show ${vars.wbs} --json | jq -r ".content" | awk "/^### Testing/{f=1;next} /^### /{f=0} f" | wc -w)" -gt 60'
  - from: investigate
    to: failed
    description: "Evidence content floor not met (0300 R2) — investigate authored a placeholder Testing section; stop before verification rather than certify hollow evidence."
    guard:
      kind: shell
      options:
        command: 'test "$(${vars.spurBin} task show ${vars.wbs} --json | jq -r ".content" | awk "/^### Testing/{f=1;next} /^### /{f=0} f" | wc -l)" -le 5 || test "$(${vars.spurBin} task show ${vars.wbs} --json | jq -r ".content" | awk "/^### Testing/{f=1;next} /^### /{f=0} f" | wc -w)" -le 60'
  - from: verify
    to: record
    description: "Auto profile — record only on a machine-readable PASS verdict (fail-closed to the approve gate otherwise)."
    guard:
      kind: shell
      options:
        command: 'test "${vars.approval}" = auto && grep -qx PASS .spur/run/wayfinder/${vars.wbs}-resolution-verdict.txt'
  - from: verify
    to: approve
    description: "Verification completed — require explicit review approval."
    guard:
      kind: always
  - from: approve
    to: record
    description: "Operator approved the research resolution."
    guard:
      kind: shell
      options:
        command: 'test "${vars.__hitlAnswer}" = yes'
  - from: approve
    to: cancelled
    description: "Operator cancelled the research resolution."
    guard:
      kind: shell
      options:
        command: 'test "${vars.__hitlAnswer}" = cancel'
  - from: approve
    to: failed
    description: "Operator rejected the research resolution."
    guard:
      kind: shell
      options:
        command: 'test "${vars.__hitlAnswer}" = no'
  - from: record
    to: done
    description: "Task check passed and the task status is actually done (the lifecycle transition succeeded)."
    guard:
      kind: shell
      options:
        command: '${vars.spurBin} task check ${vars.wbs} && test "$(${vars.spurBin} task show ${vars.wbs} --json | jq -r .status)" = done'
  - from: record
    to: failed
    description: "Recording/check failed or the task never reached done — stop without claiming completion."
    guard:
      kind: shell
      options:
        command: '! ${vars.spurBin} task check ${vars.wbs} || test "$(${vars.spurBin} task show ${vars.wbs} --json | jq -r .status)" != done'
