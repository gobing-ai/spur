# Planning pipeline — front-half of the development workflow (task 0088, design §6).
#
# Orchestration is configuration (ADR-022 / §3.2): this is YAML over the existing
# dual-workflow engine — zero new engine code. The pipeline automates steps 3–6 of the
# ideation→implementation chain: phasing → feature-ID derivation → design-doc generation →
# design-doc approval. It terminates at a drafted feature list and hands off to sp:spur-dev
# (steps 7–12), which is already shipped and unchanged.
#
# Every authoritative-doc touch invokes sp:doc-evolve to honor the constitution §5 sync triggers.
# Derived docs (docs/design/*, docs/features/*, 05_FEATURES index) are auto-written; high-risk
# authoritative edits (02_ROADMAP phasing, 04_DESIGN index) are STAGED to docs/plans/ for human
# commit (Q3 — hybrid by risk).
#
# Shape: phasing(HITL) → feature-id → design-gen → design-approval(HITL) → handoff
#        (phasing skipped when profile=auto; design-approval skipped when profile=auto
#         AND design_approved=true — taste gates pause even in auto unless prior approval
#         is encoded, per design doc HITL taxonomy).
#
# Vars (passed as a JSON object via `--vars`):
#   slug     — the design-doc slug, e.g. `--vars '{"slug":"auth-migration"}'`
#   profile  — set `--vars '{"profile":"auto"}'` to skip the HITL gates (Q4)
#   feature  — optional parent feature ID for derivation context
#   design_approved — "true" only when the operator explicitly approved the design in-session;
#              lets profile=auto route around the design-approval taste gate (default "false")
#
# Reliability (aligned with task-pipeline / ADR-043):
#   - Soft start precheck (slug non-empty + agent doctor) → failed via transitions
#   - feature-id + design-gen use expectFile so silent no-ops cannot proceed
#   - HITL routing is exhaustive (yes/no/cancel) on phasing and design-approval
#   - Free-form skill pointers remain only where no pure slash surface exists yet

"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
kind: state-machine
name: planning-pipeline
description: "Front-half planning pipeline (start → phasing → feature-ID → design-gen → design-approval → handoff)"
iterationBound: 20
initialState: start
terminalStates:
  - handoff
  - cancelled
  - failed
failureStates:
  - failed
  - cancelled
vars:
  slug: "draft"
  profile: "interactive"
  feature: ""
  design_approved: "false"
  __hitlAnswer: ""
  spurBin: "spur"
  agent: "omp"
  stepTimeoutMs: "1800000"
  # Injected by WorkflowAppService.run(); scopes .spur/run artifacts per run (0425 R4).
  __runId: ""

states:
  - id: start
    description: >
      Soft precheck + routing node. Validates slug and agent doctor (status file,
      always exit 0), then routes to the phasing HITL gate (interactive) or straight
      to feature-id (profile=auto) so hitl.confirm only fires when a human is in loop.
    onEnter:
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            set +e &&
            test -n "$slug"; slug_rc=$?;
            $spurBin agent doctor $agent; doctor_rc=$?;
            set -e &&
            if [ "$slug_rc" -eq 0 ] && [ "$doctor_rc" -eq 0 ]; then
              printf 'PASS\n' > .spur/run/$__runId-plan-precheck.status;
            else
              printf 'FAIL\n' > .spur/run/$__runId-plan-precheck.status;
            fi &&
            exit 0
      - kind: note
        options:
          message: "Planning pipeline start for slug=${vars.slug}."

  - id: phasing
    description: >
      Decide whether this requirement needs a new phase in 02_ROADMAP. The HITL gate asks
      the operator; if a new phase is needed, the edit is STAGED to docs/plans/ (never
      auto-written — Q3). Under profile=auto this state is never entered (start routes
      around it straight to feature-id).
    onEnter:
      - kind: hitl.confirm
        options:
          prompt: "Does this requirement need a new phase in 02_ROADMAP? (Stage the edit if yes.)"

  - id: feature-id
    description: >
      Allocate the feature id via the canonical `spur feature create` verb (DD-14).
      expectFile fails a silent no-op so design-gen never runs without an id.
    onEnter:
      - kind: shell
        options:
          command: 'mkdir -p .spur/run && rm -f .spur/run/$__runId-plan-feature-id.txt'
      - kind: agent.run
        options:
          agent: ${vars.agent}
          # `vars.feature` is optional and defaults to "" — the parent flag must be
          # Declared Layer-1 role (0538 R2): routing reason beside the agent: pin.
          role: planner
          # described conditionally, never interpolated bare. `--parent <empty> --json`
          # makes commander swallow `--json` as the parent value.
          input: "Skill(skill=\"sp:spur-cli\", args=\"feature create for slug ${vars.slug}\"). Run `${vars.spurBin} feature create \"${vars.slug}\" --json` (or reuse an existing id); append `--parent \"${vars.feature}\"` ONLY if the parent id between those quotes is non-empty — if it is empty, omit the --parent flag entirely. Write the feature id alone to .spur/run/${vars.__runId}-plan-feature-id.txt."
          expectFile: .spur/run/${vars.__runId}-plan-feature-id.txt
          timeoutMs: ${vars.stepTimeoutMs}

  - id: design-gen
    description: >
      Author docs/design/${vars.slug}.md from docs/plans/${vars.slug}-drafted.md and
      stage 04_DESIGN index via sp:doc-evolve (Q3 — never auto-write the index).
      expectFile fails a silent no-op design gen.
    onEnter:
      - kind: agent.run
        options:
          agent: ${vars.agent}
          input: "Skill(skill=\"sp:doc-evolve\", args=\"design-gen slug=${vars.slug}\"). Author docs/design/${vars.slug}.md from docs/plans/${vars.slug}-drafted.md; stage 04_DESIGN index edit only."
          # Declared Layer-1 role (0538 R2): routing reason beside the agent: pin.
          role: planner
          expectFile: docs/design/${vars.slug}.md
          timeoutMs: ${vars.stepTimeoutMs}

  - id: failed
    description: Terminal — planning failed a hard gate (feature-id / design-gen / check).

  - id: design-approval
    description: >
      HITL gate — the highest-leverage gate in the pipeline. Loop until the operator
      approves the design doc. Under profile=auto this state is skipped ONLY when
      vars.design_approved=true (explicit prior approval); otherwise the taste gate
      pauses even in auto mode (design doc HITL taxonomy). Loop back to design-gen
      for revisions.
    pause: true
    onEnter:
      - kind: hitl.confirm
        options:
          prompt: "Approve the design doc at docs/design/${vars.slug}.md? (Loop back to design-gen for revisions.)"

  - id: handoff
    description: >
      Terminal — design doc approved; the drafted feature list is ready. Hand off to
      sp:spur-dev (steps 7–12), which starts at `spur feature create`. The seam is the
      drafted-feature-list file at docs/plans/${vars.slug}-drafted.md.
    # Checkpoint write: record session state for resume (Phase 4, task 0171 R3)
    onEnter:
      - kind: shell
        options:
          command: 'mkdir -p .spur/memory/sessions && echo "checkpoint: planning-pipeline handoff slug=$slug ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .spur/memory/sessions/$slug-checkpoint.md'

  - id: cancelled
    description: Terminal — planning abandoned by the operator.

transitions:
  # ── start: precheck FAIL → failed; else route around phasing when profile=auto ──
  # Declaration order: FAIL first, then auto-skip, then interactive phasing.
  - from: start
    to: failed
    description: Precheck FAIL (empty slug and/or doctor red) — stop.
    guard:
      kind: shell
      options:
        command: 'test "$(cat .spur/run/$__runId-plan-precheck.status 2>/dev/null)" = FAIL'
  - from: start
    to: feature-id
    description: profile=auto and precheck PASS — skip the phasing HITL gate.
    guard:
      kind: shell
      options:
        command: 'test "$profile" = auto && test "$(cat .spur/run/$__runId-plan-precheck.status 2>/dev/null)" = PASS'
  - from: start
    to: phasing
    description: Interactive and precheck PASS — enter the phasing HITL gate.
    guard:
      kind: shell
      options:
        command: 'test "$(cat .spur/run/$__runId-plan-precheck.status 2>/dev/null)" = PASS'
  - from: start
    to: failed
    description: Defense — corrupt/missing precheck status — failed.
    guard:
      kind: always

  # ── phasing: HITL gate (reached only when profile != auto) ──
  - from: phasing
    to: feature-id
    description: Phasing decided — proceed to feature-ID derivation.
    guard:
      kind: shell
      options:
        command: 'test "$__hitlAnswer" = yes || test "$__hitlAnswer" = no'
  - from: phasing
    to: cancelled
    description: Operator cancelled planning.
    guard:
      kind: shell
      options:
        command: 'test "$__hitlAnswer" = cancel'

  # ── linear body ──
  - from: feature-id
    to: design-gen
    description: Feature ID derived — generate the design doc.
    guard:
      kind: always

  # ── design-gen → design-approval, OR skip the HITL gate when profile=auto AND design_approved=true ──
  # Auto-skip guard tried FIRST: under profile=auto with explicit prior approval,
  # route straight to handoff without entering design-approval. Without prior
  # approval, the taste gate pauses even in auto (design doc HITL taxonomy).
  - from: design-gen
    to: handoff
    description: profile=auto AND design_approved=true — skip the design-approval HITL gate.
    guard:
      kind: shell
      options:
        command: 'test "$profile" = auto && test "$design_approved" = true'
  - from: design-gen
    to: design-approval
    description: Design doc drafted — gate on human approval.
    guard:
      kind: always

  # ── design-approval: HITL gate (reached only when profile != auto) ──
  - from: design-approval
    to: handoff
    description: Design approved — hand off to sp:spur-dev.
    guard:
      kind: shell
      options:
        command: 'test "$__hitlAnswer" = yes'
  - from: design-approval
    to: design-gen
    description: Rework — operator requested design revisions.
    guard:
      kind: shell
      options:
        command: 'test "$__hitlAnswer" = no'
  - from: design-approval
    to: cancelled
    description: Operator cancelled planning.
    guard:
      kind: shell
      options:
        command: 'test "$__hitlAnswer" = cancel'
