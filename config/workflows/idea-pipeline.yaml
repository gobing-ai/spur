# Idea-to-feature pipeline — unified entry from a vague idea to a feature, AC, and a task batch
# (design docs/design/workflow-consolidation.md §3.4). YAML over the dual-workflow engine; zero new
# engine code. The pipeline STOPS at handoff — tasks are created but NOT executed; use
# task-pipeline.yaml for execution. No state inlines another pipeline's state graph.
#
# Shape: start -> discovery -> idea-eval -> feature-create -> ac-generate
#        -> system-design (conditional: needs_design signal) -> design-approval (taste)
#        -> decompose -> batch-create-run -> ready-prepare -> handoff-finalize -> handoff.
#        idea-eval rejection (or auto + `drop`) -> cancelled; ac-generate check failure and
#        batch-create failure -> their own capped retry loops -> failed.
#
# D66 1250 (design §3.4): the objective checks carry no operator pause. `feature-check` and
# `batch-create` are DELETED — their recorded results are deterministic PASS/FAIL, which every
# profile now routes on directly, so the former `profile=auto` predicates and the always fallbacks
# into those states are gone. The two discovery rescues are typed `decide` actions over the catalog
# ids in config/decisions/idea-pipeline.yaml (rescue-only, design §4): the deterministic parse runs
# first and the decide is consulted only for output the parse cannot classify. `idea-eval` and
# `design-approval` stay operator gates (taste). The start-state entry check is EXECUTOR-TYPED: a
# host run's executor is the session itself (no subprocess doctor), and a fleet run is ready exactly
# when this host wired fleet dispatch (ADR-126).
#
# Evidence instead of ceremony (task 0769): the feature check is MEASURED once at each author/revise
# boundary — `idea-ac-check` at the end of ac-generate, `idea-design-check` at the end of
# system-design — by a deterministic `command.gate` writing a run-scoped PASS/FAIL result file.
# Guards only CONSUME the recorded result; no guard re-runs the CLI.
#
# Vars (`--vars '{"idea":"…"}'`): idea (required); profile ("auto" skips the taste gates' questions —
# they answer from recorded evidence — while the objective stages route identically under every
# profile); design ("auto" default signal-driven | "skip", which also omits per-task Design);
# design_approved / idea_approved ("true" lets profile=auto route around that taste gate, default
# "false"); spurBin; agent (agent.run steps; default auto → `agent.default`); executor ("host" |
# "fleet" | "" for the tier ladder — read by the entry check and every agent.run stage).
# CLI --auto on dev-idea / dev-plan sets profile=auto AND both pre-clear vars to true.

"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
kind: state-machine
name: idea-pipeline
version: "3"
description: "Idea to feature + AC + task batch: discovery, idea-eval, feature-create, ac-generate, system-design, decompose, ready-prepare, handoff"
# Worst legal path with advertised caps ≈20 transitions; the cushion keeps the explicit retry caps
# failing first, not the engine bound.
iterationBound: 25
initialState: start
terminalStates: [handoff, cancelled, failed]
failureStates: [failed, cancelled]
vars:
  idea: ""
  profile: "standard"
  design: "auto"
  design_approved: "false"
  idea_approved: "false"
  featureId: ""
  __hitlAnswer: ""
  spurBin: "spur"
  # R8 (0366): injected by WorkflowAppService.run(); stamps discovery artifact provenance.
  __runId: ""
  agent: "auto"
  planningAgent: ""
  stepTimeoutMs: "1800000"
  # Executor for every agent.run stage (D65 R1): "host" pauses the run with a work item, "fleet"
  # dispatches through ADR-126, empty resolves the subprocess surface through the tier ladder.
  executor: ""
  # Accepted/deferred status each operator gate's decision binding writes (1236 R2).
  ideaEvalStatus: ""
  designApprovalStatus: ""

states:
  - id: start
    description: "One executor-typed entry check (D66 1250 R1): the executor-aware doctor.probe writes the executor verdict and the idea-text check writes its own named reason to the SAME status file, so a single token routes."
    onEnter:
      - kind: note
        options:
          message: "Idea pipeline start for idea: ${vars.idea}"
      - kind: doctor.probe
        options:
          resultFile: ".spur/run/${vars.__runId}-idea-precheck-doctor.status"
          spurBin: "${vars.spurBin}"
          agent: "${vars.agent}"
          role: planner
          resolvedAgentVar: planningAgent
          # B7 R1 (0894): also pin the role once — __executor.planner feeds stage dispatch so no
          # later idea stage re-walks the doctor ladder.
          roles:
            planner: "${vars.agent}"
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            printf '%s\n' "$idea" > ".spur/run/$__runId-idea-input.md" &&
            awk 'NF' ".spur/run/$__runId-idea-input.md" | grep -q . ||
            printf 'FAIL: idea text is empty\n' > ".spur/run/$__runId-idea-precheck-doctor.status"

  - id: discovery
    description: "Dispatch sp:brainstorm: approaches with trade-offs, a design summary, the needs_design signal, and the idea-evaluation report (.spur/run/${vars.__runId}-idea-eval-report.md, per the `sp:spur-dev` `idea-evaluation` reference — named by skill, not repo path). The operator's verbatim idea is persisted at .spur/run/${vars.__runId}-idea-input.md by start. expectFile fails a silent no-op discovery. D66 1250 R3: the two rescues are typed `decide` actions whose projections keep the pre-1250 fallback semantics."
    onEnter:
      - kind: agent.run
        options:
          agent: ${vars.planningAgent}
          input: "The operator's ask of record is .spur/run/${vars.__runId}-idea-input.md — idea persisted verbatim at start; authoritative, read it first (${vars.idea} is a convenience echo). Run sp:brainstorm. The skill owns the approach-generation, design summary, and `needs_design` signal criteria; emit .spur/run/${vars.__runId}-idea-needs-design.json ({\"needs_design\": true|false}) plus the design summary per its `Design Approval Gate` / `The needs_design signal` sections. Also emit the idea-evaluation report to .spur/run/${vars.__runId}-idea-eval-report.md per the `sp:spur-dev` skill's `idea-evaluation` reference (urgency/necessity 0–5, premises, pros/cons, alternatives, enhanced idea, recommendation, plus mandatory `## Requirement inventory`: numbered I<n> items quoting/paraphrasing idea-input lines; `[unclear: ...]` marks ambiguity, `[deferred: <reason>]` marks out-of-scope). End with this exact footer: `---\\nrun_id: ${vars.__runId}\\ngenerated_at: <RFC3339>\\n---` (omit if run_id is empty)."
          # Declared Layer-1 role (0538 R2) + declared fresh policy (B7 R6 / 0894).
          role: planner
          session: fresh
          expectFile: .spur/run/${vars.__runId}-idea-eval-report.md
          # The signal is this stage's own output; the plural form declares it to the work item
          # (host/fleet) while the singular expectFile stays the subprocess post-exit guard.
          expectFiles:
            - .spur/run/${vars.__runId}-idea-needs-design.json
          timeoutMs: ${vars.stepTimeoutMs}
      # Derive the eval recommendation ONCE (0769 pattern): the first non-blank line under
      # `## Recommendation` → proceed | reshape | drop | unknown. `unknown` routes to idea-eval.
      - kind: shell
        options:
          command: >-
            awk '/^## Recommendation/{f=1;next} f&&NF{r=tolower($0);exit}
            END{print (match(r,/^[*_ ]*(proceed|reshape|drop)/) ? substr(r,RSTART,RLENGTH) : "unknown")}'
            ".spur/run/$__runId-idea-eval-report.md" | tr -d '*_ ' > ".spur/run/$__runId-idea-recommendation.txt"
      # D66 1250 R3 (design §4 rescue-only): the awk parse above stays FIRST; this typed decide
      # replaces the former `spur decision run` shell and is consulted only for unclassifiable
      # output. It writes the frozen schemaVersion-1 row.
      - kind: decide
        options:
          id: idea-recommendation
          decision: idea-recommendation
          evidence:
            - .spur/run/${vars.__runId}-idea-eval-report.md
          resultFile: .spur/run/${vars.__runId}-idea-recommendation.decision
      # Projection (1250 R3): a non-model source (switch off, backend failure, low confidence) reads
      # `unknown`, so no default can auto-create a feature — it routes to the idea-eval pause.
      - kind: shell
        options:
          command: >-
            f=".spur/run/$__runId-idea-recommendation.txt";
            [ "$(cat "$f" 2>/dev/null)" = unknown ] || exit 0;
            v="$(jq -r 'if .source=="model" then .value else "unknown" end' ".spur/run/$__runId-idea-recommendation.decision" 2>/dev/null)";
            case "$v" in proceed|reshape|drop) printf '%s\n' "$v" > "$f" ;; esac
      # D66 1250 R3: the same shape for the design signal — a valid boolean short-circuits in the
      # projection; otherwise it falls back to `design` unless the model said `skip`.
      - kind: decide
        options:
          id: needs-design
          decision: needs-design
          evidence:
            - .spur/run/${vars.__runId}-idea-eval-report.md
          resultFile: .spur/run/${vars.__runId}-idea-needs-design.decision
      - kind: shell
        options:
          command: >-
            f=".spur/run/$__runId-idea-needs-design.json";
            jq -e '.needs_design|type=="boolean"' "$f" >/dev/null 2>&1 && exit 0;
            jq -e '.source=="model" and .value=="skip"' ".spur/run/$__runId-idea-needs-design.decision" >/dev/null 2>&1 &&
            printf '{"needs_design": false}\n' > "$f" || printf '{"needs_design": true}\n' > "$f"

  - id: idea-eval
    description: "HITL taste gate over the idea-evaluation report. Routed around only when profile=auto AND vars.idea_approved=true AND the recommendation is proceed/reshape; a drop recommendation cancels and a missing one asks the gate, whose evidence binding then answers under profile=auto (1236/1241)."
    onEnter:
      - kind: hitl.confirm
        options:
          prompt: "Review the idea evaluation report (.spur/run/${vars.__runId}-idea-eval-report.md). Approve to create a feature, or reject to cancel? (Reject creates no feature.)"
          decision:
            mode: evidence
            statusVar: ideaEvalStatus
            evidenceNodes:
              - discovery
      # A deferred/absent answer is the denial today's headless responder gave, so the guards keep
      # routing on yes | no | cancel with no new edge.
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run; a="$__hitlAnswer"; [ -n "$a" ] || a=no;
            printf '%s\n' "$a" > ".spur/run/$__runId-idea-eval-answer.txt"
      - kind: file.read.into-var
        options:
          path: .spur/run/${vars.__runId}-idea-eval-answer.txt
          var: __hitlAnswer

  - id: feature-create
    description: "Create a feature via `spur feature create` (or select an existing id). The agent writes the feature id plus body-only Goal/Scope intent artifacts; the shell persists both sections through `spur feature update --from-file` and fails closed on an empty artifact. Goal carries intent only — task breakdowns and checklists never enter it. The operator's verbatim ask of record stays .spur/run/${vars.__runId}-idea-input.md."
    onEnter:
      - kind: agent.run
        options:
          agent: ${vars.planningAgent}
          input: 'Create a feature for the idea. The operator''s ask of record is .spur/run/${vars.__runId}-idea-input.md — the idea argument persisted verbatim at start; treat it as the authoritative ask. Read .spur/run/${vars.__runId}-idea-eval-report.md if present for the enhanced idea and scores. Use ''spur feature create "<name>" --json'' to create it; with --json the feature id is returned under the .ref.id envelope (n), not a top-level .id — read it from there. Write the feature id to .spur/run/${vars.__runId}-idea-feature-id.txt. If an existing feature is appropriate, use its id instead. Also write two body-only intent artifacts: .spur/run/${vars.__runId}-idea-goal.md with concise Goal intent only (a short statement of what the feature achieves; never task breakdowns, checklists, or how-to steps), and .spur/run/${vars.__runId}-idea-scope.md with explicit in-scope and out-of-scope boundary bullets.'
          role: planner
          session: fresh
          expectFile: .spur/run/${vars.__runId}-idea-feature-id.txt
          # Intent artifacts this stage writes; the shell below fails closed when either is missing,
          # so declaring them adds the work-item contract, not a new precondition.
          expectFiles:
            - .spur/run/${vars.__runId}-idea-goal.md
            - .spur/run/${vars.__runId}-idea-scope.md
          timeoutMs: ${vars.stepTimeoutMs}
      - kind: file.read.into-var
        options:
          path: .spur/run/${vars.__runId}-idea-feature-id.txt
          var: featureId
      # 1007 R2: one shell persists both sections — they share the artifact precondition, so the two
      # update shells merged (original commands in order, same && fail-fast semantics).
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            test -s .spur/run/$__runId-idea-goal.md &&
            $spurBin feature update "$featureId" --section Goal --from-file .spur/run/$__runId-idea-goal.md &&
            test -s .spur/run/$__runId-idea-scope.md &&
            $spurBin feature update "$featureId" --section Scope --from-file .spur/run/$__runId-idea-scope.md

  - id: ac-generate
    description: "Author R-numbered BDD scenarios tied to the requirement inventory and persist them through `spur feature update --section \"Acceptance Criteria\" --from-file`. AC quality and requirement coverage are MEASURED once at this boundary by the `idea-ac-check` command.gate (0769; 1004 R2 folds coverage in via --inventory): a FAIL is recorded, never a run abort, so the capped retry edges can route it."
    onEnter:
      - kind: shell
        options:
          command: "mkdir -p .spur/run && count=$(cat .spur/run/$__runId-idea-ac-retry-count 2>/dev/null || echo 0); echo $((count + 1)) > .spur/run/$__runId-idea-ac-retry-count; rm -f .spur/run/$__runId-idea-ac-content.md .spur/run/$__runId-idea-ac-done.txt"
      - kind: agent.run
        options:
          agent: ${vars.planningAgent}
          input: "Generate acceptance criteria for feature ${vars.featureId}. The operator's ask of record is .spur/run/${vars.__runId}-idea-input.md — idea persisted verbatim at start; authoritative. Read the feature file and author R-numbered BDD Gherkin scenarios per ac-style-guide.md. Tie every scenario to the `## Requirement inventory` of .spur/run/${vars.__runId}-idea-eval-report.md: under each `Scenario:` heading add a comment `# covers: I1, I3` listing covered ids — every non-`[deferred: ...]` item needs at least one covering scenario. Two `spur task check` rules bind AC text: (1) AC bullets copy scenario titles verbatim — the title is the byte-identical identity key of its bullet; (2) gate-language words (HITL, approval/approved, merged/merge event, content-gate, GATED, capstone standalone) are forbidden in titles, bodies, and enum values (L4.gate-language) — rephrase around them. Output only the Acceptance Criteria section body (gherkin fence included), no commentary, no heading."
          role: planner
          session: fresh
          answerFile: .spur/run/${vars.__runId}-idea-ac-content.md
          expectFile: .spur/run/${vars.__runId}-idea-ac-content.md
          timeoutMs: ${vars.stepTimeoutMs}
      # Empty capture is a RETRYABLE outcome, not a run abort: `answerFile` always creates the file,
      # so an empty answer falls through with exit 0 and the recorded FAIL routes it back here (cap
      # 3). A failing CLI *write* still exits non-zero and aborts — that one is not retryable.
      - kind: shell
        options:
          command: >-
            if test -s .spur/run/$__runId-idea-ac-content.md; then
              $spurBin feature update "$featureId" --section "Acceptance Criteria" --from-file .spur/run/$__runId-idea-ac-content.md && date -u +%Y-%m-%dT%H:%M:%SZ > .spur/run/$__runId-idea-ac-done.txt;
            else
              exit 0;
            fi
      # 0769: ONE measured check at the AC author/revise boundary. `softFail: true` keeps a FAIL
      # routable (retry loop / failed) instead of aborting.
      - kind: command.gate
        options:
          id: idea-ac-check
          executable: "${vars.spurBin}"
          args: ["feature", "check", "${vars.featureId}", "--inventory", ".spur/run/${vars.__runId}-idea-eval-report.md"]
          resultFile: .spur/run/${vars.__runId}-idea-ac-check.status
          softFail: true
          timeoutMs: 120000
      # 0945 R2: derive the route facts ONCE at this boundary (0769 pattern) so guards read these
      # named files instead of re-deriving design×needs_design inline. Missing/corrupt needs-design
      # JSON fails safe to `design`; readiness is PASS only when the recorded check is PASS (1004 R2:
      # coverage folds into idea-ac-check via --inventory). (warn) 7 commands: two three-way
      # `test && printf || printf` derivations over captured signal files (ADR-115); no model hop.
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            { test "$design" = skip -o "$design" = auto -a "$(jq -r .needs_design .spur/run/$__runId-idea-needs-design.json 2>/dev/null)" = false &&
            printf 'skip\n' > .spur/run/$__runId-idea-design-route.txt ||
            printf 'design\n' > .spur/run/$__runId-idea-design-route.txt; } &&
            { test "$(cat .spur/run/$__runId-idea-ac-check.status 2>/dev/null)" = PASS &&
            printf 'PASS\n' > .spur/run/$__runId-idea-ac-ready.status ||
            printf 'FAIL\n' > .spur/run/$__runId-idea-ac-ready.status; }

  - id: system-design
    description: "Dispatch sp:sys-architecture (runs only on the needs_design signal) to produce ADR entries, architecture updates and design satellites. The run-scoped design-review artifact (.spur/run/${vars.__runId}-idea-design-review.md) with fixed headings `## Proposed design`, `## Operator feedback`, `## Reconciliation` carries operator rejection feedback into a revision pass, which reconciles invalidated AC through `spur feature update`. Design quality is MEASURED once at this boundary by the `idea-design-check` command.gate (0769)."
    onEnter:
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            REVIEW=".spur/run/$__runId-idea-design-review.md" &&
            test -f "$REVIEW" || printf '## Proposed design\n\n## Operator feedback\n\n## Reconciliation\n' > "$REVIEW"
      - kind: agent.run
        options:
          agent: ${vars.planningAgent}
          input: 'The operator''s ask of record is .spur/run/${vars.__runId}-idea-input.md (idea persisted verbatim at start; authoritative). Run sp:sys-architecture for feature ${vars.featureId}. Read the brainstorm artifact, feature AC, and .spur/run/${vars.__runId}-idea-design-review.md. Produce ADR entries, architecture updates, and design satellites (docs/design/<slug>.md) per the constitution edit rules; never write task or feature corpus files directly. Design-review contract (fixed headings `## Proposed design`, `## Operator feedback`, `## Reconciliation`): first pass — write the proposed summary under `## Proposed design`, leave `## Operator feedback` empty; retry after operator feedback — revise the design/ADR artifacts, document changes under `## Reconciliation`, and when feedback invalidates an Acceptance Criteria scenario write the revised AC section body to a file, persist via `$spurBin feature update "$featureId" --section "Acceptance Criteria" --from-file <file>`.'
          role: planner
          session: fresh
          expectFile: .spur/run/${vars.__runId}-idea-design-review.md
          timeoutMs: ${vars.stepTimeoutMs}
      # expectFile proves existence only and the skeleton above pre-creates the file, so an agent
      # no-op would pass it (0515 P3-2). Fail closed on the section's content.
      - kind: shell
        options:
          command: >-
            REVIEW=".spur/run/$__runId-idea-design-review.md" &&
            awk '/^## Proposed design/{f=1; next} /^## Operator feedback/{f=0} f' "$REVIEW" | grep -q '[^[:space:]]'
      # 0769: ONE measured check at the design author/revise boundary — after this pass's writes.
      - kind: command.gate
        options:
          id: idea-design-check
          executable: "${vars.spurBin}"
          args: ["feature", "check", "${vars.featureId}"]
          resultFile: .spur/run/${vars.__runId}-idea-design-check.status
          softFail: true
          timeoutMs: 120000

  - id: design-approval
    description: "HITL taste gate. Routed around only when profile=auto AND vars.design_approved=true AND the recorded design check PASSes; a FAIL still pauses here. R7 (0433): the `no` edge back to system-design is capped at 1 revise (the onEnter counter), after which the run ends failed naming this gate. Rejection must carry operator feedback in the review artifact under `## Operator feedback`. D66 1250 R2: an approved design whose recorded check FAILS routes to ac-generate (the AC revision state) — the former feature-check hop is deleted."
    onEnter:
      - kind: shell
        options:
          command: "mkdir -p .spur/run && count=$(cat .spur/run/$__runId-idea-design-reject-count 2>/dev/null || echo 0); echo $((count + 1)) > .spur/run/$__runId-idea-design-reject-count"
      - kind: hitl.confirm
        options:
          prompt: "Review the system design for feature ${vars.featureId}. Approve to proceed to decomposition? To reject, first record your feedback in .spur/run/${vars.__runId}-idea-design-review.md under the `## Operator feedback` heading, then answer no."
          decision:
            mode: evidence
            statusVar: designApprovalStatus
            evidenceNodes:
              - system-design
      # A deferred/absent answer is the denial today's headless responder gave.
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run; a="$__hitlAnswer"; [ -n "$a" ] || a=no;
            printf '%s\n' "$a" > ".spur/run/$__runId-idea-design-approval-answer.txt"
      - kind: file.read.into-var
        options:
          path: .spur/run/${vars.__runId}-idea-design-approval-answer.txt
          var: __hitlAnswer

  - id: decompose
    description: "Dispatch sp:spec-decomposition with the brainstorm artifact, feature AC and design doc. The agent produces the task-batch JSON (.spur/run/${vars.__runId}-idea-task-batch.json, validated against task-batch.schema.json) plus the private task-order sidecar (.spur/run/${vars.__runId}-idea-task-order.json — an array of { name, depends_on_names[] }; `[]` when no ordering exists). The post-agent shell validates the sidecar shape fail-closed."
    onEnter:
      - kind: shell
        options:
          command: "mkdir -p .spur/run && count=$(cat .spur/run/$__runId-idea-decompose-retry-count 2>/dev/null || echo 0); echo $((count + 1)) > .spur/run/$__runId-idea-decompose-retry-count; rm -f .spur/run/$__runId-idea-task-batch.json .spur/run/$__runId-idea-task-order.json .spur/run/$__runId-idea-batch-create.done .spur/run/$__runId-idea-batch-create.failed .spur/run/$__runId-idea-batch-create-result.json .spur/run/$__runId-idea-handoff.md .spur/run/$__runId-idea-ready.json"
      - kind: agent.run
        options:
          agent: ${vars.planningAgent}
          input: "The operator's ask of record is .spur/run/${vars.__runId}-idea-input.md (the idea argument persisted verbatim at start; authoritative). Run sp:spec-decomposition for feature ${vars.featureId} per skill references/decomposition.md § Idea-pipeline emission: sizing first, then the batch JSON at .spur/run/${vars.__runId}-idea-task-batch.json and the private task-order sidecar at .spur/run/${vars.__runId}-idea-task-order.json."
          role: planner
          session: fresh
          expectFile: .spur/run/${vars.__runId}-idea-task-batch.json
          timeoutMs: ${vars.stepTimeoutMs}
      # R1 (0518): the sidecar is the ordering contract for handoff-finalize. Fail closed on the
      # array shape, unique names on both sides, and BIDIRECTIONAL coverage (F2, 0518 verify) — a
      # partial sidecar must never silently skip `task deps` for an unlisted item (`[]` is valid).
      # (warn) stays inline by design: one jq predicate over two run-scoped files (0824).
      - kind: shell
        options:
          command: >-
            BATCH=".spur/run/$__runId-idea-task-batch.json" &&
            ORDER=".spur/run/$__runId-idea-task-order.json" &&
            jq -e --slurpfile b "$BATCH" '
              (type == "array") and
              (($b[0] | map(.name) | length) == ($b[0] | map(.name) | unique | length)) and
              ((map(.name) | length) == (map(.name) | unique | length)) and
              ((map(.name) - ($b[0] | map(.name))) | length == 0) and
              ((($b[0] | map(.name)) - map(.name)) | length == 0) and
              (((map(.depends_on_names // []) | flatten | unique) - ($b[0] | map(.name))) | length == 0)
            ' "$ORDER" >/dev/null

  - id: batch-create-run
    description: "Executes task batch creation exactly once per decomposition attempt. The side effect records a sentinel; guards only inspect sentinel/retry state. The `--json` result is captured atomically (.spur/run/${vars.__runId}-idea-batch-create-result.json, temp file + mv) and the done sentinel is written only after the JSON parses and `created == (.wbs | length)`, so handoff-finalize can zip batch names to the returned WBS list. Any failure writes the failed sentinel, preserving the retry behavior. D66 1250 R2: every profile reaches this state directly from decompose — the former `batch-create` approval state is deleted."
    onEnter:
      # (e) idempotent batch creation: sentinel + temp/mv atomicity stay inline (0824).
      - kind: shell
        options:
          command: >-
            P=".spur/run/$__runId-idea-batch-create" &&
            test ! -f "$P.done" || exit 0 &&
            rm -f "$P.failed" "$P-result.json" "$P-result.json.tmp" &&
            if $spurBin task batch-create --file .spur/run/$__runId-idea-task-batch.json --skip-ready --json > "$P-result.json.tmp" &&
              jq -e ".created == (.wbs | length)" "$P-result.json.tmp" >/dev/null 2>&1; then
              mv "$P-result.json.tmp" "$P-result.json" &&
              date -u +%Y-%m-%dT%H:%M:%SZ > "$P.done";
            else
              rm -f "$P-result.json.tmp" &&
              date -u +%Y-%m-%dT%H:%M:%SZ > "$P.failed";
            fi

  - id: ready-prepare
    description: "Ready-by-default preparation (0788): the planning owner applies the ready-refinement checklist to each created task (requirements, design, plan, ac, decisions, dependencies, premises) so the deterministic task check passes, then writes the run-scoped ready evidence sidecar (.spur/run/${vars.__runId}-idea-ready.json) with one row per task: wbs, status (ready|failed|skipped), planningDigest, and seven check rows, the premises row carrying tree-verified path:line citations (0947). Missing or failing evidence never fails the run — it degrades the handoff recommendation to ready-depth refineall."
    onEnter:
      - kind: agent.run
        options:
          agent: ${vars.planningAgent}
          role: planner
          session: fresh
          timeoutMs: ${vars.stepTimeoutMs}
          # (warn) non-slash pointer: the 0788 checklist is per-checkout (digest via the project's
          # own computePlanningDigest), so the prompt pins the skill reference; artifacts are gated
          # by answerFile/expectFile.
          input: >-
            The operator's ask of record is .spur/run/${vars.__runId}-idea-input.md (the idea
            argument persisted verbatim at start; authoritative). Run the ready-prepare stage
            for feature ${vars.featureId} per sp:spur-dev
            references/planning-workflow.md § Step 5.6 (Ready preparation): read
            .spur/run/${vars.__runId}-idea-batch-create-result.json and write
            .spur/run/${vars.__runId}-idea-ready.json. The premises check row passes only
            when each material premise was verified against the current tree and its evidence
            cites at least one verified path:line (handoff-finalize lints it; task 0947).
          answerFile: .spur/run/${vars.__runId}-ready-prepare-answer.txt
          expectFile: .spur/run/${vars.__runId}-ready-prepare-answer.txt
      # Fail-closed shape validation (mirrors the order-sidecar guard). Absence is normalized to an
      # empty sidecar so finalize degrades the recommendation to refineall instead of failing the
      # run; a PRESENT but malformed sidecar fails here — it must not masquerade as evidence.
      # (warn) stays inline by design: single jq shape predicate over the run-scoped sidecar (0824).
      - kind: shell
        options:
          command: >-
            READY=".spur/run/$__runId-idea-ready.json" &&
            if ! test -f "$READY"; then printf '{"runId":"%s","depth":"ready","tasks":[]}\n' "$__runId" > "$READY"; fi &&
            jq -e 'type == "object" and (.tasks | type == "array") and (all(.tasks[]; (.wbs | type == "string") and (.status == "ready" or .status == "failed" or .status == "skipped") and (.planningDigest | type == "string") and (.checks | type == "array") and (all(.checks[]; (.id | type == "string") and (.pass | type == "boolean") and (.evidence | type == "string")))))' "$READY" >/dev/null

  - id: handoff-finalize
    description: "Post-create finalization (0518): zip batch item names to the created WBS values (equal-length / unique-name checks), apply every non-empty depends_on_names list through `spur task deps`, refresh the feature roster, check every created task, and write the run-scoped handoff report (.spur/run/${vars.__runId}-idea-handoff.md) with exactly one next command. A mapping or CLI error fails the run before terminal handoff; an unready task is a successful planning outcome recorded as a refineall recommendation."
    onEnter:
      # (d) `spur feature handoff` owns finalization (0824; script-absorption PR-5 retired the
      # idea-handoff plugin script). A nonzero exit fails the run (fail closed) instead of silently
      # skipping finalization. The zip/deps/refresh/check/report contract is pinned by
      # finalizeIdeaHandoff unit tests, not by this file.
      - kind: shell
        options:
          command: '$spurBin feature handoff "$featureId" --run-id "$__runId" --no-logo'

  - id: handoff
    description: "Terminal — idea pipeline complete. Ordering applied, roster refreshed, and the handoff report written at .spur/run/${vars.__runId}-idea-handoff.md: feature id, task WBS list, per-task readiness, and exactly one recommended next command (ready-depth refineall when any task is unready, else auto runall). No task execution — the pipeline stops here."
    onEnter:
      # 1007 R2: the run.artifact carries the handoff (the recommended-next-command report).
      - kind: run.artifact
        options:
          path: .spur/run/${vars.__runId}-idea-handoff.md
          artifactKind: idea-handoff

  - id: cancelled
    description: "Terminal — pipeline cancelled by operator or error."

  - id: failed
    description: "Terminal — the entry check failed, or a capped retry loop exhausted (ac-generate → ac-generate or batch-create-run → decompose). The recorded status file's first line names the reason; the terminal reason identifies the exhausted edge."

# ── Routing table ──
# Declaration order is load-bearing: the engine takes the first passing guard. start's PASS edge
# precedes its reporting failure edge; discovery/idea-eval's auto-accept edges precede their gates
# (0366 R4/R5) and every gate's discriminating edge precedes its always fallback. ac-generate routes
# on the derived route facts under EVERY profile (1250 R2) — no guard re-runs the CLI (0769).
transitions:
  - {from: start, to: discovery, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-idea-precheck-doctor.status 2>/dev/null)" = PASS'}}}
  # The entry check's named reason (`FAIL: idea text is empty`, or the executor verdict) is the
  # operator's one-place explanation for a run that never left start. `>&2` precedes the stderr
  # suppression: redirections apply left to right, so the reverse order would send the line to
  # /dev/null with it.
  - {from: start, to: failed, terminalReason: failed-check, guard: {kind: shell, options: {command: 'head -1 .spur/run/$__runId-idea-precheck-doctor.status >&2 2>/dev/null; exit 0'}}}
  - {from: discovery, to: cancelled, terminalReason: cancelled, guard: {kind: shell, options: {command: 'test "$profile" = auto && test "$idea_approved" = true && grep -qx drop .spur/run/$__runId-idea-recommendation.txt'}}}
  - {from: discovery, to: feature-create, guard: {kind: shell, options: {command: 'test "$profile" = auto && test "$idea_approved" = true && grep -qxE "proceed|reshape" .spur/run/$__runId-idea-recommendation.txt'}}}
  - {from: discovery, to: idea-eval, guard: {kind: always}}
  - {from: idea-eval, to: feature-create, guard: {kind: shell, options: {command: 'test "$profile" = auto && test "$idea_approved" = true && grep -qxE "proceed|reshape" .spur/run/$__runId-idea-recommendation.txt'}}}
  - {from: idea-eval, to: feature-create, guard: {kind: shell, options: {command: 'test "$__hitlAnswer" = yes'}}}
  - {from: idea-eval, to: cancelled, terminalReason: cancelled, guard: {kind: shell, options: {command: 'test "$__hitlAnswer" = no || test "$__hitlAnswer" = cancel'}}}
  - {from: feature-create, to: ac-generate, guard: {kind: always}}
  - {from: ac-generate, to: system-design, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-idea-ac-ready.status 2>/dev/null)" = PASS && test "$(cat .spur/run/$__runId-idea-design-route.txt 2>/dev/null)" = design'}}}
  - {from: ac-generate, to: decompose, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-idea-ac-ready.status 2>/dev/null)" = PASS && test "$(cat .spur/run/$__runId-idea-design-route.txt 2>/dev/null)" = skip'}}}
  # (warn) 4 commands each: one persistent multi-assignment line captures the check status and the
  # retry count (with its 0 fallback); retry and escalation stay one test-chain pair so the cap
  # boundary is auditable in the diff (0769). The former `test "$profile" = auto` conjunct is gone.
  - {from: ac-generate, to: ac-generate, guard: {kind: shell, options: {command: 'ac_status="$(cat .spur/run/$__runId-idea-ac-check.status 2>/dev/null)" retry="$(cat .spur/run/$__runId-idea-ac-retry-count 2>/dev/null || echo 0)"; test "$ac_status" != PASS && test "$retry" -lt 3'}}}
  - {from: ac-generate, to: failed, terminalReason: retry-exhausted, guard: {kind: shell, options: {command: 'ac_status="$(cat .spur/run/$__runId-idea-ac-check.status 2>/dev/null)" retry="$(cat .spur/run/$__runId-idea-ac-retry-count 2>/dev/null || echo 0)"; test "$ac_status" != PASS && test "$retry" -ge 3'}}}
  - {from: system-design, to: decompose, guard: {kind: shell, options: {command: 'test "$profile" = auto && test "$design_approved" = true && test "$(cat .spur/run/$__runId-idea-design-check.status 2>/dev/null)" = PASS'}}}
  - {from: system-design, to: design-approval, guard: {kind: always}}
  - {from: design-approval, to: decompose, guard: {kind: shell, options: {command: 'test "$__hitlAnswer" = yes && test "$(cat .spur/run/$__runId-idea-design-check.status 2>/dev/null)" = PASS'}}}
  - {from: design-approval, to: ac-generate, guard: {kind: shell, options: {command: 'test "$__hitlAnswer" = yes && test "$(cat .spur/run/$__runId-idea-design-check.status 2>/dev/null)" != PASS'}}}
  - {from: design-approval, to: system-design, guard: {kind: shell, options: {command: 'test "$__hitlAnswer" = no && test "$(cat .spur/run/$__runId-idea-design-reject-count 2>/dev/null || echo 0)" -le 1'}}}
  - {from: design-approval, to: failed, terminalReason: retry-exhausted, guard: {kind: shell, options: {command: 'test "$__hitlAnswer" = no && test "$(cat .spur/run/$__runId-idea-design-reject-count 2>/dev/null || echo 0)" -gt 1'}}}
  - {from: design-approval, to: cancelled, terminalReason: cancelled, guard: {kind: shell, options: {command: 'test "$__hitlAnswer" = cancel'}}}
  # D66 1250 R2: the sidecar guard above validates the batch deterministically, so the deleted
  # `batch-create` approval state had no decision left to settle — every profile takes this edge.
  - {from: decompose, to: batch-create-run, guard: {kind: always}}
  - {from: batch-create-run, to: ready-prepare, guard: {kind: shell, options: {command: 'test -f .spur/run/$__runId-idea-batch-create.done'}}}
  - {from: batch-create-run, to: decompose, guard: {kind: shell, options: {command: 'test -f .spur/run/$__runId-idea-batch-create.failed && test "$(cat .spur/run/$__runId-idea-decompose-retry-count 2>/dev/null || echo 0)" -lt 3'}}}
  - {from: batch-create-run, to: failed, terminalReason: retry-exhausted, guard: {kind: shell, options: {command: 'test -f .spur/run/$__runId-idea-batch-create.failed && test "$(cat .spur/run/$__runId-idea-decompose-retry-count 2>/dev/null || echo 0)" -ge 3'}}}
  - {from: ready-prepare, to: handoff-finalize, guard: {kind: always}}
  - {from: handoff-finalize, to: handoff, guard: {kind: always}}
