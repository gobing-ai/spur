# Robin's feature-development loop: brainstorm → new-task → refine → implement → check →
# fix (until pass) → cross-agent verify. Agent-driven steps (slash commands) are modelled
# as note actions that emit the exact command the operator/agent should run; the only
# deterministic shell gate is the autofix+spur-check step, stubbed to a note here for
# dry-run shape verification (swap in the real shell command for actual use — see comment).
#
# Mode: state-machine — the check→fix retry loop is the dominant shape; one state active
# at a time; action-ok guards the short-circuit to done.
#
# Enhancement opportunity: the engine currently has no built-in action kind that drives
# an LLM agent or invokes a slash command. All /rd3:* steps are advisory (note actions).
# A future `slash` or `agent` action kind would make this workflow truly executable.
# See dogfood findings in the authoring report.
"$schema": "@gobing-ai/ts-dual-workflow-engine/schemas/state-machine-workflow.schema.json"
kind: state-machine
name: feature-dev
description: >
  Robin's end-to-end feature-development loop: brainstorm vague intent into a task,
  refine and implement it, gate on autofix+spur-check, fix until clean, then
  cross-agent verify. Agent-driven /rd3:* steps are emitted as operator notes;
  the shell gate is the only deterministic action in the loop.
# iterationBound covers the full transition count across all states.
# The linear prefix (brainstorm→new-task→refine→implement→check) consumes 4 transitions;
# each fix cycle adds 2 (check→fix, fix→check). A bound of 20 allows ~8 fix cycles
# before the engine fails the run — generous for a real feature, safe against runaway.
iterationBound: 20
initialState: brainstorm
terminalStates:
  - done
  - failed
vars:
  # Per-run override: pass --vars '{"taskId":"0042"}' when running for a real task.
  # The placeholder "TASK-ID" is intentional for dry-run shape verification.
  taskId: TASK-ID

states:
  - id: brainstorm
    description: Turn vague intent into a structured feature list via /rd3:dev-brainstorm
    onEnter:
      - kind: note
        options:
          message: "Run: /rd3:dev-brainstorm\nCaptures vague intent and produces a feature list. When done, advance to new-task."

  - id: new-task
    description: Convert the feature list into a task file via /rd3:dev-new-task
    onEnter:
      - kind: note
        options:
          message: "Run: /rd3:dev-new-task\nCreates a new task file from the feature list. Record the task ID, then advance."

  - id: refine
    description: Auto-refine the task definition via /rd3:dev-refine
    onEnter:
      - kind: note
        options:
          message: "Run: /rd3:dev-refine ${vars.taskId} --focus all --auto\nRefines scope, acceptance criteria, and subtasks. Advance when done."

  - id: implement
    description: Implement + verify the task via /rd3:dev-run
    onEnter:
      - kind: note
        options:
          message: "Run: /rd3:dev-run ${vars.taskId} --auto --verify\nImplements the task and runs built-in verification. Advance to check when done."

  - id: check
    description: >
      Gate: run autofix then the full spur-check suite.
      For dry-run shape verification this emits a note; swap in the real shell
      command for actual use:
        kind: shell
        options:
          command: "bun run autofix && bun run spur-check"
    onEnter:
      # DRY-RUN STUB: replace this note with the shell action below for real use.
      # Real command:
      #   - kind: shell
      #     options:
      #       command: "bun run autofix && bun run spur-check"
      - kind: note
        options:
          message: "STUB (dry-run): replace with shell action → bun run autofix && bun run spur-check"

  - id: fix
    description: >
      Fix failures from the check gate. The operator/agent chooses the appropriate
      sub-command based on the failure type:
        generic failures  → /rd3:dev-fixall "bun run autofix && bun run spur-check"
        unit test gaps    → /rd3:dev-unit <source-file> --auto
    onEnter:
      - kind: note
        options:
          message: "Fix failures from the check gate:\n  generic:       /rd3:dev-fixall \"bun run autofix && bun run spur-check\"\n  unit test gap: /rd3:dev-unit <source-file> --auto\nRe-run check after fixing."

  - id: verify
    description: Cross-agent verification via /rd3:dev-verify
    onEnter:
      - kind: note
        options:
          message: "Run: /rd3:dev-verify ${vars.taskId} --auto --fix all --force --channel codex/auto\nCross-agent verification pass. Advance to done on success."

  - id: done
    description: Terminal — feature implemented, checked, and verified successfully.

  - id: failed
    description: Terminal — check loop exhausted iterationBound without passing.

transitions:
  # Linear prefix: brainstorm → new-task → refine → implement → check
  - from: brainstorm
    to: new-task
    description: Feature list captured; create the task file

  - from: new-task
    to: refine
    description: Task file created; refine it

  - from: refine
    to: implement
    description: Task refined; implement it

  - from: implement
    to: check
    description: Implementation done; run the gate

  # Check gate: action-ok guard FIRST so a passing check short-circuits to verify.
  # Without this ordering the unconditional fix edge would always win.
  - from: check
    to: verify
    description: Check passed — advance to cross-agent verification
    guard:
      kind: action-ok

  - from: check
    to: fix
    description: Check failed — route to a fix attempt

  # Fix loop: always return to check after a fix attempt
  - from: fix
    to: check
    description: Fix applied; re-run the gate

  # Verify → done
  - from: verify
    to: done
    description: Verification passed — workflow complete
