# Wrap-up pipeline — post-execution wrap-up for one task or a batch (ADR-142,
# docs/design/workflow-consolidation.md §3.3). YAML over the existing dual-workflow engine; zero new
# engine code. The pipeline NEVER mutates task or feature status: it consumes completed tasks and
# produces learning/metrics/doc artifacts only (feature state belongs to feature-lifecycle).
#
# Shape: start -> task-resolve -> doc-sync -> learnings-validate -> learnings-append ->
#        doc-tripwire (1037: repo-wide tripwire over the still-uncommitted wrap diff; repair also
#        enters it; the task-resolve fast path does not) -> metrics-record ->
#        branch-cleanup (conditional: merge=true) -> done.
#
# task-resolve validates with ONE typed gate (`command.gate` on `spur task wrapup resolve`, 1249 R2):
# 0 = PASS, 1 = FAIL (malformed input, an unresolved or non-completed task, an empty __runId), anything
# else = BLOCKED (crash/timeout). FAIL/BLOCKED -> failed; a validated [] -> skipped; length>0 &&
# mode=fast -> metrics-record; else doc-sync. Only canonical four-digit WBS strings pass (whitespace
# rejected, not trimmed) and every member must resolve to done/cancelled; every consumer reads the
# run-scoped `.spur/run/<runId>-wrapup-tasks.json`, never raw vars.tasks (0770/0783), and a
# missing/corrupted capture or status refuses progression. The drift probe (0944) projects mode=fast
# only when no changed path is doc-owned and every Solution change map parsed.
#
# doc-sync is one model query that repairs doc drift (sp:doc-evolve) and captures working learnings
# (0607 R2); expectFile + soft append means an empty capture does not abort wrap-up. A contract
# violation routes to the cheap `repair` edge, never a full re-dispatch (ADR-118 pilot). 1147's
# post-doc-sync checks (write scope: docs/** minus the corpus plus the declared learnings capture,
# reported never reverted; supersession pin) precede the contract-violation edge, so a compound miss
# fails the step; 0986 rejects a nonempty narration-only capture to `repair`. Vars: tasks (a
# JSON-encoded STRING array), profile, merge (branch-cleanup HITL, consent-only), spurBin, agent.

"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
kind: state-machine
name: wrapup-pipeline
version: "12"
description: "Post-execution wrap-up: doc-sync (doc drift + learning capture), metrics, branch-cleanup"
iterationBound: 10
initialState: start
terminalStates: [done, skipped, failed]
failureStates: [failed]
vars:
  tasks: "[]"
  profile: "standard"
  merge: "false"
  spurBin: "spur"
  agent: "auto"
  __runId: ""
  mode: ""
  stepTimeoutMs: "1800000"
  # Runs `$spurBin self exec test-repo-wide` only when that action is bound, so other projects
  # no-op loudly (1229). TRUSTED CONFIG ONLY — executed via `sh -c`; never interpolate untrusted
  # input. An empty string disables the check (the hop still writes PASS).
  docTripwireCmd: 'if $spurBin self exec --list --json 2>/dev/null | jq -e ''.[] | select(.name == "test-repo-wide" and .source != "unbound")'' >/dev/null 2>&1; then $spurBin self exec test-repo-wide; else echo "wrapup: doc tripwire skipped — the test-repo-wide action is unbound; declare builder.actions.test-repo-wide to enable it" >&2; fi'
  __hitlAnswer: ""
  branchCleanupStatus: ""

states:
  - id: start
    description: "Pipeline start. Task and feature statuses are NOT mutated by wrap-up."
    onEnter:
      - kind: note
        options:
          message: "Wrap-up pipeline start for tasks: ${vars.tasks}. Task and feature statuses are NOT mutated."

  - id: task-resolve
    description: "Validate vars.tasks ONCE (canonical four-digit WBS, deduplicated, each resolved to done/cancelled) with one typed gate, then project the proportional route (0758 R1-R4, 0770, 1249 R2)."
    onEnter:
      - kind: note
        options:
          message: "Resolving task list: ${vars.tasks} (proportional mode: ${vars.mode})"
      # softFail keeps the run alive so the declared guards route the typed outcome.
      - kind: command.gate
        options:
          id: task-resolve-gate
          executable: "${vars.spurBin}"
          args: ["task", "wrapup", "resolve", "--no-logo"]
          resultFile: .spur/run/${vars.__runId}-wrapup-resolve.status
          softFail: true
      # Runs ONLY when the caller left mode empty (a caller-set mode is projected verbatim).
      - kind: shell
        options:
          command: >-
            if [ -n "$mode" ]; then printf '%s\n' "$mode" > ".spur/run/$__runId-mode.txt"; else $spurBin task wrapup drift-probe --no-logo || { rc=$?; printf '{"clean":false,"reasons":["drift probe failed (rc=%s)"],"paths":[]}' "$rc" > ".spur/run/$__runId-drift-probe.json"; printf '\n' > ".spur/run/$__runId-mode.txt"; }; fi
      - kind: file.read.into-var
        options:
          path: .spur/run/${vars.__runId}-mode.txt
          var: mode
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run .spur/memory &&
            $spurBin task wrapup route-reason --no-logo || { rc=$?; echo "task wrapup route-reason failed closed (rc=$rc)" >&2; if [ "$(cat .spur/run/$__runId-wrapup-resolve.status 2>/dev/null)" = PASS ]; then printf 'FAIL\n' > ".spur/run/$__runId-wrapup-resolve.status"; fi; }

  - id: doc-sync
    description: "Repair doc drift and capture working learnings in one model query, then run the deterministic write-scope guard and the supersession-pin re-run."
    onEnter:
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            $spurBin task wrapup doc-sync-snapshot --no-logo || echo "task wrapup doc-sync-snapshot failed (rc=$?) — the scope check fails closed on the missing snapshot" >&2
      - kind: agent.run
        onError: continue
        options:
          agent: ${vars.agent}
          input: >-
            First run Skill(skill="sp:doc-evolve", args="wrapup") to repair drift in docs/00_ADR.md, docs/03_ARCHITECTURE.md,
            docs/04_DESIGN.md, docs/design/* per constitution edit rules; do not write task/feature corpus. Write ONLY inside
            docs/ (never docs/tasks* or docs/features*) — any other changed path fails the wrap step with a scope violation.
            A row absent from docs/04_DESIGN.md for a superseded satellite is intentional: do NOT re-add it. The batch task
            list is the normalized, validated capture at .spur/run/${vars.__runId}-wrapup-tasks.json — read it for the WBS
            ids; never re-parse raw input. THEN extract working learnings from those tasks — conventions, errors fixed,
            patterns, gotchas, grouped by date and task WBS — as raw markdown (no fences) and END your final message with that
            markdown (it is captured to the run-scoped .spur/run/${vars.__runId}-wrapup-learnings.md).
          role: coder
          answerFile: .spur/run/${vars.__runId}-wrapup-learnings.md
          expectFile: .spur/run/${vars.__runId}-wrapup-learnings.md
          inputs:
            - path: .spur/run/${vars.__runId}-wrapup-tasks.json
              kind: artifact
          timeoutMs: ${vars.stepTimeoutMs}
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            $spurBin task wrapup doc-sync-scope --no-logo || { rc=$?; echo "task wrapup doc-sync-scope failed closed (rc=$rc)" >&2; printf 'scope-violation: task wrapup doc-sync-scope failed\n' > ".spur/run/$__runId-wrapup-doc-sync-scope.status"; }
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            $spurBin task wrapup doc-supersession --no-logo || { rc=$?; echo "task wrapup doc-supersession failed closed (rc=$rc)" >&2; printf 'supersession-pin-failed: task wrapup doc-supersession failed\n' > ".spur/run/$__runId-wrapup-doc-supersession.status"; }

  - id: learnings-validate
    description: "Classify a nonempty learnings capture's structural shape (date + task WBS + bullet) before appending it; empty/missing keeps the soft skip (0986)."
    onEnter:
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            S=".spur/run/$__runId-wrapup-learnings.status" &&
            F=".spur/run/$__runId-wrapup-learnings.md" &&
            if [ ! -s "$F" ] || awk '/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/{d=1} /(^|[^0-9-])[0-9][0-9][0-9][0-9]([^0-9-]|$)/{w=1} /^[[:space:]]*[-*] /{b=1} END{exit !(d+w+b==3)}' "$F"; then
              printf 'PASS\n' > "$S";
            else
              printf 'invalid-learnings-shape\n' > "$S";
            fi &&
            exit 0

  - id: learnings-append
    description: "Soft-append the captured learnings to .spur/memory/learnings.md; an empty capture skips without aborting wrap-up (0607 R2)."
    onEnter:
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run .spur/memory &&
            LEARNINGS_FILE=".spur/run/$__runId-wrapup-learnings.md" &&
            if test -s "$LEARNINGS_FILE"; then
              cat "$LEARNINGS_FILE" >> .spur/memory/learnings.md &&
              printf '\n' >> .spur/memory/learnings.md;
            else
              echo "wrapup: learning capture missing or empty at $PWD/$LEARNINGS_FILE - append skipped" >&2;
            fi &&
            exit 0

  - id: repair
    description: "Record the doc-sync contract violation (or narration-only learnings shape) and proceed through doc-tripwire without re-dispatching the agent (ADR-118 pilot, 0871; 0986)."
    onEnter:
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            R=".spur/run/$__runId-wrapup-repair.status" &&
            V="$(cat .spur/run/$__runId-wrapup-learnings.status 2>/dev/null || true)" &&
            if [ "$V" = invalid-learnings-shape ]; then printf 'invalid-learnings-shape: narration-only learnings capture — append skipped, repair recorded (0986)\n' > "$R";
            else printf 'contract-violation: doc-sync learnings capture missed its declared contract — repair skipped re-dispatch (ADR-118 pilot)\n' > "$R";
            fi &&
            exit 0

  - id: doc-tripwire
    description: "Run the trusted repo-wide tripwire over the still-uncommitted wrap diff and record PASS or FAIL to a run-scoped status file (1037; always exits 0)."
    onEnter:
      - kind: shell
        options:
          command: >-
            sh -c "$docTripwireCmd" &&
            printf 'PASS\n' > ".spur/run/$__runId-wrapup-doc-tripwire.status" ||
            printf 'FAIL\n' > ".spur/run/$__runId-wrapup-doc-tripwire.status"

  - id: metrics-record
    description: "Append one deterministic JSONL metrics row per captured task; a missing row is recorded as failure, never silently omitted as success (0770 + 0783)."
    onEnter:
      - kind: shell
        options:
          command: >-
            mkdir -p .spur/run &&
            $spurBin task wrapup metrics --no-logo || { rc=$?; echo "task wrapup metrics failed closed (rc=$rc)" >&2; printf 'FAIL\n' > ".spur/run/$__runId-wrapup-metrics.status"; }

  - id: branch-cleanup
    description: "Irreversible-operation HITL gate, consent-only: it records the operator decision and performs NO git operation itself (0770, 1236 R1/R2)."
    onEnter:
      - kind: hitl.confirm
        options:
          prompt: "Branch cleanup for the validated task list (.spur/run/${vars.__runId}-wrapup-tasks.json). This is IRREVERSIBLE (merge or delete). Confirm to proceed?"
          decision:
            mode: evidence
            statusVar: branchCleanupStatus
            evidenceNodes:
              - doc-sync

  - id: done
    description: "Terminal — wrap-up complete: tasks wrapped, learnings captured, metrics recorded, branch cleanup consent recorded only (no git operation performed by wrap-up)."
    onEnter:
      - kind: note
        options:
          message: "Wrap-up pipeline complete for the validated task list at .spur/run/${vars.__runId}-wrapup-tasks.json. Learnings at .spur/memory/learnings.md, metrics at .spur/memory/wrapup-metrics.jsonl. Branch cleanup: consent recorded only (merge=${vars.merge}); no git operation performed by wrap-up."

  - id: skipped
    description: "Terminal — wrap-up skipped (empty task list or operator abort)."

  - id: failed
    description: "Terminal — wrap-up failed: invalid wrap input, an unresolved or non-completed task, a crash or timeout at the resolve gate (BLOCKED), a failed metrics capture, a failed repo-wide tripwire (1037), or a post-doc-sync check (1147). Already-written artifacts are preserved; nothing is rolled back."

# ── Routing table ──
# Declaration order is load-bearing: the engine takes the first passing guard. task-resolve's
# gate-outcome edges precede its route edges; doc-sync's two deterministic checks precede
# contract-violation, which precedes action-ok and the executor-failure defense; each later state's
# discriminating failure edge precedes its success edge.
transitions:
  - {from: start, to: task-resolve, guard: {kind: always}}
  - {from: task-resolve, to: failed, terminalReason: failed-check, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-resolve.status 2>/dev/null)" = FAIL'}}}
  - {from: task-resolve, to: failed, terminalReason: failed-check, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-resolve.status 2>/dev/null)" = BLOCKED'}}}
  - {from: task-resolve, to: skipped, guard: {kind: shell, options: {command: 'test "$(jq length .spur/run/$__runId-wrapup-tasks.json 2>/dev/null || echo -1)" -eq 0'}}}
  - {from: task-resolve, to: metrics-record, guard: {kind: shell, options: {command: 'test "$(jq length .spur/run/$__runId-wrapup-tasks.json 2>/dev/null || echo -1)" -gt 0 && test "$mode" = fast'}}}
  - {from: task-resolve, to: doc-sync, guard: {kind: shell, options: {command: 'test "$(jq length .spur/run/$__runId-wrapup-tasks.json 2>/dev/null || echo -1)" -gt 0 && test "$mode" != fast'}}}
  - {from: task-resolve, to: failed, terminalReason: failed-check, guard: {kind: always}}
  - {from: doc-sync, to: failed, terminalReason: failed-check, guard: {kind: shell, options: {command: 'grep -q "^scope-violation:" .spur/run/$__runId-wrapup-doc-sync-scope.status 2>/dev/null'}}}
  - {from: doc-sync, to: failed, terminalReason: failed-check, guard: {kind: shell, options: {command: 'grep -q "^supersession-pin-failed:" .spur/run/$__runId-wrapup-doc-supersession.status 2>/dev/null'}}}
  - {from: doc-sync, to: repair, trigger: contract-violation, guard: {kind: contract-violation}}
  - {from: doc-sync, to: learnings-validate, guard: {kind: action-ok}}
  - {from: doc-sync, to: failed, terminalReason: failed-check, trigger: executor-failure, guard: {kind: always}}
  - {from: learnings-validate, to: repair, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-learnings.status 2>/dev/null)" = invalid-learnings-shape'}}}
  - {from: learnings-validate, to: learnings-append, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-learnings.status 2>/dev/null)" = PASS'}}}
  - {from: learnings-validate, to: failed, terminalReason: failed-check, guard: {kind: always}}
  - {from: learnings-append, to: doc-tripwire, guard: {kind: always}}
  - {from: repair, to: doc-tripwire, guard: {kind: always}}
  - {from: doc-tripwire, to: failed, terminalReason: failed-check, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-doc-tripwire.status 2>/dev/null)" = FAIL'}}}
  - {from: doc-tripwire, to: metrics-record, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-doc-tripwire.status 2>/dev/null)" = PASS'}}}
  - {from: metrics-record, to: failed, terminalReason: failed-check, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-metrics.status 2>/dev/null)" = FAIL'}}}
  - {from: metrics-record, to: branch-cleanup, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-metrics.status 2>/dev/null)" = PASS && test "$merge" = true'}}}
  - {from: metrics-record, to: done, guard: {kind: shell, options: {command: 'test "$(cat .spur/run/$__runId-wrapup-metrics.status 2>/dev/null)" = PASS && test "$merge" != true'}}}
  - {from: branch-cleanup, to: done, guard: {kind: shell, options: {command: 'test "$__hitlAnswer" = yes || test "$__hitlAnswer" = no || test "$__hitlAnswer" = cancel'}}}
  - {from: branch-cleanup, to: done, guard: {kind: always}}
