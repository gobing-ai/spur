# Task execution pipeline — one run per execution attempt of a task (design §6).
#
# Orchestration is configuration (ADR-022 / §3.2): this is YAML over the engine — zero new
# engine code. The pipeline NEVER touches files directly: task-file writes go through
# `spur task update --section` / `spur task record`, and status moves go through the normal
# `spur task update <wbs> <status>` verb so the lifecycle guards (0055) apply identically.
# Run linkage is written to `task_run_links` (kind=pipeline).
#
# Shape (D65 1239, ADR-140): precheck → implement[⇄ escalate] → gate[⇄ remediate] → review
#        → done | failed.
#        Six working states — `precheck`, `implement`, `escalate`, `gate`, `remediate`,
#        `review` — and two terminals. There is no `test`/`test-recheck` pair (`gate` owns
#        the quality gate, its mode chosen per visit), no `triage`/`test-fail-triage`/
#        `review-fail-triage` states (the same catalog decisions run inside the state that
#        produced the failure and their rows drive the transitions), no `approve` state (the
#        operator approval is a decision point at the end of `review`, 1236 R1/R2), no
#        `verify` state (`review` certifies: `spur task verdict --from-answer` derives the
#        verdict from the reviewer's own requirement traceability), and no `record` state
#        (`done`'s onEnter performs the deterministic close).
#
# Evidence model (D65 R3/R11): the run's evidence is the tree-hash gate receipt
# (`.spur/run/<wbs>-check-receipt.json`, keyed by the git tree the gate captures itself),
# the review verdict artifact written by `spur task verdict`, and the gate/review status
# tokens the transitions read. The former proof chain — `proofDigest`, `proof.fingerprint`
# captures and compares, digest-bound receipt preconditions, `run.artifact` verdict
# registration and the `verifiedOutcome` it fed — is gone; a PASS receipt is reused while
# the tree hash holds and invalidated when the tree moves. `done` closes on the verb's own
# target-aware `task check` plus the residual sweep, not on a re-asserted digest.
#
# No operator pause lives in this file (D65 R10): the only pause is the host executor's
# `agent.run` transform (1232). `escalate` asks its question through the responder and the
# approval gate answers through the decision-point responder, so an interactive run is
# answered in-session and a headless run without `--auto` answers with the responder default
# (deny / empty) instead of pausing for a later `spur workflow continue`.
#
# Vars (passed as a JSON object via `--vars`):
#   wbs                       — task WBS (required)
#   profile                   — "auto" answers the approval gate from its declared binding (R4)
#   agent / spurBin           — executor + spur binary (CLI overrides spurBin)
#   stepTimeoutMs             — agent.run budget for review/remediate (ms)
#   implementTimeoutMs        — implement agent.run budget (ms)
#   qualityGateCmd            — project gate (default: ${spurBin:-spur} self exec check)
#   qualityGateMaxFixAttempts — max /sp:dev-fixall hops after a red gate (default: 2)
#   maxEscalations            — max operator-question pauses per implement chain (default: 2)
#
# Seeded by `spur init`. agent.run inputs are pure slash commands (ADR-043).

"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
kind: state-machine
name: task-pipeline
# 0772 R2: explicit identity tag. Set only after the failure-path tests passed; the engine
# treats unversioned external definitions as supported.
# v4 (session finding after 1088): the graph routes a non-PASS review into bounded remediation.
# v5 (task 1077's inline run, 2026-10-06): the verify verdict action is explicitly `onError:
# continue` — a non-PASS verdict is data for the guards, not a state failure.
# v7 (task 1207, F511): the asserted `Confidence: HIGH|MEDIUM|LOW` machinery is retired.
# v9 (task 1239, D65 R10): the seven-state rewrite. `test`/`test-recheck` collapse into `gate`
# (one typed `command.gate` over `spur task gate`, mode by visit, tree-hash receipt reuse under
# the host-wide full-gate lock); `verify` merges into `review`, which certifies through
# `spur task verdict --from-answer` over the reviewer's requirement/AC traceability; the three
# routing states become catalog decision calls inside `gate` and `review`; `approve` becomes the
# review's operator decision point; `record` becomes `done`'s deterministic close; and the whole
# proof chain (proofDigest, `proof.fingerprint`, receipt preconditions, `run.artifact` verdict
# registration) is removed with the ADR-071 machinery (ADR-140 item 7). A contract change.
version: "9"
description: "Standard task pipeline: precheck → implement → gate (typed quality gate, tree-hash receipt) → review (verdict + R/AC traceability + operator decision) → done | failed"
# Task entity lifecycle (owned by task-lifecycle.yaml):
#   normal: backlog → todo → wip → testing → done
#   blocked is bidirectional with todo/wip/testing; done may reopen to wip.
#   any non-terminal state may transition to cancelled.
# Guards:
#   wip → testing:  spur task check <wbs>
#   testing → done: spur task check <wbs> --as done
# Invalid: todo → testing, todo → done, and wip → done.
# Pipeline states below are orchestration states, not task statuses.
iterationBound: 20
initialState: precheck
terminalStates:
    - done
    - failed
failureStates:
    - failed
vars:
    wbs: "0000"
    profile: "standard"
    mode: ""
    __runId: ""
    # PATH-independent spur invocation for shell guards/actions. The CLI overrides this
    # at run start (resolveSpurBin); the literal default is a safe fallback so direct/dry
    # runs and `workflow validate` resolve the template. (See AGENTS.md / ADR-026.)
    spurBin: "spur"
    # Agent the pipeline's agent.run steps invoke. Override per run with
    # `--vars '{"agent":"claude"}'`. `auto` is the reserved config-resolving selector:
    # `agent.default` role -> tier -> cheapest USABLE executor. A named literal here would
    # pin a box-specific binary into tracked SSOT and escape that usability ladder.
    # It does not inherit the host session's interactive model; required capability
    # attestation still gates the chosen executor before dispatch (0706).
    agent: "auto"
    # Implement-only executor override (R1, task 0454). Resolves like `agent` unless
    # overridden. The `--agent` flag (execution-batch.md §3.2) forwards into BOTH
    # `agent` and `implementAgent`, so a pinned `--agent X` reaches implement too. To
    # pin ONLY implement while other hops keep the default, pass
    # `--vars '{"implementAgent":"pi-zai"}'`.
    implementAgent: "auto"
    # Remediation can mutate code only when BOTH this cap and the task's declared
    # mutationPolicy permit code. none/tests require scoped manual repair, not fixall.
    mutationPolicy: "code"
    # Step-level timeout for agentic hops (review / remediate) in ms. The quality gate is a
    # typed command.gate (its own budget, unbounded like the former shell).
    # Raised 600s → 1800s (task 0398 R4 / H6 dogfood). Override:
    # `--vars '{"stepTimeoutMs":"120000"}'`. 30 min is headroom, not a licence to
    # run unbounded — if a hop still hits this wall, STOP and record it.
    stepTimeoutMs: "1800000"
    # Timeout for the `implement` step specifically (R2a). Implementation is the
    # heaviest agent.run step (full read/write/test-probe loop); the old 600s default
    # failed five consecutive dogfood runs (bugs 742/744/746/748). Default is 45 min
    # (task 1108); the host executor forwards it only when the host's dispatch tool
    # accepts a timeout.
    # Override per run: `--vars '{"implementTimeoutMs":"3600000"}'`.
    implementTimeoutMs: "2700000"
    # Answer captured by the review's approval decision point: "yes" | "no" | "cancel"
    # (the responder vocabulary) or "" when the declared binding deferred (no maker, or
    # `profile=auto` with the decision maker disabled). Only meaningful once `review` ran.
    __hitlAnswer: ""
    # Set beside it by the same gate when `decision.mode` is `evidence`: "accepted" when the
    # evidence answered, "deferred" when it could not (1236). Read by the review → done guard.
    approvalStatus: ""
    # Operator answer captured by the escalate hop's hitl.input (0933). Empty by
    # default; read by the escalate→implement / escalate→failed guards. Non-empty = answered.
    __hitlInput: ""
    # Project quality gate for the `gate` hop, overridable per project:
    # `--vars '{"qualityGateCmd":"bun run lint && bun run test"}'`.
    # INVARIANT (ADR-124, clarified 2026-10-07 by task 1111 R5): only the FULL tier writes PASS.
    # Under the opt-in `deferQualityGate` policy the per-task token is DEFERRED (light tier) and
    # the "review runs only after a green full gate" invariant moves to BATCH scope — nothing is
    # reported PASS without the integrated full gate on the base ref.
    # TRUSTED CONFIG ONLY — `spur task gate` passes this to the project's gate command. Never
    # interpolate untrusted operator/LLM input into qualityGateCmd (task 0436 SECUA residual).
    # The gate observes, it does not mutate: `implement` already ran `$formatCmd` on its way out,
    # and a formatter inside the gate would rewrite the tree the receipt is keyed by.
    qualityGateCmd: "${spurBin:-spur} self exec check"
    # Cheap red-detector run before the full gate on **recheck visits only**; empty ⇒ no probe.
    # A project overriding qualityGateCmd should override this too. TRUSTED CONFIG ONLY.
    gateProbeCmd: "${spurBin:-spur} self exec lint"
    # Max /sp:dev-fixall attempts for one run (bounded; no thrash). Counter:
    # .spur/run/<wbs>-test-fix-attempt. Default 2 = two fixall hops before failed.
    qualityGateMaxFixAttempts: "2"
    # Max operator-question pauses (0933) before the implement chain routes to failed.
    # Escalation counter: .spur/run/<wbs>-escalation-count. Default 2 = two answered
    # questions; a third pause routes to failed with a report note.
    maxEscalations: "2"
    # Runtime-written, 0933: the escalate hop's file.read.into-var fills this from
    # .spur/run/<wbs>-question.md; the hitl.input prompt below references it. Declared
    # here (empty) so the static var-reference validator sees the template source.
    escalationQuestion: ""
    # Post-implement auto-format. Overridable like qualityGateCmd so a non-Bun seeded
    # project can point it at its own formatter; invoked best-effort (a missing or
    # failing formatter must never abort a run — the quality gate is the real gate).
    formatCmd: "${spurBin:-spur} self exec format"
    # Bounded `file:line` anchors extracted from the failing quality-gate log by
    # `spur task gate` (deduped, max 20, space-separated on one line).
    # `remediate` reads .spur/run/<wbs>-test-gate.findings into this var and names the
    # anchors directly in the /sp:dev-fixall input, so the fix agent starts AT the failing
    # file:line instead of re-deriving it from a fresh gate run (0482 R3).
    gateFindings: ""
    # The quality-gate mode this visit runs — `run` on the first gate visit of the run,
    # `recheck` after a remediation hop, `deferred` under the opt-in batch policy. Written by
    # the gate's own shell and projected into this var (args cannot branch) — D65 1239 R2.
    gateMode: ""
    # Review depth resolved from the lane decision (0943 R1/R2): `functional` for the fast
    # lane (requirement/AC traceability only — the reviewer's R → file:line table is what
    # certifies, so the fast lane never drops the evidence), `all` for every other lane.
    reviewFocus: ""
    # Task spec path resolved at `gate` entry (also the decide evidence for the review-lane
    # routing). `docs/tasks*` is a versioned input, not a run artifact.
    taskSpecPath: ""
    # 0710 R4: task priority tier (P0..P4) extracted from the task frontmatter at `gate`
    # entry. P0/P1 make the review distinct-executor policy apply; unknown/empty priority
    # means fresh-context-only (executor reuse allowed).
    taskPriority: ""
    # Diff-scope guard on the implement hop (R1, task 0487). When the target task
    # body backticks at least one path, non-corpus changes outside those paths
    # fail the step by name. New files beside a declared file are allowed. Empty
    # (default) = on; set to "off" to bypass:
    # `--vars '{"implementScopeGuard":"off"}'`.
    implementScopeGuard: ""
    # 1111 R1: opt-in parallel-batch gate policy. When "true", `gate` runs the LIGHT tier for
    # per-task early feedback and writes `DEFERRED` (light PASS) or `FAIL` to
    # `.spur/run/<wbs>-test-gate.status` — never `PASS`, because that token means the full
    # project gate ran green on this tree. The batch orchestrator owes ONE integrated full gate
    # on the base ref over the merged slices (1111 R3). Default "false" = unchanged behavior,
    # and a stray `DEFERRED` file fails the guards.
    deferQualityGate: "false"
    # 0931 R5: parallel batches defer the per-task feature sync so a task branch never
    # touches feature files or docs/features/INDEX.md. When "true", the close's post-record
    # shell appends a deferral note and skips the sync; the parallel batch orchestrator runs
    # the sync + `spur feature refresh` once per touched feature on the base ref after
    # integration. Sequential/inline keep the default "false" (unchanged).
    deferFeatureSync: "false"

states:
    - id: precheck
      display:
          phase: implement
          phaseTitle: Implement
          title: Check task readiness
      description: >
          Fast deterministic task readiness and size checks. Failures route to the
          `failed` terminal state (not a raw lifecycle abort mid-enter).
      onEnter:
          # (e) git-status hygiene advisory; never fails the run (0487 R6 / 0511 R1). 1007 R3:
          # the F96 base-sha capture (0950) merged into this shell — original commands in order,
          # then the one-time base commit capture; a resumed run keeps its original base so
          # residual scans stay anchored to the same diff.
          - kind: shell
            options:
                command: >-
                    D=$(git status --porcelain -- . ':(exclude)docs/tasks*' ':(exclude)docs/features' 2>/dev/null); [ -z "$D" ] || printf 'precheck: WARNING - working tree has uncommitted non-corpus changes — commit or stash before starting a new task:\n%s\n' "$D"; C=$(git status --porcelain -- ':(glob)docs/tasks*/**' 2>/dev/null); [ -z "$C" ] || printf 'precheck: NOTE - task corpus has uncommitted changes — review before staging with this task:\n%s\n' "$C"; mkdir -p .spur/run; [ -f ".spur/run/$wbs-base.sha" ] || git rev-parse HEAD > ".spur/run/$wbs-base.sha"; exit 0
          # (e) auto-profile feature reopen; exit 1 when reactivation fails (0723 R3).
          - kind: shell
            options:
                command: >-
                    [ "$profile" = auto ] || exit 0; FID=$($spurBin task show $wbs --json 2>/dev/null | jq -r '.feature_id // .frontmatter.feature_id // empty' 2>/dev/null); [ -z "$FID" ] || $spurBin feature sync "$FID" --force 2>/dev/null || $spurBin feature update "$FID" active 2>/dev/null || { echo "precheck: FAIL - feature reactivation $FID failed — feature sync + feature update both errored" >&2; exit 1; }; exit 0
          # (e) route-reason lookup and routes log; proportional-routing tests locate it
          # (0759 R1/R5 run-scoped artifact; 0804 R8 run-id safety — one line, no in-scalar `#`).
          - kind: shell
            options:
                command: >-
                    mkdir -p .spur/run .spur/memory; RUN_ID="$__runId"; [ -n "$RUN_ID" ] || RUN_ID="pipeline-$wbs"; case "$RUN_ID" in *'$'*|*'{'*|*'}'*|*vars.*|*/*|*'\'*|*..*) echo "route-reason: refusing unsafe run id: $RUN_ID" >&2; exit 1 ;; esac; REASON_FILE=".spur/run/$RUN_ID-route-reason.txt"; jq -rn --arg m "$mode" '{"fast":"fast:evidence complete+consistent","":"safety:standard verification","unknown":"safety:unknown evidence quality","conflict":"safety:conflicting evidence"}[$m] // "safety:unrecognized evidence (mode=\($m))"' > "$REASON_FILE"; printf '%s %s %s\n' "$RUN_ID" "$wbs" "$(cat "$REASON_FILE")" >> .spur/memory/task-pipeline-routes.log; exit 0

          # (e) B7 R1 (0894): resolve every declared role ONCE at precheck — pins land
          # in __executor.<role> run vars so stage dispatch performs no doctor call.
          # Soft probe: failures mark the status file and stages degrade to their own
          # resolution; nothing here aborts the run.
          - kind: doctor.probe
            options:
                resultFile: ".spur/run/${vars.__runId}-precheck-roles.status"
                spurBin: "${vars.spurBin}"
                roles:
                    coder: "${vars.implementAgent}"
                    reviewer: "${vars.agent}"

    - id: implement
      display:
          phase: implement
          phaseTitle: Implement
          title: Implement
      description: >
          Run agent-driven implementation via /sp:dev-run --mode implement, THEN move the
          task to `wip` via the normal verb. The lifecycle transition fires AFTER the
          implement agent.run succeeds — onEnter runs in declaration order and the default
          'fail' policy halts the sequence (routing the run to `failed`) if the agent.run
          fails or times out, so a halted implement never leaves the task at `wip` with an
          empty Solution (the F3 half-state). The `--no-lifecycle` flag is correct here: the
          pipeline owns this transition; the FSM guard would otherwise re-run `spur task
          check`, which precheck's job.
          NOTE: this step must NOT call /sp:dev-run in full mode (the default) —
          that command DRIVES this pipeline, so calling it here recurses.
          --mode implement is the single-step implement entry.
      onEnter:
          # 0933 R27 (guard-lines compression): the transcript append lives HERE, on
          # (re-)entry, not in the escalate→implement guard. On first entry there is no
          # pending question (no-op); on a resume entry the guard already confirmed a
          # non-empty $__hitlInput and a fresh question file, so this shell records the
          # Q/A pair (## Q<n>/## A<n>, R3) and consumes the question file before the
          # agent.run re-dispatches — which also disarms the implement→escalate edge.
          - kind: shell
            options:
                command: >-
                    test -n "$__hitlInput" -a -s .spur/run/$wbs-question.md || exit 0;
                    qn="$(cat .spur/run/$wbs-escalation-count 2>/dev/null || echo 0)";
                    printf '## Q%s\n%s\n\n## A%s\n%s\n' "$qn" "$(cat .spur/run/$wbs-question.md 2>/dev/null)" "$qn" "$__hitlInput" >> .spur/run/$wbs-escalation.md;
                    rm -f .spur/run/$wbs-question.md;
                    exit 0
          - kind: agent.run
            options:
                agent: ${vars.implementAgent}
                # Pure slash command only (ADR-043). Anti-recursion / implement discipline
                # The worker's brief is OWNED BY THE SKILL, not restated here (task 1110 R3):
                # see `plugins/sp/skills/code-implementation/SKILL.md`. The YAML only names the
                # entry command.
                # Declared Layer-1 role (0538 R2/0710 R7): routing reason; no executor pin — role routing feeds the distinctness gate.
                role: coder
                # B7 R3/R6 (0894): coder stages reuse the role session — the remediation hop
                # resumes the implement session instead of re-reading the task cold.
                session: reuse
                # 0933 R28: --escalation-file names the Q/A transcript the implement
                # agent appends to when pausing and reads back on re-dispatch; absent
                # on a first attempt means "no prior escalations".
                input: /sp:dev-run --mode implement ${vars.wbs} --auto --escalation-file .spur/run/${vars.wbs}-escalation.md
                timeoutMs: ${vars.implementTimeoutMs}
                # R3 (task 0424): empty-implement no-op guard — the agent.run action
                # fails the step when exit 0 produced zero non-corpus file changes, so
                # a silent no-op routes the run to `failed` here instead of drifting
                # into gate/review and being caught a full pass later.
                requireDiff: true
                # Verification-only re-run admission (task 0976): when requireDiff
                # sees zero non-corpus changes because the implementation already
                # landed through another path, `spur task check <wbs>` PASS admits
                # the empty implement as a certification pass; a check failure
                # keeps the 0424 R3 empty-implement violation. Static option —
                # deliberately no run-var knob (ADR-115).
                requireDiffAllowCleanCheck: true
                # 0933 R26: escalation contract — the agent.run option names the QUESTION
                # file (the pause signal, deleted pre-dispatch for freshness); a paused
                # attempt (agent wrote its question there and exited 0) succeeds with
                # data.escalated=true and skips requireDiff for THAT attempt only.
                escalationFile: .spur/run/${vars.wbs}-question.md
                # 0706 R6: this stage mutates the working tree unattended under the
                # auto profile, so it declares minimum execution-capability
                # requirements. Dispatch fails closed (before spawn) when the
                # resolved executor's attestation cannot satisfy them.
                requiresCapabilities:
                    fsWrite: available
                    processSpawn: available
          # (c) command.gate owns the wip transition with classified transient retry.
          - kind: command.gate
            options:
                id: task-implement-transition
                executable: "${vars.spurBin}"
                args: ["task", "update", "${vars.wbs}", "wip", "--no-lifecycle"]
                retry:
                    maxAttempts: 2
                    delayMs: 2000
                    on: ["sqlite-busy", "ENOENT", "EBUSY", "ENOTEMPTY"]
                resultFile: .spur/run/${vars.__runId}-implement-transition.status
                softFail: false
                timeoutMs: 120000
          # Post-implement cleanup: auto-format any unformatted output the agent produced.
          # The agent may leave files that don't pass `biome check`, which then fails
          # `bun run lint` downstream (dogfood bug-733).
          # Best-effort: `; exit 0` (not `&&`) so a missing/failing formatter in a seeded
          # non-Bun project cannot abort a run mid-implement. `${vars.qualityGateCmd}` at
          # `gate` is the gate that actually decides.
          - kind: shell
            options:
                command: 'sh -c "$formatCmd" ; exit 0'
          # 1109 R3: qualify this task's unique basename anchors to repo-relative paths.
          # Placement is load-bearing: it runs AFTER implement's mutations (and the format
          # above) and BEFORE the gate reads the tree, so the receipt is keyed to the final
          # tree. `--wbs` scopes the pass to this task's resolved file.
          # Non-fatal (`; exit 0`): the done gate still reports anything left. Scope
          # contract: task 1109 R5.
          - kind: shell
            options:
                command: "$spurBin task migrate-anchors --wbs $wbs --json ; exit 0"

    # ── escalate hop (operator-question pause, 0933) ──────────────────────────
    # The implement agent paused on an operator question: it wrote
    # .spur/run/<wbs>-question.md and exited 0 (agent.run reported data.escalated=true,
    # skipping requireDiff for that attempt). This hop bounds the asks (counter), surfaces
    # the question verbatim through the HITL responder, and — once the answer lands in
    # __hitlInput — resumes implement with the Q/A transcript
    # (.spur/run/<wbs>-escalation.md) named in the implement input via --escalation-file.
    # The transcript append + question-file consumption happen in implement's onEnter so a
    # stale question can never re-trigger the hop after the answered attempt.
    # D65 1239: the ask is answered by the responder in-session (no `pause: true` remains in
    # this file); a headless run without an answer routes to failed(cancelled) with the
    # question preserved, exactly as an empty answer always did.
    - id: escalate
      display:
          phase: implement
          phaseTitle: Implement
          title: Ask operator
          show: on-entry
      description: >-
          Operator-question pause (0933): the implement agent asked a question
          headlessly; surface it to the operator and resume implement with the answer.
      onEnter:
          # Bounded asks: increment the per-task escalation counter before asking.
          - kind: shell
            options:
                command: >-
                    mkdir -p .spur/run; n="$(cat .spur/run/$wbs-escalation-count 2>/dev/null || echo 0)"; echo $((n + 1)) > .spur/run/$wbs-escalation-count; exit 0
          # The agent's question, verbatim, becomes the prompt.
          - kind: file.read.into-var
            options:
                file: .spur/run/${vars.wbs}-question.md
                var: escalationQuestion
          # Ask the operator (no pause declaration: the responder answers, and the answer is
          # written to __hitlInput for the escalate guards).
          - kind: hitl.input
            options:
                prompt: "${vars.escalationQuestion}"

    # ── gate hop (typed quality gate, one state for run/recheck visits) ───────────
    # NOT /sp:dev-unit. That command (sp:code-testing) *extends/generates* tests toward
    # a coverage target; it is not the project quality gate. Coverage gap-fill remains
    # available via router C3/C5 (`/sp:dev-unit`) or inside implement — not this hop.
    #
    # D65 1239 R2: `test` and `test-recheck` are one state. `spur task gate` owns the tier,
    # the probe, the receipt and the host-wide lock; the typed `command.gate` owns the exit
    # code (PASS/FAIL/BLOCKED) so a blocked gate routes to `failed` instead of reading as
    # red. The mode is chosen per visit: `run` on the first visit of this run (it resets the
    # attempt counter and consults the tree-hash receipt), `recheck` after a remediation hop
    # (probe-then-full), `deferred` under the opt-in batch policy.
    #
    # The three former routing states are decision CALLS here and in `review` (D65 1239 R1):
    # the lane decision (0943 R1/R2, catalog `task-semantic-risk`, 1262 R5) picks the review depth, and the
    # gate's own failure class (catalog `failure-class`) drives the red-gate transitions.
    # Both run unconditionally — the engine has no onEnter conditionals — and both degrade to
    # their catalog fallback with no model call while `workflows.decideDecisionMaker` is off.
    - id: gate
      display:
          phase: test
          phaseTitle: Test
          title: Run quality gate
      description: >
          Typed quality gate: resolve the task path/priority, produce the diffstat lane
          evidence, consult `task-semantic-risk` for the review depth (deterministic safety floor
          first), run `${vars.qualityGateCmd}` through `spur task gate <wbs> <mode>` under the
          host-wide lock (tree-hash receipt reuse on the same tree), then classify a red gate
          through `failure-class`. Writes the typed outcome to
          `.spur/run/<runId>-gate.status` and the gate's own token to
          `.spur/run/<wbs>-test-gate.status`; always a recorded outcome, never a state failure.
      onEnter:
          # (e) task path + priority resolution; fail-closed on an unresolvable spec (0751 R2,
          # 0710 R4). The path is the decide evidence for the review lane and the priority is
          # the review/executor distinctness input (0710 R4) — both are consumed downstream, so
          # an unresolved path fails here instead of degrading the run silently.
          - kind: shell
            options:
                command: 'mkdir -p .spur/run; $spurBin task path $wbs --json | jq -r ".path // .filePath // empty" > ".spur/run/$wbs-taskpath.txt"; task_path="$(cat ".spur/run/$wbs-taskpath.txt")"; if [ -z "$task_path" ]; then echo "gate: task path for $wbs did not resolve - the review evidence has no task spec" >&2; exit 1; fi; sed -n "s/^priority:[[:space:]]*//p" "$task_path" | head -1 | tr -d "[:space:]" | tr "[:lower:]" "[:upper:]" > ".spur/run/$wbs-priority.txt"'
          - kind: file.read.into-var
            options:
                path: .spur/run/${vars.wbs}-taskpath.txt
                var: taskSpecPath
          # 0710 R4: carry the task's priority tier into the review's distinctness policy.
          - kind: file.read.into-var
            options:
                path: .spur/run/${vars.wbs}-priority.txt
                var: taskPriority
          # (a) diffstat producer: `spur task diffstat` owns git reading and sensitive-path
          # classification; shell only fails closed on a non-zero exit (writes sensitive:true,
          # which the pre-guard below maps to the safety lane).
          - kind: shell
            options:
                command: >-
                    $spurBin task diffstat "$wbs" --no-logo || { echo "task-diffstat failed closed — spur task diffstat exited $?" >&2; printf '{"files":0,"insertions":0,"deletions":0,"paths":[],"sensitive":true}\n' > ".spur/run/$wbs-diffstat.json"; }; exit 0
          # (b)+(c) lane pre-guard BEFORE the decide: a caller-set mode is projected verbatim
          # (R2b); a sensitive path or >400 changed lines pins safety (R2c) and the decide
          # result is never consulted. A missing/malformed diffstat row pins safety HERE: an
          # empty mode file would let the low decide row project the fast lane downstream, so
          # the "never to fast" fail-safe is enforced at the guard, not by the projection.
          - kind: shell
            options:
                command: >-
                    mkdir -p .spur/run; if [ -n "$mode" ]; then printf '%s\n' "$mode" > ".spur/run/$wbs-mode.txt"; exit 0; fi; DF=".spur/run/$wbs-diffstat.json"; if ! jq -e 'type == "object"' "$DF" >/dev/null 2>&1; then printf 'safety\n' > ".spur/run/$wbs-mode.txt"; exit 0; fi; jq -r 'if .sensitive == true or ((.insertions // 0) + (.deletions // 0)) > 400 then "safety" else empty end' "$DF" 2>/dev/null > ".spur/run/$wbs-mode.txt"; exit 0
          # (d) lane decision (1262 R5) — one narrow question: does this change set alter
          # behaviour beyond its diffstat? `false` projects the fast lane; `true` or the catalog
          # fallback projects standard. Degrades to that fallback with no model call whenever
          # workflows.decideDecisionMaker is off (the bundled catalog owns question, criteria and
          # fallback), and `skipWhenEvidenceEmpty` keeps a missing diffstat from costing a call.
          - kind: decide
            options:
                id: task-semantic-risk
                decision: task-semantic-risk
                params:
                    wbs: ${vars.wbs}
                evidence:
                    - .spur/run/${vars.wbs}-diffstat.json
                    - ${vars.taskSpecPath}
                skipWhenEvidenceEmpty: true
                resultFile: .spur/run/${vars.wbs}-semantic-risk.decision
          # (d) project the decision and append the route reason (1007 R3: the non-empty mode
          # file is never overridden; the append keeps the failure signal of the original pair).
          # `no` (a noul row stores the label, not a boolean) → fast lane; anything else (`yes`,
          # degraded default, missing row) stays empty → the standard review path.
          - kind: shell
            options:
                command: >-
                    MF=".spur/run/$wbs-mode.txt"; [ -s "$MF" ] || jq -r 'if (.value == false or .value == "no") then "fast" else empty end' ".spur/run/$wbs-semantic-risk.decision" 2>/dev/null > "$MF"; m="$(cat "$MF")"; RUN_ID="$__runId"; [ -n "$RUN_ID" ] || RUN_ID="pipeline-$wbs"; mkdir -p .spur/memory; printf '%s %s %s\n' "$RUN_ID" "$wbs" "$(jq -rn --arg m "$m" --arg c "$mode" 'if $c != "" then ($c + ":caller-set") else {"fast":"fast:semantic-risk mechanical change","safety":"safety:deterministic-high","":"safety:standard lane"}[$m] // "safety:unrecognized mode" end')" >> .spur/memory/task-pipeline-routes.log
          # (d) review depth from the resolved lane (D65 1239 R2): the fast lane reviews the
          # requirement/AC traceability only — that table is the certification input, so the
          # cheap lane never drops the evidence, it drops the SECUA/architecture passes.
          - kind: shell
            options:
                command: >-
                    m="$(cat ".spur/run/$wbs-mode.txt" 2>/dev/null)"; if [ "$m" = fast ]; then printf 'functional\n' > ".spur/run/$wbs-review-focus.txt"; else printf 'all\n' > ".spur/run/$wbs-review-focus.txt"; fi; exit 0
          # (d) the resolved lane becomes the `mode` var for the review-depth projection.
          - kind: file.read.into-var
            options:
                path: .spur/run/${vars.wbs}-mode.txt
                var: mode
          - kind: file.read.into-var
            options:
                path: .spur/run/${vars.wbs}-review-focus.txt
                var: reviewFocus
          # D65 1239 R2 (mode by visit): the first gate visit of this run runs `run` — which
          # resets the fix-attempt counter and consults the tree-hash receipt, so a tree that
          # already passed is not re-gated (R11) — and every later visit after a remediation
          # hop runs `recheck` (probe-then-full, same host-wide lock). The visit counter is
          # run-scoped, so a stale attempt counter from an earlier run cannot start in recheck.
          # Two shells: bump the visit counter, then select the mode from the bumped value
          # (one concern each, ADR-115).
          - kind: shell
            options:
                command: >-
                    mkdir -p .spur/run; V=".spur/run/$__runId-gate-visits"; n="$(cat "$V" 2>/dev/null || echo 0)"; printf '%s\n' "$n" > ".spur/run/$wbs-gate-visit.txt"; echo $((n + 1)) > "$V"; exit 0
          - kind: shell
            options:
                command: >-
                    n="$(cat ".spur/run/$wbs-gate-visit.txt" 2>/dev/null)"; M=run; [ "$n" = 0 ] || M=recheck; [ "$deferQualityGate" = "true" ] && M=deferred; printf '%s\n' "$M" > ".spur/run/$wbs-gate-mode.txt"; exit 0
          - kind: file.read.into-var
            options:
                path: .spur/run/${vars.wbs}-gate-mode.txt
                var: gateMode
          # (d) `spur task gate` owns the gate (tier, probe, host-wide lock, tree-hash
          # receipt); the typed outcome owns the routing. `softFail` keeps a red or blocked
          # gate a RECORDED outcome — the run never dies mid-gate, and guards read
          # `.spur/run/<runId>-gate.status` (PASS | FAIL | BLOCKED). Exit 2 (usage, lock
          # timeout) is BLOCKED, never a red gate. The receipt reuse short-circuit inside
          # `run` is what makes a second visit on an unchanged tree free (R11).
          - kind: command.gate
            options:
                id: quality-gate
                executable: "${vars.spurBin}"
                args: ["task", "gate", "${vars.wbs}", "${vars.gateMode}", "--no-logo"]
                resultFile: .spur/run/${vars.__runId}-gate.status
                softFail: true
          # (d) record what the PREVIOUS gate visit's failure-class answer turned out to be
          # (1263 R3a): a recheck visit means the last class was `fix` and the repair hop ran, so
          # this visit's gate status says whether it was right. First write wins, the step never
          # changes routing, and a missing invocationId (degraded row) or a first visit is a no-op.
          - kind: shell
            options:
                command: >-
                    [ "$gateMode" = recheck ] || exit 0; ID="$(jq -r '.invocationId // empty' ".spur/run/$wbs-failure-class.decision" 2>/dev/null)"; [ -n "$ID" ] || exit 0; $spurBin decision outcome "$ID" --gate-status "$__runId" --source gate-recheck --no-logo >/dev/null 2>&1; exit 0
          # (d) failure class of the gate this visit produced (0943 R3): stop → failed
          # before the cap can mislabel it, fix → the bounded remediation hop. A missing or
          # corrupt row fails closed to failed-check. Runs unconditionally (no onEnter
          # conditionals) and degrades to the catalog `fix` fallback with no model call while
          # the decision switch is off — the green path ignores it.
          - kind: decide
            options:
                id: failure-class
                decision: failure-class
                params:
                    wbs: ${vars.wbs}
                evidence:
                    - .spur/run/${vars.wbs}-test-gate.findings
                # 1262 R4: a green gate writes a 0-byte findings file — there is nothing to read,
                # so the row degrades to the catalog `fix` fallback with no maker call and no events.
                skipWhenEvidenceEmpty: true
                resultFile: .spur/run/${vars.wbs}-failure-class.decision

    # ── remediate hop (bounded repair; former `test-fix`) ─────────────────────
    - id: remediate
      display:
          phase: test
          phaseTitle: Test
          title: Fix failures
          show: on-entry
      description: >
          Bounded auto-fix hop when the quality gate is red OR the review returned a repairable
          non-PASS: increments `.spur/run/<wbs>-test-fix-attempt` (the shared bound, so a review
          FAIL cannot buy extra attempts), projects the review verdict into the gate log when one
          exists so the repair hop sees it, then pure slash (ADR-043) `/sp:dev-fixall` against
          `${vars.qualityGateCmd}`. The next state is `gate`, whose visit-counter mode is
          `recheck`, so the chain reruns gate → review on the remediated tree.
      onEnter:
          - kind: shell
            options:
                command: >-
                    TASK_POLICY=$($spurBin task show "$wbs" --json | jq -er '.frontmatter.mutationPolicy // ([.content | scan("(?m)^mutationPolicy:[ \t]*([^ \r\n]+)[ \t]*$") | .[0]] | if length == 0 then "code" elif length == 1 then .[0] else "ambiguous" end)') || exit 1; [ "$mutationPolicy:$TASK_POLICY" = "code:code" ] || { echo "remediate: mutation policy forbids automatic code repair (run=$mutationPolicy, task=$TASK_POLICY) — gate failure preserved, no agent dispatched" >&2; exit 1; }
          # (e) attempt counter + residual artifact projection in one log append
          # (1007 R3: the two appends merged — original commands in order, exit 0).
          # (d) F96 R3 (0950): dev-fixall treats residual items as fix targets and may defer
          # P3/markers to residual-deferrals.json; this carries the structured artifact too.
          - kind: shell
            options:
                command: >-
                    printf '%s\n' "$(( $(cat ".spur/run/$wbs-test-fix-attempt" 2>/dev/null || echo 0) + 1 ))" > ".spur/run/$wbs-test-fix-attempt"; [ -f ".spur/run/$wbs-residuals.json" ] && echo '--- residual artifact (F96 fix targets; deferrals go to residual-deferrals.json, P3/markers only) ---' >> ".spur/run/$wbs-test-gate.log" && cat ".spur/run/$wbs-residuals.json" >> ".spur/run/$wbs-test-gate.log"; exit 0
          # Review-lane input: a non-PASS review status routes into this same bounded repair hop
          # (1262 R6), but it stages no gate evidence — the fixer would receive a GREEN gate log
          # and an empty findings list. Project the reviewer's answer into the same log the other
          # lane uses, and only on the review lane: remediate after a GREEN gate this run means
          # review sent it. The review status file is no lane marker — it outlives its review, so
          # a red recheck after a review repair would re-feed that stale answer.
          # Own action, not an append to the one above (ADR-115 cap).
          - kind: shell
            options:
                command: >-
                    [ "$(cat ".spur/run/$__runId-gate.status" 2>/dev/null)" = PASS ] && [ -f ".spur/run/$__runId-review-answer.txt" ] && echo '--- review verdict (remediation input, review lane) ---' >> ".spur/run/$wbs-test-gate.log" && cat ".spur/run/$__runId-review-answer.txt" >> ".spur/run/$wbs-test-gate.log"; exit 0
          # R3 (0482): project the extracted gate anchors into a var so the dispatch input
          # can NAME the failing file:line, not merely point at a log. A vars template cannot
          # run a shell, so the read is an action, not an inline `$(cat ...)` substitution.
          - kind: file.read.into-var
            options:
                path: .spur/run/${vars.wbs}-test-gate.findings
                var: gateFindings
          - kind: agent.run
            options:
                agent: ${vars.agent}
                # R3 (0482): `--findings` names the failing anchors inline; `--gate-log` remains
                # the full-context escape hatch.
                # Declared Layer-1 role (0538 R2/0710 R7): routing reason; no executor pin — role routing feeds the distinctness gate.
                role: coder
                # B7 R3/R6 (0894): coder stages reuse the role session — the fix hop
                # continues the implement session it is repairing.
                session: reuse
                input: /sp:dev-fixall "${vars.qualityGateCmd}" --gate-log .spur/run/${vars.wbs}-test-gate.log --findings "${vars.gateFindings}"
                timeoutMs: ${vars.stepTimeoutMs}
                # The captured remediation answer is the run's dispatch evidence (0823 R1):
                # expectFile fails the step when no answer was captured.
                answerFile: .spur/run/${vars.__runId}-test-fix-answer.txt
                expectFile: .spur/run/${vars.__runId}-test-fix-answer.txt
                # 0706 R6: bounded remediation hop — unattended and tree-mutating,
                # so it declares the same minimum requirements as `implement`.
                requiresCapabilities:
                    fsWrite: available
                    processSpawn: available

    # ── review hop (certification: verdict + R/AC traceability + approval decision) ──
    # D65 1239 R2: `verify` merged into `review`. The reviewer's answer must carry the
    # requirement/AC traceability table (`| Req | Status | Evidence |`, evidence = `file:line`
    # or a named test/command) — sp:functional-review produces it and the answer contract owns
    # the shape. `spur task verdict --from-answer` lints that answer, derives PASS/PARTIAL/FAIL
    # from the rows and writes the canonical `.spur/run/<wbs>-verdict.json` that `spur task
    # record` consumes for box flips and `## Testing`; a review whose rows do not resolve (an
    # UNMET requirement, a missing row, a bad AC identity) cannot derive PASS. The review-gate
    # residual check (1122) still blocks an open P1-P3 finding. Everything is folded into one
    # status token the transitions read, so a non-PASS review routes into the bounded repair
    # hop BEFORE `done` spends the close.
    - id: review
      display:
          phase: review
          phaseTitle: Review
          title: Review changes
      description: >-
          Three-dimensional code review via /sp:dev-review (functional requirements traceability
          + SECUA framework + architecture depth), findings written to `## Review`, then
          deterministic certification: `spur task verdict --from-answer` over the reviewer's
          own traceability table, the review-gate residual check, and the operator/maker
          approval decision point. Cost at this decision point (1122): open P1-P3 review
          findings block `done`; only P4 rows and DEFER-ed P3 rows are wrap residuals.
      onEnter:
          - kind: agent.run
            options:
                # 0710 R2: review always runs on a fresh session — no implementation-session
                # inheritance, no latch resume; implementation context reaches the reviewer
                # only via the persisted task spec, the recorded diff, and run artifacts.
                # 0710 R4/R5: the agent pin is deliberately gone — role: reviewer routes
                # through the executor registry, and the runner enforces (pre-dispatch,
                # fail-closed) that a P0/P1 task's review resolves a DIFFERENT executor
                # spec than the implement stage recorded in __agentRouting_implement.
                # 0943 R1/R2: `--focus` carries the resolved lane depth — `functional` for the
                # fast lane (traceability, which is the certification input), `all` otherwise.
                # D65 1240 + 1254: this answer IS the certification input — `spur task verdict --from-answer`
                # derives the run's verdict from its requirement rows, so the answer contract is part
                # of the prompt. A report body ending with a `| WBS | Verdict | P1 | … |` summary and
                # no per-requirement rows derives UNKNOWN and can never certify, which looped every
                # run through review -> remediate.
                # 1254: the review emits TWO artifacts with different consumers — the `## Review`
                # section (finding dispositions, deriveReviewConfidence) and this captured answer
                # (requirement/AC evidence, deriveVerifyConfidence). The prompt has to teach both
                # lanes and the fact that a single `Confidence:` line may only carry the second one.
                # 1254: the prompt stays inside the 1000-char composition cap — the full
                # contract (tables, vocabularies, the two confidence lanes, AC identity vs
                # feature credit) is owned by `plugins/sp/agents/super-reviewer.md` Output Format,
                # which this pointer names.
                input: >-
                    /sp:dev-review --tasks ${vars.wbs} --auto --focus ${vars.reviewFocus} Answer contract (full: super-reviewer Output
                    Format). Two artifacts: the `## Review` section (deriveReviewConfidence) and your captured answer
                    (`spur task verdict` input). The answer has one `Confidence: HIGH|MEDIUM|LOW` line, EVIDENCE-derived
                    (deriveVerifyConfidence), never the section's disposition level. End with one `Verdict: PASS|PARTIAL|FAIL` line after `| Req | Status | Evidence |` (one row per requirement; MET | PARTIAL | UNMET) and `| AC | Status |
                    Evidence Type | Evidence |` (one row per AC; MET | PARTIAL | UNMET | N/A). Evidence types (`+` ok): test
                    | command | static-ref | manual-review | llm-judge | n/a. Evidence cells cite a repo-root-relative `path:line`
                    (never `/tmp`: out-of-repo blocks done) or a named check. AC rows
                    key on the task's identities or a declared `AC-N` alias; a linked scenario covers its task and a task-local criterion
                    needs no feature credit. Open P1-P3 blocks completion.
                # The captured review answer is the run's certification input (and the
                # `task verdict` input below): expectFile fails the step when no answer landed.
                answerFile: .spur/run/${vars.__runId}-review-answer.txt
                expectFile: .spur/run/${vars.__runId}-review-answer.txt
                # Declared Layer-1 role (0538 R2/0710 R7): routing reason; no executor pin — role routing feeds the distinctness gate.
                role: reviewer
                # B7 R3/R6 (0894): declared fresh policy (reviewer default) — the action
                # result records this as declared, not defaulted. `freshSession: true` is
                # kept as the action-level hard guarantee (0710 R2 structural assertion).
                freshSession: true
                session: fresh
                priority: ${vars.taskPriority}
                compareExecutorWith: implement
                timeoutMs: ${vars.stepTimeoutMs}
          # (d) `spur task verdict` owns the answer lint and the verdict derivation (task 1003
          # R2): one complete requirement row per declared requirement, AC identities resolved,
          # status/evidence vocabularies accepted, hedged or uncited evidence rejected. It
          # writes `.spur/run/<wbs>-verdict.json` — the review verdict artifact `spur task
          # record` consumes — and exits 1 on a non-PASS verdict BY DESIGN, which `softFail`
          # records as the typed outcome the guards route. A lint failure (exit 1) is a failed
          # certification, never a warning, and there is no grep fallback.
          - kind: command.gate
            options:
                id: review-verdict
                executable: "${vars.spurBin}"
                args: ["task", "verdict", "${vars.wbs}", "--from-answer", ".spur/run/${vars.__runId}-review-answer.txt"]
                resultFile: .spur/run/${vars.__runId}-review-verdict.status
                softFail: true
          # (e) one fold, one token: PASS requires the typed verdict PASS, the artifact's own
          # PASS, and a clean review gate (open P1-P3 finding or an uncited claim blocks it).
          # Fail-closed: any missing/corrupt input leaves FAIL, so the transitions can route a
          # non-PASS review into remediation instead of dead-ending the run.
          - kind: shell
            options:
                command: >-
                    mkdir -p .spur/run; S=FAIL; if [ "$(cat ".spur/run/$__runId-review-verdict.status" 2>/dev/null)" = PASS ] && [ "$(jq -r '.verdict // empty' ".spur/run/$wbs-verdict.json" 2>/dev/null)" = PASS ] && $spurBin task residual "$wbs" review-gate --no-logo >&2; then S=PASS; fi; printf '%s\n' "$S" > ".spur/run/$wbs-review.status"; exit 0
          # (d) record the review severity as the lane decision's outcome (1263 R3b): the
          # question `task-semantic-risk` answered is "is this risky?", and the Review table's
          # worst finding is the answer as observed. Resolved rows count (a fixed P2 was still
          # risky). First write wins, so a later review visit changes nothing.
          - kind: shell
            options:
                command: >-
                    [ -f ".spur/run/$wbs-semantic-risk.decision" ] || exit 0; ID="$(jq -r '.invocationId // empty' ".spur/run/$wbs-semantic-risk.decision" 2>/dev/null)"; [ -n "$ID" ] || exit 0; $spurBin decision outcome "$ID" --review-severity "$wbs" --source "task-pipeline review" --no-logo >/dev/null 2>&1; exit 0
          # (d) Operator approval as a DECISION POINT, not a state (D65 1239 R1/R5, ADR-140
          # item 5): interactively the operator responder answers; under `profile=auto` the
          # declared binding answers (evidence status var, catalog fallback when the maker
          # degrades), so `--auto` never prompts a human and can still deny. A `no`/`cancel`
          # (or an unanswered interactive gate) routes to failed with terminalReason
          # `cancelled` — a recorded denial, distinct from a gate or review failure. The trace
          # records the answering source (operator / maker / catalog-fallback, 1236).
          - kind: hitl.confirm
            options:
                prompt: "Approve task ${vars.wbs} to proceed to completion?"
                decision:
                    mode: evidence
                    statusVar: approvalStatus
                    evidenceNodes:
                        - review
          # (e) The denial is EVIDENCE, not just a variable: fold the answer into one recorded
          # approval token the transitions read. `profile=auto` proceeds unless the maker said
          # `no` (a deferred answer is not a denial — no maker means no objection under auto);
          # interactively only an explicit `yes` approves. Fail-closed to DENIED.
          - kind: shell
            options:
                command: >-
                    mkdir -p .spur/run; A=APPROVED; if [ "$profile" = auto ]; then [ "$__hitlAnswer" = no ] && A=DENIED; else [ "$__hitlAnswer" = yes ] || A=DENIED; fi; printf '%s\n' "$A" > ".spur/run/$wbs-approval.status"; exit 0

    - id: done
      description: >
          Terminal — the task is closed deterministically. onEnter performs the close the
          former `record` state owned: `spur task record` writes Testing/Review from the review
          verdict and flips the requirement/AC boxes it proves, the residual sweep folds any
          leftover, and `spur task update <wbs> done --no-lifecycle` runs the verb's own
          target-aware `task check` as the completion gate — a task whose boxes or evidence do
          not certify cannot reach the stored `done` status.
      onEnter:
          # (c) command.gate owns the record write with classified transient retry. 0980:
          # --no-lifecycle mirrors the wip/done hops — the pipeline run is already the lifecycle
          # record, so a record-stage transition must not spawn a nested task-lifecycle run.
          - kind: command.gate
            options:
                id: task-record-close
                executable: "${vars.spurBin}"
                args: ["task", "record", "${vars.wbs}", "--solution-from-diff", "--transition", "testing", "--no-lifecycle"]
                retry:
                    maxAttempts: 2
                    delayMs: 2000
                    on: ["sqlite-busy", "ENOENT", "EBUSY", "ENOTEMPTY"]
                resultFile: .spur/run/${vars.__runId}-record.status
                softFail: false
                timeoutMs: 120000
          # (d) Best-effort `exit 0` — feature status sync is a follow-up, not a completion gate.
          # 0931 R5: with deferFeatureSync "true" (parallel mode) the deferral note lands in the
          # task report and the sync is skipped entirely, so task branches never touch feature
          # corpus files. 1004 R4: the sync is a bare `feature sync` — repeated-BLOCKED
          # suppression (0411) lives in the feature sync service itself.
          - kind: shell
            options:
                command: >-
                    if [ "$deferFeatureSync" = "true" ]; then echo "feature sync deferred to batch integration" >> ".spur/run/$wbs-report.txt"; else FID="$($spurBin task show $wbs --json 2>/dev/null | jq -r '(.feature_id // .frontmatter.feature_id) // empty' 2>/dev/null)"; if [ -n "$FID" ]; then $spurBin feature sync "$FID" --json || echo "feature sync failed — re-run: $spurBin feature sync $FID" >> ".spur/run/$wbs-report.txt"; else echo "Orphan task $wbs — no feature_id linked — proposal: consider linking to a parent feature." >> ".spur/run/$wbs-report.txt"; fi; fi; exit 0
          # (d) F96 (0983): `spur task residual` owns the sweep; shell only sequences it. The
          # scan runs AFTER `task record` flipped the verdict-proven boxes, or a proven-but-
          # unticked box folds every good run to PARTIAL and the done gate is unreachable
          # (0967). Any box still unchecked post-record stays blocking.
          # ONE hard action (scan+fold): a scanner crash fails the close closed.
          - kind: shell
            options:
                command: >-
                    $spurBin task residual "$wbs" scan --no-logo && $spurBin task residual "$wbs" fold --no-logo
          # (e) F96 R5 (0983): a sweep downgrade must reach the task record — re-record from
          # the FINAL (post-fold) artifact so Testing carries the downgraded verdict; a failed
          # task must not retain a stale PASS Testing narrative. Soft (exit 0): the downgrade
          # itself fails the re-assert below.
          # 0980: --no-lifecycle for the same orphan reason as the main record command.
          - kind: shell
            options:
                command: >-
                    verdict="$(jq -r .verdict .spur/run/$wbs-verdict.json 2>/dev/null)"; if [ -n "$verdict" ] && [ "$verdict" != PASS ]; then $spurBin task record $wbs --solution-from-diff --transition testing --no-lifecycle || echo "post-downgrade re-record failed — re-run: $spurBin task record $wbs" >&2; fi; exit 0
          # (e) The completion contract, re-asserted after the sweep: a post-record residual
          # downgrade must block the close (hard action, no `; exit 0`). The verdict artifact is
          # the review's own evidence, not a re-captured digest — the old proof re-assertion is
          # gone, the fail-closed check on the verdict it certifies is not.
          - kind: shell
            options:
                command: 'jq -e ".verdict == \"PASS\"" .spur/run/$wbs-verdict.json >/dev/null'
          # (d) F96 R4 (0950): `spur task residual` owns the settle.
          # Soft best-effort (exit 0) — runs after certification and must never change
          # the outcome; failure prints the re-run command.
          - kind: shell
            options:
                command: >-
                    $spurBin task residual "$wbs" settle --no-logo || echo "residual-settle failed — re-run: spur task residual $wbs settle" >&2; exit 0
          # (c) command.gate owns the done transition with classified transient retry. The verb
          # runs its own target-aware `task check --as done` (the completion gate) before the
          # status write, so a task that does not certify a `done` target never stores `done`.
          - kind: command.gate
            options:
                id: task-done-transition
                executable: "${vars.spurBin}"
                args: ["task", "update", "${vars.wbs}", "done", "--no-lifecycle"]
                retry:
                    maxAttempts: 2
                    delayMs: 2000
                    on: ["sqlite-busy", "ENOENT", "EBUSY", "ENOTEMPTY"]
                resultFile: .spur/run/${vars.__runId}-done-transition.status
                softFail: false
                timeoutMs: 120000
          # (e) advisory terminal checkpoint, one printf (0711 R1–R3; binding corrected 0784 R4).
          # The `digest` field now carries the gate receipt's tree hash — the run's evidence
          # identity since D65 1239 — instead of the retired proof digest (empty when no receipt
          # bound a tree, which the contract treats as "not reported").
          - kind: shell
            options:
                command: >-
                    mkdir -p .spur/memory/sessions; CP_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; CP_COMMIT="$(git rev-parse HEAD 2>/dev/null || echo unknown)"; CP_TREE="$(jq -r .inputDigest ".spur/run/$wbs-check-receipt.json" 2>/dev/null)"; printf '%s\n' '---' 'schema_version: 1' "session_id: $(date -u +%Y-%m-%d)-$wbs" 'workflow: task-pipeline' "run_id: $__runId" "task_wbs: $wbs" 'feature_id: ""' 'phase: done' 'status: done' 'last_gate: gate' "source_commit: $CP_COMMIT" "digest: $CP_TREE" "generated_at: $CP_TS" "updated_at: $CP_TS" "next_action: none - task $wbs complete" 'artifacts:' "  - .spur/run/$wbs-verdict.json" "  - .spur/run/$wbs-check-receipt.json" '---' '' '## Session Notes' '' "Terminal checkpoint for task $wbs (task-pipeline done)." 'Advisory only.' > .spur/memory/sessions/$wbs-checkpoint.md; exit 0

    - id: failed
      description: >
          Terminal — precheck, quality-gate exhaustion, a review that did not certify, a
          completion check failure, operator rejection/cancel at the approval decision point,
          or an escalation give-up; reported, not advanced.
      onEnter:
          # 0933 R30 (guard-lines compression): the escalation-bound report note lives
          # here as a conditional — no-op unless the run reached failed with a pending
          # question at (or above) the ask bound (bound pause or final give-up). The
          # unanswered question itself is appended to the task report (report.txt, R2).
          - kind: shell
            options:
                command: >-
                    n="$(cat .spur/run/$wbs-escalation-count 2>/dev/null || echo 0)";
                    test "$n" -ge "$maxEscalations" -a -s .spur/run/$wbs-question.md || exit 0;
                    printf '\n## Escalation bound reached\n\nThe implement step asked an operator question %s times (bound %s) and ended without a resumable answer. Unanswered question:\n\n' "$n" "$maxEscalations" >> .spur/run/$wbs-report.txt;
                    cat .spur/run/$wbs-question.md >> .spur/run/$wbs-report.txt;
                    exit 0
          # (d) F96 R5 (0950): `spur task residual` owns the report.
          # Soft (exit 0): a run that exhausts its fix budget on residuals leaves the
          # report + recovery line while the task stays `wip`.
          - kind: shell
            options:
                command: >-
                    $spurBin task residual "$wbs" report --no-logo || echo "residual-report failed — re-run: spur task residual $wbs report" >&2; exit 0

transitions:
    # ── precheck: task check --precheck (size + evidence + four-layer, 1002 R4) → implement; ──
    # else → failed. The flag folds the two deleted precheck scripts into one fail-closed
    # guard: any size/evidence/structural error exits 1 and the fallback edge terminates.
    - from: precheck
      to: implement
      description: Deterministic size, evidence, and task checks are green — begin implementation.
      guard:
          kind: shell
          options:
              # 1132 R4 (auto-fix-first): repair mechanically first, then judge fail-closed. The
              # `--fix` output is captured to a run artifact so the batch report can carry the
              # task-level repairs under `autoRepairs` (feature-level repairs come from the
              # `feature check --fix` preflight); only `--precheck` decides this transition.
              command: '$spurBin task check $wbs --fix --json > ".spur/run/$wbs-auto-repairs.json" 2>/dev/null ; $spurBin task check $wbs --precheck'
    - from: precheck
      to: failed
      terminalReason: failed-check
      description: Size and/or task check failed — stop before implement.
      guard:
          kind: always

    # ── implement routing: escalation first (0933 R26/R30), then the linear body ──
    # Declaration order matters: the escalation bound is checked FIRST — a paused
    # attempt that already exhausted its maxEscalations asks routes to failed (with a
    # report note appended in the same guard) instead of asking forever; then the
    # question-presence hop; then the normal always edge. The bound guard requires a
    # fresh question file so a COMPLETED implement after max asks still routes to gate.
    - from: implement
      to: failed
      terminalReason: retry-exhausted
      description: Escalation bound exhausted — the agent paused again after maxEscalations operator answers.
      # 0933 R30 (guard-lines compression): thin predicate; the report note is written
      # by the failed state's onEnter when it observes a bound-exhausted pause.
      guard:
          kind: shell
          options:
              command: >-
                  n="$(cat .spur/run/$wbs-escalation-count 2>/dev/null || echo 0)";
                  test "$n" -ge "$maxEscalations" -a -s .spur/run/$wbs-question.md
    - from: implement
      to: escalate
      description: Implement agent paused on an operator question (non-empty question file) — ask for an answer.
      guard:
          kind: shell
          options:
              command: 'test -s .spur/run/$wbs-question.md'
    # ── linear body ──
    - from: implement
      to: gate
      description: Implementation done — run the typed quality gate.
      guard:
          kind: always
    # escalate branching (0933 R27): an answered pause resumes implement — the transcript
    # append and question consumption happen in implement's onEnter (guards stay thin
    # under ADR-115 guard-lines caps); an empty answer is an operator give-up → failed
    # (question + transcript preserved as evidence).
    - from: escalate
      to: implement
      description: Operator answered — re-enter implement, which records the Q/A transcript and consumes the question.
      guard:
          kind: shell
          options:
              command: 'test -n "$__hitlInput"'
    - from: escalate
      to: failed
      terminalReason: cancelled
      description: Empty operator answer — give-up routes to failed (question + transcript preserved as evidence).
      guard:
          kind: shell
          options:
              command: 'test -z "$__hitlInput"'

    # ── gate routing (0943 R1/R3 collapsed into one state, D65 1239 R2) ──
    # Declaration order is the routing contract. PASS first (the green path), then a BLOCKED
    # typed outcome (the gate could not decide — never read as red), then the failure class:
    # stop before the cap (never mislabeled), the shared attempt cap, the fix lane, and the
    # fail-closed defense so a missing/corrupt status or decision always terminates.
    - from: gate
      to: review
      description: Quality gate green — the typed outcome is PASS and the gate wrote its own full-tier PASS token.
      guard:
          kind: shell
          options:
              # Two predicates over two result files (ADR-115): the typed `command.gate` outcome
              # says the step ran and succeeded, and the gate's own token says the FULL tier wrote
              # PASS (only the full tier writes PASS, ADR-124). A stale status file cannot ride a
              # blocked or crashed visit into review because the typed outcome must be PASS too.
              command: >-
                  test "$(cat ".spur/run/$__runId-gate.status" 2>/dev/null)" = PASS &&
                  test "$(cat ".spur/run/$wbs-test-gate.status" 2>/dev/null)" = PASS
    - from: gate
      to: review
      description: Opt-in batch policy — the typed outcome is PASS and the gate wrote the DEFERRED (light-tier) token.
      guard:
          kind: shell
          options:
              # 1111 R2: `DEFERRED` is accepted ONLY when the opt-in var is "true" — with the
              # default "false" a stray DEFERRED file fails the guard exactly like a corrupt one.
              command: >-
                  test "$deferQualityGate" = "true" &&
                  test "$(cat ".spur/run/$__runId-gate.status" 2>/dev/null)" = PASS &&
                  test "$(cat ".spur/run/$wbs-test-gate.status" 2>/dev/null)" = DEFERRED
    - from: gate
      to: failed
      terminalReason: failed-check
      description: The gate could not decide (BLOCKED — usage error, lock timeout, killed process) — stop instead of reading it as red.
      guard:
          kind: shell
          options:
              command: 'test "$(cat ".spur/run/$__runId-gate.status" 2>/dev/null)" = BLOCKED'
    - from: gate
      to: failed
      terminalReason: failed-check
      description: Failure class stop — the run terminates at failed, never bypassed.
      guard:
          kind: shell
          options:
              command: >-
                  jq -e '.value == "stop"' ".spur/run/$wbs-failure-class.decision" >/dev/null 2>&1
    - from: gate
      to: failed
      terminalReason: retry-exhausted
      description: Attempt cap reached — qualityGateMaxFixAttempts bounds the remediation lane.
      guard:
          kind: shell
          options:
              command: >-
                  fix_attempts="$(cat .spur/run/$wbs-test-fix-attempt 2>/dev/null || echo 0)";
                  test "$fix_attempts" -ge "$qualityGateMaxFixAttempts"
    - from: gate
      to: remediate
      description: Failure class fix and under the cap — the bounded repair hop, then a recheck visit of this same gate.
      guard:
          kind: shell
          options:
              command: >-
                  jq -e '.value == "fix"' ".spur/run/$wbs-failure-class.decision" >/dev/null 2>&1
    # Defense: missing/corrupt gate status or failure-class decision — fail closed.
    - from: gate
      to: failed
      terminalReason: failed-check
      description: Gate status or failure-class decision missing/corrupt — stop at failed.
      guard:
          kind: always
    - from: remediate
      to: gate
      description: Repair finished — re-enter the gate, whose visit counter selects the recheck mode.
      guard:
          kind: always

    # ── review routing (D65 1239 R2/R3): certification, approval, bounded repair ──
    # Declaration order is the contract. `done` demands the certified review status AND the
    # approval answer: under `profile=auto` a recorded maker denial (`__hitlAnswer = no`) blocks
    # it, while a deferred answer (no maker configured) is not a denial — `--auto` runs do not
    # gain a human gate they never had. Interactively only an explicit yes certifies.
    - from: review
      to: done
      description: Review certified PASS (verdict + traceability + clean review gate) and the approval decision point approved — close the task.
      guard:
          kind: shell
          options:
              # Two recorded tokens, two predicates (ADR-115): the certification status and the
              # approval status the decision point folded. Nothing is inferred from variables.
              command: >-
                  test "$(cat ".spur/run/$wbs-review.status" 2>/dev/null)" = PASS &&
                  test "$(cat ".spur/run/$wbs-approval.status" 2>/dev/null)" = APPROVED
    - from: review
      to: failed
      terminalReason: cancelled
      description: The approval decision point denied (no/cancel interactively, a maker denial under auto, or no operator answer) — a recorded denial, not a check failure.
      guard:
          kind: shell
          options:
              command: 'test "$(cat ".spur/run/$wbs-approval.status" 2>/dev/null)" = DENIED'
    - from: review
      to: failed
      terminalReason: retry-exhausted
      description: Attempt cap reached — the shared counter bounds the review repair lane too.
      guard:
          kind: shell
          options:
              command: >-
                  fix_attempts="$(cat .spur/run/$wbs-test-fix-attempt 2>/dev/null || echo 0)";
                  test "$fix_attempts" -ge "$qualityGateMaxFixAttempts"
    - from: review
      to: remediate
      description: Review did not certify and the attempt cap still allows a repair — the shared bounded repair hop, then gate → review on the remediated tree.
      guard:
          kind: shell
          options:
              # 1262 R6: no decision row and no model call. The review status file is the whole
              # signal — it exists and is not PASS — and the cap guard above already bounds the
              # loop, so a non-PASS review always has exactly one forward route.
              command: >-
                  test -f ".spur/run/$wbs-review.status" &&
                  test "$(cat ".spur/run/$wbs-review.status" 2>/dev/null)" != PASS
    # Defense: a review that did not certify and no clearer route — fail closed instead of
    # dead-ending the run (a FAIL, PARTIAL, missing or unparseable certification lands here).
    - from: review
      to: failed
      terminalReason: failed-check
      description: Review did not certify and no route classified it — stop at failed.
      guard:
          kind: always
