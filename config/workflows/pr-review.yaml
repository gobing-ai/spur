# PR-review workflow: deterministic spine for /sp:dev-pr-review (skill sp:pr-reviewing).
# Authored for the @gobing-ai/ts-dual-workflow-engine state-machine schema
# (initialState / states[].id / onEnter / top-level transitions), same family as
# basic.yaml / task-pipeline.yaml. Seeded into projects by `spur init` (scaffold manifest).
#
# Shape: check → precheck → open → review → done
#        (soft probes everywhere: red gates route to `failed`/`pending` via transitions,
#         never a raw lifecycle abort — same reliability contract as basic.yaml)
#
# This YAML is the SSOT for the review spine's state order and guards. Every state shells out to
# the four flat `spur builder pr-<verb>` verbs (task 1219); the op sequencing
# (preflight→hygiene, push→ensure, request→wait→collect) lives in `runPrVerb`, not in this file's
# shell, and no gh/git logic lives in this file. All model-bearing work — finding triage, `fix`
# mode — stays in the sp:pr-reviewing skill and never enters this machine.
#
# Non-negotiable: the external review goes through the GitHub PR + an `@codex review`
# comment. Never substitute a local Codex review mechanism.
#
# Vars (override per run: --vars '{"mode":"submit","focus":"migration safety"}'):
#   mode             — full (default) | submit | rerun
#                        full:   dedupe an up-to-date Codex review, else request + wait + collect
#                        submit: request and stop at `pending` (no wait)
#                        rerun:  request with --force even when HEAD is already reviewed
#   baseBranch       — base for a newly created PR (default: existing PR base, else repo default)
#   focus            — extra review focus appended to the @codex review request
#   noWait           — "true" returns pending right after the request instead of polling
#   waitTimeoutSec   — poll budget for Codex output (default 600)
#   waitIntervalSec  — poll interval (default 30; do not poll aggressively)
#   preReviewCmd     — project fast check run before requesting (empty = skipped).
#                      TRUSTED CONFIG ONLY — executed via `sh -c` (task 0436 SECUA residual).
#                      Never interpolate untrusted operator/LLM input into it.
#   __runId          — injected by WorkflowAppService.run(); scopes .spur/run artifacts.

"$schema": "@gobing-ai/spur/schemas/state-machine-workflow.schema.json"
version: "1"
name: pr-review
kind: state-machine
description: GitHub Codex PR-review spine — check → precheck → open → review
iterationBound: 16
initialState: check
terminalStates:
  - done
  - pending
  - failed
failureStates:
  - failed
vars:
  mode: "full"
  baseBranch: ""
  focus: ""
  noWait: "false"
  waitTimeoutSec: "600"
  waitIntervalSec: "30"
  spurBin: "spur"
  preReviewCmd: ""
  __runId: ""

states:
  - id: check
    description: >
      Soft probe: preflight (git/gh/repo checks, detached HEAD, dirty tree, base-branch refusal —
      refused before any push can publish it) followed by the hygiene scan of base...HEAD
      (secrets/.env/conflict markers BLOCK; debug residue WARNs). A preflight failure stops before
      hygiene. Writes PASS|WARN|BLOCK|FAIL to .spur/run/${vars.__runId}-pr-check.status; always
      exit 0, so a red gate routes through the transitions below.
    onEnter:
      # script-root retired for this workflow: actions call `$spurBin builder pr-<verb>` directly.
      - kind: shell
        options:
          # (e) 0825: 7 lines — preflight+hygiene and their status fallback must land together
          # (one verb now owns the whole probe; a split would half-probe the submission gate).
          command: >-
            STATUS_FILE=".spur/run/$__runId-pr-check.status";
            mkdir -p .spur/run;
            $spurBin builder pr-check --base "$baseBranch" --json --status-file "$STATUS_FILE"
            > ".spur/run/$__runId-pr-check.json";
            if [ ! -f "$STATUS_FILE" ]; then printf 'FAIL\n' > "$STATUS_FILE"; fi;
            exit 0

  - id: precheck
    description: >
      Optional project fast check (vars.preReviewCmd) before spending a review request.
      Empty command records SKIP; a red check stops the run before request (fail loud).
    onEnter:
      - kind: shell
        options:
          # (e) 0825: 7 lines — unchanged shape (optional preReviewCmd probe, SKIP/PASS/FAIL)
          # condensed onto folded one-liners to hold the §1.2 budget.
          command: >-
            mkdir -p .spur/run; if [ -z "$preReviewCmd" ]; then R=SKIP; elif sh -c "$preReviewCmd"; then R=PASS; else R=FAIL; fi; printf '%s\n' "$R" > ".spur/run/$__runId-pr-precheck.status"

  - id: open
    description: >
      Publish the branch (normal push only, never force; sets upstream when missing) and reuse or
      create its PR — a rejected push stops before any PR work. Writes FOUND|CREATED|FAIL to
      .spur/run/${vars.__runId}-pr-open.status and the composed record (push + pr) to
      .spur/run/${vars.__runId}-pr-open.json.
    onEnter:
      - kind: shell
        options:
          # (e) 0825: 7 lines — publish + PR dedupe are one verb now; the status fallback keeps a
          # silent driver from passing the gate.
          command: >-
            STATUS_FILE=".spur/run/$__runId-pr-open.status";
            mkdir -p .spur/run;
            $spurBin builder pr-open --base "$baseBranch" --json --status-file "$STATUS_FILE"
            > ".spur/run/$__runId-pr-open.json";
            if [ ! -f "$STATUS_FILE" ]; then printf 'FAIL\n' > "$STATUS_FILE"; fi;
            exit 0

  - id: review
    description: >
      Request, wait for and collect the `@codex review` result on the current pushed HEAD
      (per-HEAD dedupe unless mode=rerun; mode=submit or noWait=true stop at PENDING). Writes
      CLEAN|FINDINGS|PENDING|FAIL to .spur/run/${vars.__runId}-pr-review.status — a wait timeout
      is PENDING, never a failure — plus the composed findings record and the composite status.
    onEnter:
      - kind: shell
        options:
          # (e) 0825: 10 lines — request/wait/collect are one verb now, so their result lands
          # atomically; the status fallback covers a crashed driver. `mode=submit` or `noWait=true`
          # pass --no-wait and `mode=rerun` passes --force, each as its own space-separated word
          # (two substitutions, never concatenated). `/bin/sh -c` carries no `-e`, so a failed
          # substitution is ignored.
          command: >-
            O="$([ "$mode" = submit ] || [ "$noWait" = "true" ] && echo --no-wait) $([ "$mode" = rerun ] && echo --force)";
            STATUS_FILE=".spur/run/$__runId-pr-review.status";
            mkdir -p .spur/run;
            $spurBin builder pr-review --focus "$focus" $O --timeout "$waitTimeoutSec" --interval "$waitIntervalSec"
            --json --status-file "$STATUS_FILE" > ".spur/run/$__runId-pr-findings.json";
            if [ ! -f "$STATUS_FILE" ]; then printf 'FAIL\n' > "$STATUS_FILE"; fi;
            exit 0
      - kind: shell
        options:
          # The report reads the same composite PR/CI/Codex artifact as before (read-only, so a
          # failed probe records its own error object instead of failing the collected run).
          command: >-
            $spurBin builder pr-status --json > ".spur/run/$__runId-pr-status.json" || true

  - id: done
    description: Terminal — review collected; findings artifact at .spur/run/${vars.__runId}-pr-findings.json
  - id: pending
    description: Terminal — review requested (or timed out) but not yet collected; run /sp:dev-pr-review status later
  - id: failed
    description: Terminal — a gate went red; the stage .status/.json artifacts under .spur/run name the blocker

transitions:
  - from: check
    to: precheck
    description: Clean or warn-only — warnings ride along to the report
    guard:
      kind: shell
      options:
        command: 'grep -qE "^(PASS|WARN)$" .spur/run/$__runId-pr-check.status 2>/dev/null'
  - from: check
    to: failed
    terminalReason: failed-check
    description: BLOCK (secrets/.env/conflict markers), a preflight failure (detached HEAD, dirty tree, gh auth, no GitHub remote, or the current branch being the base branch), or a probe failure — stop before any publishing
    guard:
      kind: always

  - from: precheck
    to: open
    description: Project fast check passed or was skipped
    guard:
      kind: shell
      options:
        command: 'grep -qE "^(PASS|SKIP)$" .spur/run/$__runId-pr-precheck.status 2>/dev/null'
  - from: precheck
    to: failed
    terminalReason: failed-check
    description: Project checks red — do not spend a review request on code that fails its own gate
    guard:
      kind: always

  - from: open
    to: review
    description: Branch published and PR found or created
    guard:
      kind: shell
      options:
        command: 'grep -qE "^(FOUND|CREATED)$" .spur/run/$__runId-pr-open.status 2>/dev/null'
  - from: open
    to: failed
    terminalReason: failed-check
    description: Push rejected (e.g. non-fast-forward — report; never force-push as a workaround) or no reviewable delta or PR creation failed
    guard:
      kind: always

  - from: review
    to: done
    description: Current-HEAD review collected (CLEAN/FINDINGS)
    guard:
      kind: shell
      options:
        command: 'grep -qE "^(FINDINGS|CLEAN)$" .spur/run/$__runId-pr-review.status 2>/dev/null'
  - from: review
    to: pending
    description: Request in flight, mode=submit/noWait, or a wait timeout — pending, not failed (collect later)
    guard:
      kind: shell
      options:
        command: 'test "$(cat .spur/run/$__runId-pr-review.status 2>/dev/null)" = PENDING'
  - from: review
    to: failed
    terminalReason: failed-check
    description: Review probe itself failed (no PR, gh error, moved HEAD)
    guard:
      kind: always
