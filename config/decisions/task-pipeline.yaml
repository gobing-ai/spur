# Decision catalogs for the task pipeline (feature P1, ADR-134).
#
# The shipped `config/workflows/task-pipeline.yaml` decide actions reference these ids
# (`failure-class`). Each entry's
# reliability is measured from recorded `decision.*` events — `spur decision status
# --reliability` — and an adoption slice only keeps a decision point while that evidence
# shows it adds information the deterministic guards do not.
#
# Resolution: this file ships in the shared layer (the installed package's
# config/decisions/). A project can override it per basename through
# .spur/decisions/ or decisions.paths (first layer wins, ADR-113 style).
version: 1

defaults:
    # ADR-125 value, kept over the upstream 0.7 default.
    minConfidence: 0.8

decisions:
    failure-class:
        type: choice
        description: Is a failed quality gate fixable by the repair agent, or should the run stop?
        instructions: |
            You are classifying one failed quality-gate run for Spur's task pipeline.
            Gate output: ${params.instructions}
            Answer `fix` when the output names a concrete defect inside this repository that the
            repair agent can act on: a failing test with an expected/actual diff, a type error
            naming a file and symbol, a lint rule id with a file:line, or a missing export or
            import. Answer `stop` when the failure is environmental or not repairable by editing
            this tree: a missing tool or binary, a permission or disk error, a network or registry
            failure, a gate timeout, or output that names no in-tree file.
        parameters:
            wbs:
                type: string
                description: Task WBS whose gate failed.
        criteria:
            fix: >
                The output names an in-tree defect — a failing test, a type error with a file and
                symbol, a lint rule id with a file:line, or a missing import.
            stop: >
                The output names no in-tree defect — a missing tool, a permission or disk error,
                a network or registry failure, or a timeout — so editing the tree cannot fix it.
        fallback: fix
