# Decision catalog for the history-anatomy workflow (feature P1 / task 1098).
#
# `anatomy-validation-verdict` backs the rescue-only classification of an
# ambiguous validation artifact in config/workflows/history-anatomy.yaml
# (validate state, verdict-normalization step): the deterministic parse stays
# first, and the catalog decision runs only when the artifact's final line is
# not exactly `Verdict: PASS` and the file holds zero exact `Verdict: FAIL`
# lines. Any exact `Verdict: FAIL` line short-circuits to FAIL without calling
# a maker, so a deterministic FAIL can never be overturned (AC1). The fallback
# is FAIL — an ambiguous verdict with no model answer fails the 0771 guard,
# the same routing as before the rescue existed.
#
# Resolution: this file ships in the shared layer (the installed package's
# config/decisions/). A project can override it per basename through
# .spur/decisions/ or decisions.paths (first layer wins, ADR-113 style).
version: 1

defaults:
    # ADR-125 value, kept over the upstream 0.7 default.
    minConfidence: 0.8

decisions:
    anatomy-validation-verdict:
        type: choice
        description: >
            Does the history-anatomy validation artifact certify the candidate
            report? The evidence file is the full validation artifact; the
            answer decides which verdict line the 0771 guard reads.
        criteria:
            PASS: The artifact substantively certifies the candidate report —
                its only plausible reading is a PASS verdict.
            FAIL: The artifact does not certify the candidate report, or its
                verdict cannot be determined from the text.
        fallback: FAIL
