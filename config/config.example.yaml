# Spur project configuration example
# Seeded by `spur init` as ~/.config/spur/config.yaml on first run (never overwritten).
# Copy / adapt into a project as `.spur/config.yaml`.

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
# Config schema version (string). Current recommended: "1.1".
# "1" remains accepted; there is no hard migrator yet. Prefer "1.1" for new projects
# so editors and operators know the file targets the ADR-033 + planning shape.
version: "1.1"
name: my-project

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
# Not validated by spurConfigSchema (bootstrap is owned by runNodeApplication).
bootstrap:
  logging:
    enabled: true
    level: info # debug | info | warn | error
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log # relative to project root
  telemetry:
    enabled: false # OFF by default for CLI (per-invocation latency)
    serviceName: spur
    environment: development
    # endpoint: http://localhost:4318   # set => Node OTel exporter activates
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db # ${DATABASE_URL} interpolation supported
  scheduler:
    enabled: false # CLI is run-once; no scheduler

# ── Spur app section (validated by spurConfigSchema in @gobing-ai/spur-config) ──
# Server runtime (port/host/openBrowser) is env-backed via PORT/HOST — not a
# project-config key. See design §2.2.
agent:
  # `default` is the executor selector for `--agent auto` when stage-registry
  # routing does not apply (or as a fallback). Resolved as an executor name
  # first, then a legacy agent name.
  default: omp

  # Canonical coding-agent ids (ts-ai-runner DISPLAY_ORDER, 0.4.8+):
  #   claude, codex, gemini, pi, omp, opencode, antigravity-cli, openclaw, hermes, grok
  # Grok auth: non-empty XAI_API_KEY and/or ~/.grok/auth.json (no CLI auth-status verb).

  # Named executor profiles (ADR-033 / 0343). Each pairs a canonical agent with
  # an optional opaque model override and an explicit capability tier.
  # Live tiers: cheap | standard | capable-1 | capable-2 | capable-3
  # (1=low quality within capable, 3=high). DECLARE tier — inference never
  # invents capable-2/3. Stage routing starts on the cheapest executor whose
  # tier >= min_tier; same exact tier ties break by array order.
  # Legacy bare `capable` is accepted at runtime as synonym for capable-1.
  executors:
    - name: omp
      agent: omp
      tier: standard
    # - name: omp-zai
    #   agent: omp
    #   model: zai/glm-5.2
    #   tier: standard
    - name: grok
      agent: grok
      tier: capable-2
    - name: claude
      agent: claude
      tier: capable-3
    - name: codex
      agent: codex
      tier: capable-3
    # - name: pi
    #   agent: pi
    #   tier: capable-1

  # `default-by-phase` is a deprecated backward-compat shim (ADR-033). Prefer
  # executor `tier` + stage-registry model_policy. When present, a matching
  # phase mapping is still authoritative (fail-fast; no fall back to default)
  # and shadows stage routing for that phase.
  # default-by-phase:
  #   dev-run: omp
  #   dev-review: claude

  # Declarative teams (feature M) — materialize with `spur team up <teamId>`.
  # team:
  #   demo:
  #     name: "Demo Team"
  #     work_dir: ~/path/to/project
  #     members:
  #       - executor: claude
  #         purpose: "Lead — planning & review"
  #       - executor: omp
  #         purpose: "Implementer"

rules:
  paths:
    - .spur/rules/**/*.yaml

workflows:
  paths:
    - .spur/workflows/

redaction:
  enabled: false

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks
  folders:
    docs/tasks:
      baseCounter: 0
      label: Core
  # severity:
  #   L3.plan-format: off   # error | warning | off (known finding codes only)

features:
  dir: docs/features
