# Spur project configuration for spur-new
# Generated by `spur init`

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1"
name: spur-new

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: info # debug | info | warn | error
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log # relative to project root
  telemetry:
    enabled: false # OFF by default for CLI (per-invocation latency)
    serviceName: spur
    environment: development
    # endpoint: http://localhost:4318   # set => Node OTel exporter activates
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db # ${DATABASE_URL} interpolation supported
  scheduler:
    enabled: false # CLI is run-once; no scheduler

# ── Server runtime (env-backed: PORT / HOST override; consumed by spur serve) ──
server:
  port: 3000          # env: PORT
  host: localhost     # env: HOST
  openBrowser: true   # spur serve only; skip with --no-open
  webDistPath: null   # S5 local static asset path
# ── Spur app section (validated by a local zod schema — UNCHANGED keys) ──
agent:
  # `default` is the executor selector for `--agent auto` (resolved as an executor
  # name first, then a legacy agent name). Keep it simple, or define richer profiles:
  default: omp
  # Named executor profiles: pair a canonical agent with an optional opaque model
  # override. Referenced by name from `default` and `default-by-phase`.
  # executors:
  #   - name: omp
  #     agent: omp
  #   - name: omp-zai
  #     agent: omp
  #     model: zai//glm-5.2
  #   - name: claude
  #     agent: claude
  # Per-phase auto routing — a MAP of dev phase → executor selector. A configured
  # phase mapping is authoritative: a broken mapping fails fast (unknown executor →
  # exit 2; unusable agent → exit 1) and does NOT fall back to `default`.
  # default-by-phase:
  #   dev-run: omp-zai
  #   dev-review: claude

rules:
  paths:
    - .spur/rules/**/*.yaml

workflows:
  paths:
    - .spur/workflows/

redaction:
  enabled: false
