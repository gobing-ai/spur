# Coverage gate — per-file line coverage meets threshold from Bun's lcov output.
#
# PROVENANCE (task 1203): since task 1203 the repository post-check scripts
# (`test-post-check`, `test-post-check:full`) validate canonical coverage
# certification BEFORE this rule evaluates: only a completed successful canonical
# full-suite run (`bun run test`, `test:coverage`, `test:full`) certifies
# .coverage/lcov.info (marker: .coverage/coverage-certification.json, written by
# scripts/commands/run-tests.ts --publish-coverage). Missing/pending/superseded/
# stale-tree/byte-mismatched artifacts fail the post-check with a
# `coverage-artifact:` diagnostic before per-file findings; recovery is rerunning
# `bun run test:full`. Running this rule directly via `spur rule run` outside the
# repository wrapper bypasses that certification wrapper and is outside this
# repository's certification contract. This rule and its evaluator are unchanged.
#
# Absorbed from ts-libs/.spur/rules/quality/coverage-gate.yaml, re-scoped to
# Spur's monorepo layout:
#   - lcovPath kept at .coverage/lcov.info (Spur's `bun run test:coverage`
#     writes it via --coverage-dir=.coverage, and `bunfig.toml
#     [test] coverage = true` means a plain `bun run test` writes the same
#     artifact — so a TARGETED `bun test <file>` overwrites it with a partial
#     tracefile, and this rule then judges that partial data)
#   - include expanded to apps/** + packages/** (Spur tests cover both;
#     ts-libs only covers packages/**)
#   - threshold kept at 90 matching bunfig.toml coverageThreshold
#   - no drizzle exclude needed (Spur doesn't vendor generated SQL in src/)
#
# Scope tightened to production source only. No per-file exclusions: every
# measured source file must meet the threshold. (Former vendors/stubs/schema/
# migrations/db exclusions were verified stale — all measured files pass 90%.)
rules:
  - id: coverage-gate
    description: "Per-file line coverage meets 90% threshold (read from lcov)"
    severity: error
    evaluator:
      type: coverage-gate
      config:
        lcovPath: .coverage/lcov.info
        threshold: 90
        include:
          - "apps/**/src/**"
          - "packages/**/src/**"
