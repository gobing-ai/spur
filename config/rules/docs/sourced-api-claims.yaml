# Sourced-claims rules (docs corpus) — API/library claims in markdown must be
# verifiable. A bare version string or a time-anchored API claim ("deprecated
# since", "added in 0.5.x") on a line with no citation anchor (http(s) URL or a
# repo path:line reference) is an unverifyable claim: readers cannot tell
# measured fact from model memory. The deterministic scan is line-level and
# heuristic — code fences and command examples can legitimately carry bare
# versions, so severity is info (advisory visibility; the recommended-pre-check
# gate runs --fail-on warning, so this rule surfaces findings for review without
# reddening gates — changed-file enforcement happens in SECUA review).
#
# Calibration audit (2026-10-12, `spur rule run --file … --json`, unsuppressed):
# the category was pulled from `recommended-pre-check` on 2026-10-08 for "finding
# noise" — 593 findings. The audit split them 580 `cited-version-strings` /
# 13 `cited-api-claims`, and 579 of the 580 were false positives on two shapes
# that are not external claims at all: a document's own version
# (`docs/00_ADR.md:5` → `version: 1.69.0`), a section number in a heading
# (`docs/04_DESIGN.md:116` → `### 1.0.1 Shared option registry`) and a
# `§`-numbered cross-reference (`docs/00_ADR.md:1118` → `§1.2.1`). All three are
# excluded by the pattern below — the first two on the line's shape, the third on
# the token itself. The remaining source was a stale exclude list that stopped at
# `docs/tasks4/` while the active corpus folder is `docs/tasks5/`, which alone
# produced 226 findings; it is now one `docs/tasks*/**` glob. 593 → 330 after those
# two fixes, then 277 once the `§` shape was excluded too — the residual are
# version-pinned package claims that genuinely lack a same-line anchor, and they
# stay visible rather than suppressed.
#
# Semantic contract — every external API/library claim carries a source
# citation (URL or path:line) AND a confidence level (HIGH/MEDIUM/LOW) — owned
# by the sp-source-driven-development skill and verified in SECUA review
# (code-verification secu-review checklist). These rules are its deterministic
# backstop: the `cited-*` rules cover the citation half, the `*-confidence` pair
# covers the level half, and `cited-high-confidence` covers the HONESTY half —
# the level is a claim like any other, so the one level that asserts "verified
# this session" must show the source it was verified against. MEDIUM (recalled,
# plausibly stale) and LOW (memory only) require no anchor by contract and are
# deliberately not flagged. All are severity `info`,
# and the category is deliberately NOT in `recommended-pre-check` — it surfaces
# findings for review without reddening gates. The 2026-10-12 audit below settled
# the promotion question: the residual findings stay a review-surface concern
# (SECUA checklist), not a gate one — do not add `- docs` to that preset.
#
# Fenced-code behavior (measured 2026-10-16, `spur rule run --file … --json` over a
# probe doc): code fences are NOT skipped by the regex evaluator — every rule here
# fires on a matching line inside a fence. The earlier note claiming fenced lines
# were "out of regex reach" was wrong; fence noise is one more reason these stay
# `info` and ad hoc rather than gated.
#
# Coverage widening (2026-10-16) — the contract above says "every external
# API/library claim", but the vocabulary covered only five time-anchored verbs,
# so declaration-style claims were never scanned. Candidate verbs were measured
# against this include set before any was added (one probe rule per candidate, the
# same anchor lookahead the real rules use; counts are uncited lines):
#
#   requires 350 · no longer 150 · defaults to 70 · supports 55 · replaced by 21 ·
#   since|as of|from <x.y> 18 · removed in|since 7 · renamed to|in 1 ·
#   [the five existing verbs: 8]
#
# Sampling the hits settled it: `requires`/`supports`/`defaults to`/`no longer`
# fire on prose about THIS repo's own behaviour ("safety requires closure without
# manufacturing fast-path evidence", "Task frontmatter supports
# `feature_link_declined`", "`--from` defaults to `operator`") and on historical
# amendment records ("`.spur/agents/*` are no longer generated"). None is the
# external claim the contract means, and adding them would restore the 593-finding
# shape that got this category pulled. So only claims whose SHAPE vouches for a
# version were added:
#
#   `(?:since|as of) <version>` — the number is pinned to a full semver or a
#   `v`-prefixed pair, so a bare two-component form cannot match a quantity (the
#   loose probe matched "up from 32.6 to 205.4", and `from` as a verb was dropped
#   outright for it).
#   `removed (?:in|since) <version>` — the loose form's 7 hits were all task ids or
#   substitution records ("removed in task 0452", "`X` was removed in favour of
#   `Y`"); requiring a version silences those, and currently matches nothing.
#
# Dropped on the same evidence: `renamed (?:to|in)` (its one hit was an internal
# refactor note, and the shape carries no version to vouch for it) and `replaced by`
# (21 hits, all internal refactor records). Re-measure before widening again — the
# zero-false-positive verbs here are the ones the shape itself vouches for.
#
# Measured effect of the widening (2026-10-16): `cited-api-claims` /
# `cited-api-claims-confidence` went 8/8 → 10/10 findings before the excludes
# below. Two lines are new and both are real version claims —
# `plugins/sp/skills/spur-cli/references/rules/validation-and-extension.md:52`
# ("fixers (since 0.3.4)", in the final run) and
# `docs/plans/2026-06-10-rd3-migration-feature-list.md:193` ("run persistence since
# 0.3.16", dropped by the historical excludes below rather than by the pattern);
# the rest were already baseline-vocabulary hits. `cited-high-confidence` gained
# the same verbs and still reports 0.
#
# Level half for version lines (2026-10-16) — `cited-version-strings` checked the
# anchor half of a version claim but never the level half, so the family had no
# `cited-version-strings-confidence` counterpart. The new rule closes it, matching
# its `cited-api-claims`/`cited-api-claims-confidence` siblings: the halves are
# independent, and each missing half reports once, deliberately, because each is
# its own defect. Measured overlap over one run — 128 lines miss both halves, 1
# misses only the anchor (it states a level), 3 miss only the level (they carry an
# anchor) — so the split is load-bearing for four lines, not bookkeeping.
#
# Historical-record excludes (2026-10-16) — the level rule's population is
# dominated by version PINS (dependency tables, `pkg@version` in inline code) that
# cannot carry a level token by construction, and most of them sit in dated working
# records (batch reports, dogfood logs, session plans, analyses) where a version
# measures a past run rather than asserting an authorable claim. Those four folders
# now carry the exclusion the task archives already had. Measured effect, same
# include set and one `spur rule run --file … --json` per column:
#
#   rule                                no historical excludes   with them
#   cited-version-strings                                 294        129
#   cited-version-strings-confidence                      309        131
#   cited-api-claims / -confidence                      10 / 10      7 / 7
#   total                                                 623        274
#
# 274 is a review surface a reader can act on; 623 is a second 593. Retro-levelling
# a past run's measured versions is the make-work the `docs/tasks*/**` exclude
# already rejects, so extend that reasoning rather than the gate. The globs carry
# the load-bearing trailing `/**` described above; a bare `docs/report*/` excludes
# nothing.
include:
  - "docs/**/*.md"
  - "plugins/sp/skills/**/references/**/*.md"
exclude:
  # Legacy task archives are historical records — retro-citing ~900 closed
  # lines is make-work; the tripwire targets active authoring surfaces. One glob
  # rather than the literal tasks/…tasks4/ list that let the active folder through.
  # The trailing `/**` is load-bearing: `docs/tasks*/` ends as a pattern segment
  # tested against `x.md`, so the anchored matcher binds nothing and the fragment
  # fallback strips the `*` down to `docs/tasks/` — which is why that form
  # silently excluded nothing (measured 2026-10-12).
  - "docs/tasks*/**"
  # Dated working records — see the "Historical-record excludes" note above.
  - "docs/report*/**"
  - "docs/dogfood/**"
  - "docs/plans/**"
  - "docs/analysis/**"
  - "drizzle/**"
  - "**/node_modules/**"
rules:
  - id: cited-version-strings
    description: >
      A markdown line asserting a version string (x.y.z) without a citation
      anchor on the same line — http(s) URL or repo path reference like
      packages/app/src/foo.ts:123 — is unverifyable. Add the anchor, or drop
      the version if it is not load-bearing. Confidence level (HIGH/MEDIUM/LOW)
      is part of the claim contract; `cited-version-strings-confidence` covers
      that half and sp-source-driven-development owns it.
    severity: info
    evaluator:
      type: regex
      config:
        mode: forbid
        # Fire when the line has NO citation anchor (no URL, no path:line) AND
        # contains a semver-ish token. Lookarounds exclude IPs (127.0.0.1),
        # longer dotted numerics, a heading's section number (`### 1.0.1 Title`),
        # a document-version metadata line (`version: 1.69.0`) and a `§`-numbered
        # section reference (`§7.3.1`) — none of which is an external claim.
        # Fenced code and command examples can legitimately carry bare versions and
        # are NOT skipped by the evaluator (measured 2026-10-16) — that residual
        # noise, with the above, is why this is info, not warning. The `§` guard sits
        # on the token itself, not on the line, so a line carrying both a section
        # reference and a real version still fires on the version.
        pattern: "^(?!.*(?:https?://|(?:[\\w.-]+/)+[\\w.-]+:\\d+))(?!\\s*#{1,6}\\s+\\d+\\.\\d+\\.\\d+)(?!\\s*[\\w-]+:\\s*\\d+\\.\\d+\\.\\d+\\s*$).*(?<![\\d.§])\\d+\\.\\d+\\.\\d+(?!\\.\\d)"
  - id: cited-version-strings-confidence
    description: >
      A markdown line asserting a version string (x.y.z) must also state its
      confidence level — HIGH, MEDIUM or LOW — so a reader can tell a version
      checked against the pinned source this session from one recalled from
      memory; contract in sp-source-driven-development. Pairs with
      `cited-version-strings`, which covers the citation half: a line missing
      both halves reports once per rule, deliberately, because each missing half
      is its own defect. Populated largely by version pins and dependency
      tables — advisory, never gated (see the exclude and preset notes above).
    severity: info
    evaluator:
      type: regex
      config:
        mode: forbid
        # The version shape is byte-identical to `cited-version-strings` (same
        # lookarounds, same `§` guard) and the level guard is byte-identical to
        # `cited-api-claims-confidence`, so no line can read as in scope for one
        # half and out of scope for the other. Deliberately NO anchor lookahead:
        # the halves are independent, so an anchored-but-unlevelled line is this
        # rule's finding, not an exemption from it.
        pattern: "^(?!.*\\b(?:HIGH|MEDIUM|LOW)\\b)(?!\\s*#{1,6}\\s+\\d+\\.\\d+\\.\\d+)(?!\\s*[\\w-]+:\\s*\\d+\\.\\d+\\.\\d+\\s*$).*(?<![\\d.§])\\d+\\.\\d+\\.\\d+(?!\\.\\d)"
  - id: cited-api-claims
    description: >
      A markdown line making a time- or version-anchored external API claim
      ("deprecated since 1.2", "introduced in v3", "removed in 0.9") must carry
      a citation anchor on the same line — URL or repo path:line. Add the source
      (URL or path:line) and the confidence level (HIGH/MEDIUM/LOW); contract in
      sp-source-driven-development.
    severity: info
    evaluator:
      type: regex
      config:
        mode: forbid
        pattern: "^(?!.*(?:https?://|(?:[\\w.-]+/)+[\\w.-]+:\\d+)).*\\b(?:deprecated (?:since|in|as of)|introduced in|added in|available since|stable since|removed (?:in|since) [vV]?\\d|(?:since|as of) (?:[vV]\\d+\\.\\d+(?:\\.\\d+)?|\\d+\\.\\d+\\.\\d+))\\b"
  - id: cited-api-claims-confidence
    description: >
      A markdown line making a time- or version-anchored external API claim
      ("deprecated since 1.2", "introduced in v3", "removed in 0.9") must
      also state its confidence level — HIGH, MEDIUM or LOW — so a reader can
      tell a checked fact from model memory; contract in
      sp-source-driven-development. Pairs with `cited-api-claims`, which covers
      the citation half: a line missing both halves reports once per rule,
      deliberately, because each missing half is its own defect.
    severity: info
    evaluator:
      type: regex
      config:
        mode: forbid
        # Fires on a claim line carrying no uppercase level token. The verbs match
        # `cited-api-claims` exactly, so the two rules never disagree about which
        # lines are claims.
        pattern: "^(?!.*\\b(?:HIGH|MEDIUM|LOW)\\b).*\\b(?:deprecated (?:since|in|as of)|introduced in|added in|available since|stable since|removed (?:in|since) [vV]?\\d|(?:since|as of) (?:[vV]\\d+\\.\\d+(?:\\.\\d+)?|\\d+\\.\\d+\\.\\d+))\\b"
  - id: cited-high-confidence
    description: >
      A line stating HIGH confidence about an external API/library claim must
      carry a source citation anchor on the same line — URL or repo path:line.
      The claim contract (sp-source-driven-development) defines HIGH as
      "verified against the pinned version's docs/source THIS SESSION", so an
      uncited HIGH is the one level that cannot be honest: MEDIUM is recalled and
      plausibly stale, LOW is memory only, and both are explicitly allowed
      without a source (LOW must never be presented as fact — that stays a review
      judgment, not a regex). Scoped to the same claim verbs as
      `cited-api-claims`, so the two rules agree on which lines are claims: a
      decision record's own `Confidence:` grade (the brainstorm family) is a
      different contract and is deliberately out of scope. Pairs with
      `cited-api-claims-confidence`, which catches a claim line carrying no level
      at all.
    severity: info
    evaluator:
      type: regex
      config:
        mode: forbid
        # Fires when a claim line names HIGH but carries no anchor. The anchor
        # vocabulary is identical to its siblings (URL or `path:line`), so one
        # line cannot read as cited for one rule and uncited for another. The level
        # is asserted with a lookahead so either prose order matches — `(HIGH)` after
        # the claim (the usual form) and `HIGH — <claim>` both count.
        pattern: "^(?!.*(?:https?://|(?:[\\w.-]+/)+[\\w.-]+:\\d+))(?=.*\\bHIGH\\b).*\\b(?:deprecated (?:since|in|as of)|introduced in|added in|available since|stable since|removed (?:in|since) [vV]?\\d|(?:since|as of) (?:[vV]\\d+\\.\\d+(?:\\.\\d+)?|\\d+\\.\\d+\\.\\d+))\\b"
