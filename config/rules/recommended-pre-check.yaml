# Recommended pre-check preset — portable rule categories bundled with the catalog.
# Use with: spur rule run --preset recommended-pre-check
#
# Runs BEFORE tests (test-pre-check). Extends categories: typescript,
# structure, boundary, surface, ui, strict (ui since bc267cc8, strict since
# 79186391), and docs (sourced-api-claims, 2026-10-07). TSDoc exports run in
# post-check alongside coverage-gate.
#
# TEMPORARY (2026-10-08): `docs` removed from extends to unblock the gate —
# restore it (add `- docs` back) once sourced-api-claims finding noise is
# triaged. Recapture the raw-json-baseline fixtures in the same change.
name: recommended-pre-check
extends:
  - typescript
  - structure
  - boundary
  - surface
  - ui
  - strict
