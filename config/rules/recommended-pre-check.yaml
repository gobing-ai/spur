# Recommended pre-check preset — portable rule categories bundled with the catalog.
# Use with: spur rule run --preset recommended-pre-check
#
# Runs BEFORE tests (test-pre-check). Extends six categories: typescript,
# structure, boundary, surface, ui, and strict (ui since bc267cc8, strict since
# 79186391). TSDoc exports run in post-check alongside coverage-gate.
name: recommended-pre-check
extends:
  - typescript
  - structure
  - boundary
  - surface
  - ui
  - strict
