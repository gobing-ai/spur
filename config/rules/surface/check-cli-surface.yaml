# CLI surface consistency — structural checks that every command file follows
# the registerXxxCommand convention and that --json claims are backed by real
# output serialization (toEnvelopeJson, toJson, or JSON.stringify).
#
# Part of the recommended-pre-check preset. Run:
#   spur rule run --preset recommended-pre-check
#
# Layout: single-file nouns live at commands/<noun>.ts; large nouns are split
# into commands/<noun>/{index.ts, <verb>.ts..., shared.ts} (one module per
# `spur <noun> <verb>`). Both shapes are covered below.

include:
  - "apps/cli/src/commands/*.ts"
  # Per-noun folders (commands/task/, commands/workflow/, commands/agent/).
  - "apps/cli/src/commands/*/*.ts"

exclude:
  # Not a command file: shared-options.ts is the option registry.
  - "apps/cli/src/commands/shared-options.ts"

rules:
  - id: cli-register-pattern
    description: >
      Every CLI command file must export a registerXxxCommand(program, context)
      function matching the standard Commander.js wiring pattern.
    severity: error
    exclude:
      # Per-noun shared.ts holds helpers used by 2+ verbs; it registers nothing.
      - "apps/cli/src/commands/*/shared.ts"
      # Byte-exact stdout/stderr writer for the absorbed pipeline steps (script-absorption PR-5); registers nothing.
      - "apps/cli/src/commands/task/step-output.ts"
    evaluator:
      type: rg
      config:
        pattern: "export function register\\w+Command\\("
        mode: require

  - id: cli-json-output
    description: >
      Command files that register --json options must call toEnvelopeJson()
      (ADR-091 envelope seam), toJson(), or JSON.stringify() to produce
      machine-readable output.
    severity: error
    exclude:
      # Per-noun index.ts only creates the noun and calls each verb's register
      # function; it declares no options, so there is no --json to back.
      - "apps/cli/src/commands/*/index.ts"
      # Verbs that hand JSON rendering to the code that serializes it:
      # doctor -> AgentService.doctor (spur-app); start/stop -> runAgentLifecycle
      # in commands/agent/shared.ts (checked). loop declares no --json.
      - "apps/cli/src/commands/agent/doctor.ts"
      - "apps/cli/src/commands/agent/loop.ts"
      - "apps/cli/src/commands/agent/start.ts"
      - "apps/cli/src/commands/agent/stop.ts"
      # Absorbed pipeline steps (script-absorption PR-5): the app operation renders the golden-pinned
      # text/JSON (planning-preflight.ts JSON.stringify for `task preflight --json`, batch-plan.ts for
      # `task batch-plan`); wrapup, feature verify/handoff declare no --json. step-output.ts writes bytes.
      - "apps/cli/src/commands/task/batch-plan.ts"
      - "apps/cli/src/commands/task/preflight.ts"
      - "apps/cli/src/commands/task/step-output.ts"
      - "apps/cli/src/commands/task/wrapup.ts"
      - "apps/cli/src/commands/feature/handoff.ts"
      - "apps/cli/src/commands/feature/verify.ts"
      # commit-guard declares no --json: its {staged, foreign} / {foreign} lines are rendered by
      # @gobing-ai/spur-app/commit-guard (byte-identical to the retired script, PR-4 golden).
      - "apps/cli/src/commands/workflow/commit-guard.ts"
      # Pipeline-internal task verbs (script-absorption PR-3) declare no --json: their contract is
      # the .spur/run artifact they write (gate status/receipt, residuals.json, diffstat.json) and
      # the exit code; the gate's own status line is serialized by the app service.
      - "apps/cli/src/commands/task/gate.ts"
      - "apps/cli/src/commands/task/residual.ts"
      - "apps/cli/src/commands/task/diffstat.ts"
      # Absorbed measurement/report verbs (script-absorption PR-6): the app module serializes the
      # golden-pinned JSON (step-profile-cli for `workflow profile --json`, run-summary-cli for
      # `workflow summary`, session-timeline for `history timeline`, history-anatomy-cli for the
      # anatomy ops); `history summary` writes Markdown and declares no --json.
      - "apps/cli/src/commands/workflow/profile.ts"
      - "apps/cli/src/commands/workflow/summary.ts"
      - "apps/cli/src/commands/history/anatomy.ts"
      - "apps/cli/src/commands/history/timeline.ts"
      - "apps/cli/src/commands/history/summary.ts"
      # Absorbed dogfood / PR-review spines (script-absorption PR-7): --json is rendered by
      # @gobing-ai/spur-app/dogfood and @gobing-ai/spur-app/pr-review (JSON.stringify), not the CLI envelope.
      - "apps/cli/src/commands/agent/dogfood.ts"
      - "apps/cli/src/commands/builder/pr.ts"
    evaluator:
      type: rg
      config:
        pattern: "toEnvelopeJson\\b|toJson\\b|JSON\\.stringify\\b"
        mode: require
