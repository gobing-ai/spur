name: Publish

on:
    workflow_dispatch:
    push:
        tags:
            # Pushing this tag (via `bun run bump-ver <version> --push`) triggers a
            # single publish of @gobing-ai/spur-cli.
            - '@gobing-ai/spur-cli-v*'

permissions:
    contents: read
    id-token: write # required for npm Trusted Publishing (OIDC)

# Never cancel an in-flight publish.
concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            # Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.0.
            # setup-bun provides Bun for the bundle build; npm publish runs on
            # the system Node provided here.
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22

            - name: Upgrade npm for OIDC support
              # Pin a known-good floor: OIDC trusted publishing needs >= 11.5.1.
              # Using @latest risks a broken npm release silently breaking releases.
              run: npm install -g npm@^11.5.1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # `bun publish` runs apps/cli's prepublishOnly (the bundle build) first,
            # then publishes the self-contained @gobing-ai/spur-cli package.
            - name: Publish @gobing-ai/spur-cli
              run: cd apps/cli && bun publish
