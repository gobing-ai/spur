name: Publish

on:
    workflow_dispatch:
    push:
        tags:
            - '@gobing-ai/spur-v*'

permissions:
    contents: read
    id-token: write # required for npm Trusted Publishing (OIDC)

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            # Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.0.
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Upgrade npm for OIDC support
              run: npm install -g npm@^11.5.1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify version match
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  TAG_VERSION="${TAG#@gobing-ai/spur-v}"
                  CLI_VERSION=$(node -e "console.log(require('./apps/cli/package.json').version)")
                  if [ "${CLI_VERSION}" != "${TAG_VERSION}" ]; then
                      echo "CLI version mismatch: tag=${TAG_VERSION}, package.json=${CLI_VERSION}" >&2
                      exit 1
                  fi
                  echo "Publishing @gobing-ai/spur@${CLI_VERSION}"

            # build:bundle runs bundle-web + bundle-config so the tarball ships:
            #   config/  (ADR-015 defaults for spur init)
            #   web/     (Spur Board SPA for spur serve)
            - name: Build
              run: (cd apps/cli && bun run build:bundle)

            - name: Verify release assets
              run: |
                  set -euo pipefail
                  test -f apps/cli/spur.js
                  test -f apps/cli/config/rules/recommended-pre-check.yaml
                  test -f apps/cli/config/workflows/basic.yaml
                  test -f apps/cli/config/templates/task/standard.md
                  test -f apps/cli/web/index.html
                  # Pack must list package-root config/ and web/ (not legacy spur-cli/ only).
                  cd apps/cli
                  PACK_LIST=$(npm pack --dry-run 2>&1)
                  echo "$PACK_LIST" | grep -q 'config/rules/recommended-pre-check.yaml'
                  echo "$PACK_LIST" | grep -q 'web/index.html'
                  ! echo "$PACK_LIST" | grep -q 'spur-cli/config'
                  echo "Release assets OK (config/ + web/ present in pack)"

            - name: Publish spur-cli
              run: bun scripts/spur-dev.ts publish apps/cli
