name: Publish

on:
    workflow_dispatch:
        inputs:
            package:
                description: "Package to publish (spur-cli or spur-plugin-sdk)"
                required: true
                type: choice
                options:
                    - spur-cli
                    - spur-plugin-sdk
            version:
                description: "Version to publish (e.g. 0.2.0)"
                required: false
                type: string
    push:
        tags:
            - "@gobing-ai/spur-cli-v*"
            - "@gobing-ai/spur-plugin-sdk-v*"

permissions:
    contents: read
    id-token: write

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Upgrade npm for OIDC support
              run: npm install -g npm@^11.5.1

            - name: Determine package from tag
              id: pkg
              run: |
                  if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                    TAG="${GITHUB_REF_NAME}"
                    if [[ "${TAG}" == @gobing-ai/spur-cli-v* ]]; then
                      echo "dir=apps/cli" >> "$GITHUB_OUTPUT"
                      echo "name=@gobing-ai/spur-cli" >> "$GITHUB_OUTPUT"
                    elif [[ "${TAG}" == @gobing-ai/spur-plugin-sdk-v* ]]; then
                      echo "dir=packages/plugin-sdk" >> "$GITHUB_OUTPUT"
                      echo "name=@gobing-ai/spur-plugin-sdk" >> "$GITHUB_OUTPUT"
                    else
                      echo "Unknown tag pattern: ${TAG}" >&2
                      exit 1
                    fi
                  else
                    case "${{ inputs.package }}" in
                      spur-cli)
                        echo "dir=apps/cli" >> "$GITHUB_OUTPUT"
                        echo "name=@gobing-ai/spur-cli" >> "$GITHUB_OUTPUT"
                        ;;
                      spur-plugin-sdk)
                        echo "dir=packages/plugin-sdk" >> "$GITHUB_OUTPUT"
                        echo "name=@gobing-ai/spur-plugin-sdk" >> "$GITHUB_OUTPUT"
                        ;;
                      *)
                        echo "Unknown package: ${{ inputs.package }}" >&2
                        exit 1
                        ;;
                    esac
                  fi

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify version match
              run: |
                  PKG_VERSION=$(cat "${{ steps.pkg.outputs.dir }}/package.json" | grep -o '"version": *"[^"]*"' | head -1 | cut -d'"' -f4)
                  if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                    TAG_VERSION="${GITHUB_REF_NAME#*-v}"
                    if [[ "${PKG_VERSION}" != "${TAG_VERSION}" ]]; then
                      echo "Version mismatch: tag=${TAG_VERSION}, package.json=${PKG_VERSION}" >&2
                      exit 1
                    fi
                  fi
                  echo "Publishing ${{ steps.pkg.outputs.name }}@${PKG_VERSION}"

            - name: Publish
              working-directory: ${{ steps.pkg.outputs.dir }}
              run: bun ../../scripts/ci-publish.ts .
              env:
                  NPM_CONFIG_PROVENANCE: 'true'
