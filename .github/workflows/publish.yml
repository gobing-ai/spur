name: Publish

on:
    workflow_dispatch:
    push:
        tags:
            - '@gobing-ai/spur-v*'

permissions:
    contents: read
    id-token: write # required for npm Trusted Publishing (OIDC)

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            # Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.0.
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Upgrade npm for OIDC support
              run: npm install -g npm@^11.5.1

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify version match
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  TAG_VERSION="${TAG#@gobing-ai/spur-v}"
                  CLI_VERSION=$(node -e "console.log(require('./apps/cli/package.json').version)")
                  if [ "${CLI_VERSION}" != "${TAG_VERSION}" ]; then
                      echo "CLI version mismatch: tag=${TAG_VERSION}, package.json=${CLI_VERSION}" >&2
                      exit 1
                  fi
                  echo "Publishing @gobing-ai/spur@${CLI_VERSION}"

            - name: Build
              run: (cd apps/cli && bun run build:bundle)

            - name: Publish spur-cli
              run: bun scripts/spur-dev.ts publish apps/cli
