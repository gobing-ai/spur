name: test-win

# Windows-only validation, split out of ci.yml so flaky/hanging Windows jobs
# cannot block releases (ci.yml is the release gate). Merge back once the
# win32 detached-serve hang is root-caused and fixed.

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main

jobs:
    # Fast no-install probe of the three detached-launch shapes on real Windows:
    # (A) inline argv (`cmd /c start /b "..." < NUL ...`) — pre-0964 shape;
    # (B) batch file (`cmd /c <batch>`) — shape that still hangs callers;
    # (C) powershell Start-Process — the fix.
    # Detector is STREAM CLOSE, not process exit: execa (and any piped caller)
    # waits for stdout EOF, so a daemon holding a duplicate of our pipe makes the
    # call hang even after the launched process exits. The marker child prints
    # CHILD_STDIO_LEAK, giving a second signal if its stdout reaches our pipe.
    spawn-probe:
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: windows-latest
        timeout-minutes: 10

        steps:
            - name: Probe cmd/PowerShell spawn shapes (stream close must fire)
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Continue'
                  @'
                  const { spawn } = require('node:child_process');

                  (async () => {
                  // Resolves on stream close (all write ends gone), like execa does.
                  function probeClose(label, file, argv, env) {
                    return new Promise((resolve) => {
                      const t0 = Date.now();
                      let output = '';
                      let closed = false;
                      let code = null;
                      const p = spawn(file, argv, { env, stdio: ['ignore', 'pipe', 'pipe'] });
                      p.stdout.on('data', (d) => { output += d; process.stdout.write(`${label} OUT: ${d}`); });
                      p.stderr.on('data', (d) => { output += d; process.stdout.write(`${label} ERR: ${d}`); });
                      p.on('error', (e) => { console.log(`${label} SPAWN-ERROR: ${e.message}`); });
                      p.on('exit', (c) => { code = c; console.log(`${label} EXIT: ${c} after ${Date.now() - t0}ms`); });
                      p.on('close', () => {
                        closed = true;
                        console.log(`${label} CLOSE after ${Date.now() - t0}ms`);
                        resolve({ code, closed, output, leak: output.includes('CHILD_STDIO_LEAK') });
                      });
                      setTimeout(() => {
                        if (closed) return;
                        console.log(`${label} NO-CLOSE-15s (some process still holds the stdout pipe)`);
                        try { p.kill(); } catch {}
                        resolve({ code, closed: false, output, leak: output.includes('CHILD_STDIO_LEAK') });
                      }, 15000);
                    });
                  }

                  const marker = 'Write-Output CHILD_STDIO_LEAK; Start-Sleep -Seconds 12';
                  const env = {
                    ...process.env,
                    SPUR_SERVE_ARG_0: 'powershell.exe',
                    SPUR_SERVE_ARG_1: '-NoProfile',
                    SPUR_SERVE_ARG_2: '-Command',
                    SPUR_SERVE_ARG_3: marker,
                  };
                  const bat = process.argv[2];

                  const a = await probeClose('INLINE', 'cmd', ['/d', '/v:off', '/c',
                    'start /b "" "%SPUR_SERVE_ARG_0%" "%SPUR_SERVE_ARG_1%" "%SPUR_SERVE_ARG_2%" "%SPUR_SERVE_ARG_3%" < NUL > NUL 2>&1'], env);
                  console.log(`INLINE VERDICT: closed=${a.closed} exit=${a.code} leak=${a.leak}`);

                  const b = await probeClose('BATCH', 'cmd', ['/d', '/v:off', '/c', bat], env);
                  console.log(`BATCH VERDICT: closed=${b.closed} exit=${b.code} leak=${b.leak}`);

                  // (C) the fix under test: PowerShell Start-Process, argv in env vars.
                  const c = await probeClose('START-PROCESS', 'powershell.exe', ['-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command',
                    'Start-Process -FilePath $env:SPUR_SERVE_ARG_0 -ArgumentList @($env:SPUR_SERVE_ARG_1,$env:SPUR_SERVE_ARG_2,$env:SPUR_SERVE_ARG_3) -WindowStyle Hidden'], env);
                  console.log(`START-PROCESS VERDICT: closed=${c.closed} exit=${c.code} leak=${c.leak}`);

                  process.exit(c.closed && c.code === 0 ? 0 : 1);
                  })();
                  '@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\probe.cjs"
                  Set-Content -Encoding ascii "$env:RUNNER_TEMP\probe-launch.cmd" @(
                      '@echo off'
                      'start /b "" "%SPUR_SERVE_ARG_0%" "%SPUR_SERVE_ARG_1%" "%SPUR_SERVE_ARG_2%" "%SPUR_SERVE_ARG_3%" < NUL > NUL 2>&1'
                  )
                  node "$env:RUNNER_TEMP\probe.cjs" "$env:RUNNER_TEMP\probe-launch.cmd"
                  $probeExit = $LASTEXITCODE
                  Start-Sleep -Seconds 2
                  $survivors = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'CHILD_STDIO_LEAK' }
                  $survivors | ForEach-Object { "SURVIVOR pid=$($_.ProcessId) ppid=$($_.ParentProcessId): $($_.CommandLine)" }
                  $survivors | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
                  if ($probeExit -ne 0) { throw "spawn probe failed (exit $probeExit) — see VERDICT lines above" }

    # 0964 AC3: the win32 detached serve launch can only be exercised on real cmd.exe.
    # A `%` in the project path must reach `spur serve --cwd` literally, and the daemon
    # must outlive the `projects start` CLI with its stdio detached (no pipe EOF hang).
    windows-serve-smoke:
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: windows-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            - name: Detached serve survives CLI exit with a % project path
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $repo = $env:GITHUB_WORKSPACE

                  # 1. Strict stdio-detach probe: `projects start` under a real pipe must
                  #    reach EOF within 90s. A stdio leak shows up as a Wait-Job timeout
                  #    instead of a silent 20-minute job hang; the dump below is evidence.
                  $probeName = 'pp%USERNAME%q'
                  $probeProj = Join-Path $env:RUNNER_TEMP $probeName
                  New-Item -ItemType Directory -Force -Path $probeProj | Out-Null
                  $probe = Start-Job -ScriptBlock {
                      param($repo, $proj)
                      Set-Location $repo
                      bun apps/cli/src/index.ts projects start $proj --json | Out-String
                  } -ArgumentList $repo, $probeProj
                  if (Wait-Job $probe -Timeout 90) {
                      $probeRaw = Receive-Job $probe
                      $probeStart = $probeRaw | ConvertFrom-Json
                      if (-not $probeStart.running) {
                          Write-Host "probe start output: $probeRaw"
                          throw 'probe projects start did not report running'
                      }
                      bun apps/cli/src/index.ts projects stop $probeName --json | Out-Null
                  } else {
                      Write-Host '=== piped projects start never reached EOF in 90s — process evidence ==='
                      Get-CimInstance Win32_Process |
                          Where-Object { $_.Name -match 'bun|cmd|pwsh|powershell' } |
                          Select-Object ProcessId, ParentProcessId, Name, CommandLine |
                          Format-List | Out-String -Width 300 | Write-Host
                      Stop-Job $probe
                      Remove-Job $probe -Force
                      throw 'stdio leak: piped projects start did not reach EOF within 90s'
                  }

                  # 2. Functional AC: % must survive to `serve --cwd` on a daemon that
                  #    outlives the CLI. start/stop run with file redirection so the
                  #    step stays robust even if a daemon handle leaks.
                  $name = 'p%USERNAME%x'
                  $proj = Join-Path $env:RUNNER_TEMP $name
                  New-Item -ItemType Directory -Force -Path $proj | Out-Null

                  bun apps/cli/src/index.ts projects start $proj --json > "$env:RUNNER_TEMP\start.json" 2> "$env:RUNNER_TEMP\start.err"
                  Get-Content "$env:RUNNER_TEMP\start.err" | Write-Host
                  $start = Get-Content "$env:RUNNER_TEMP\start.json" -Raw | ConvertFrom-Json
                  $start | ConvertTo-Json -Depth 5
                  if (-not $start.running) { throw 'projects start did not report running' }

                  # The start CLI has exited; the daemon must still be listening.
                  Start-Sleep -Seconds 5
                  bun apps/cli/src/index.ts projects list --json | Out-String | Write-Host
                  $list = bun apps/cli/src/index.ts projects list --json | Out-String | ConvertFrom-Json
                  $entry = $list.projects | Where-Object { $_.name -eq $name }
                  $entry | ConvertTo-Json -Depth 5
                  if (-not $entry -or -not $entry.running) { throw 'serve daemon is not running after CLI exit' }
                  Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$($entry.port)/" -SkipHttpErrorCheck | Select-Object StatusCode

                  $serve = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match '\bserve\b' -and $_.CommandLine -match '--cwd' }
                  $serve | ForEach-Object { "serve cmdline: $($_.CommandLine)" }
                  if (-not ($serve | Where-Object { $_.CommandLine.Contains($proj) })) { throw "serve --cwd is not the literal path $proj" }
                  if ($serve | Where-Object { $_.CommandLine.Contains("p$($env:USERNAME)x") }) { throw '%USERNAME% was expanded by cmd.exe' }

                  bun apps/cli/src/index.ts projects stop $name --json
