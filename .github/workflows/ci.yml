name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    verify:
        # Release commits only bump versions — CI already ran on the prior push.
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: ubuntu-latest

        steps:
            # fetch-depth: 0 — the suite verifies committed evidence artifacts against the
            # revision they recorded (packages/domain/tests/analytics/history-parity-evidence.test.ts
            # re-reads 1309's frozen sourceRevision through `git show`). The default depth-1 checkout
            # has no such object, and the short clone fails the parity evidence on a tree that is green.
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install --frozen-lockfile
            # The recommended-pre-check preset runs rg-backed rules; the runner image
            # does not ship ripgrep, and the rg evaluator fails loud when it is missing.
            - run: sudo apt-get update && sudo apt-get install -y ripgrep
            - run: bun run check
            - run: bun run build
