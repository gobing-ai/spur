name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    verify:
        # Release commits only bump versions — CI already ran on the prior push.
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            # The recommended-pre-check preset runs rg-backed rules; the runner image
            # does not ship ripgrep, and the rg evaluator fails loud when it is missing.
            - run: sudo apt-get update && sudo apt-get install -y ripgrep
            - run: bun run check
            - run: bun run build

    # 0964 AC3: the win32 detached serve launch (cmd /d /v:off /c start /b + SPUR_SERVE_ARG_<i>
    # env handoff) can only be exercised on real cmd.exe. A `%` in the project path must reach
    # `spur serve --cwd` literally, and the daemon must outlive the `projects start` CLI.
    windows-serve-smoke:
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            # TEMPORARY DEBUG: ts-infra 0.5.7 runApplication's catch dereferences
            # state.pluginHost before assignment, so the original startup error is
            # replaced by a TypeError and never printed. Optional-chain both calls
            # so the catch falls through to `throw error` with the real cause.
            - name: 'DEBUG: unmask ts-infra bootstrap error'
              shell: pwsh
              run: |
                  $f = 'node_modules/@gobing-ai/ts-infra/dist/application/index.js'
                  $c = Get-Content $f -Raw
                  $c = $c -replace 'state\\.pluginHost\\.stopAll', 'state.pluginHost?.stopAll' -replace 'state\\.pluginHost\\.unloadAll', 'state.pluginHost?.unloadAll'
                  Set-Content -Path $f -Value $c -NoNewline
            # TEMPORARY DEBUG: bootstrap-only probe with a plain path. If this also
            # crashes, the failure is independent of the `%` path argument.
            - name: 'DEBUG: plain-path bootstrap probe'
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $probe = Join-Path $env:RUNNER_TEMP 'plain-probe'
                  New-Item -ItemType Directory -Force -Path $probe | Out-Null
                  bun apps/cli/src/index.ts projects list --json
                  bun apps/cli/src/index.ts projects start $probe --json
                  bun apps/cli/src/index.ts projects stop plain-probe --json
            - name: Detached serve survives CLI exit with a % project path
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $name = 'p%USERNAME%x'
                  $proj = Join-Path $env:RUNNER_TEMP $name
                  New-Item -ItemType Directory -Force -Path $proj | Out-Null

                  $start = bun apps/cli/src/index.ts projects start $proj --json | Out-String | ConvertFrom-Json
                  $start | ConvertTo-Json -Depth 5
                  if (-not $start.running) { throw 'projects start did not report running' }

                  # The start CLI has exited; the daemon must still be listening.
                  Start-Sleep -Seconds 5
                  $list = bun apps/cli/src/index.ts projects list --json | Out-String | ConvertFrom-Json
                  $entry = $list.projects | Where-Object { $_.name -eq $name }
                  $entry | ConvertTo-Json -Depth 5
                  if (-not $entry -or -not $entry.running) { throw 'serve daemon is not running after CLI exit' }
                  Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$($entry.port)/" -SkipHttpErrorCheck | Select-Object StatusCode

                  $serve = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match '\bserve\b' -and $_.CommandLine -match '--cwd' }
                  $serve | ForEach-Object { "serve cmdline: $($_.CommandLine)" }
                  if (-not ($serve | Where-Object { $_.CommandLine.Contains($proj) })) { throw "serve --cwd is not the literal path $proj" }
                  if ($serve | Where-Object { $_.CommandLine.Contains("p$($env:USERNAME)x") }) { throw '%USERNAME% was expanded by cmd.exe' }

                  bun apps/cli/src/index.ts projects stop $name --json
