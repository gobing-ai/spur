# Recommended post-check preset — documentation & coverage gates only.
# Use with: spur rule run --preset recommended-post-check --fail-on warning
#
# Runs AFTER tests (test-post-check). Enforces TSDoc on exports and
# the coverage gate on fresh .coverage/lcov.info.
# All other rules (typescript, structure, boundary) run in pre-check.
name: recommended-post-check
description: >
  Post-test quality gates: TSDoc documentation and coverage gate only.
extends:
  - quality
