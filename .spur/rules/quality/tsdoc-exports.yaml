# TSDoc-on-exports — enforced by Spur's post-check gate.
# Absorbed from ts-libs/.spur/rules/quality/tsdoc-exports.yaml.
#
# Rationale: exported symbols are public integration points even in application
# workspaces and vendor references. The post-check gate keeps those boundaries
# documented.
rules:
  - id: every-export-has-tsdoc
    description: >
      Exported declarations must have a preceding TSDoc comment.
    severity: error
    enabled: true
    evaluator:
      type: tsdoc-export
