  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary
    docs/tasks2:
      baseCounter: 128
      label: Phase 2
    docs/tasks3:
      baseCounter: 348
      label: Phase 3
    docs/tasks4:
      baseCounter: 488
      label: Phase 4

features:
