# Spur project configuration for spur-new
# Generated by `spur init`

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1"
name: spur-new

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# ── Spur app section (validated by a local zod schema — UNCHANGED keys) ──
agent:
  default: omp

  # ── Executors (ADR-033 adaptive model routing) ──
  # `tier` is DECLARED, never inferred. Without it, agent-service falls back to a
  # regex over `name + model + agent` which misclassifies silently — e.g.
  # `deepseek-v4-pro` matched `\bpro\b` and became the only `capable` executor,
  # while `claude`/`codex`/`grok` fell to `standard` and were excluded from every
  # capable-tier stage.
  #
  # Selection: a stage takes the CHEAPEST executor whose tier >= its `min_tier`
  # (cheap=1 < standard=2 < capable=3). Ties inside a tier break by ARRAY ORDER,
  # so within each block the first entry is the preferred default — keep the
  # preferred agent first when reordering.
  executors:
    # cheap — mechanical, high-volume work
    - name: minimax
      agent: omp
      model: minimax/MiniMax-M3
      tier: cheap

    # standard — implementation, tests, wrap-up (omp first: the working default)
    - name: omp
      agent: omp
      tier: standard
    - name: omp-zai
      agent: omp
      model: zai/glm-5.2
      tier: standard
    - name: omp-zai-nvidia
      agent: omp
      model: nvidia/z-ai/glm-5.2
      tier: standard
    # - name: omp-zai-opencode
    #   agent: omp
    #   model: opencode/glm-5.2
    #   tier: standard
    # - name: omp-zai-volc
    #   agent: omp
    #   model: volc/glm-5.2
    #   tier: standard
    - name: omp-zai-ollama
      agent: omp
      model: ollama/glm-5.2:cloud
      tier: standard
    # - name: agy-gemini
    #   agent: agy
    #   model: gemini-3.6-flash-high
    #   # model: gemini-3.1-pro
    #   tier: standard
    # - name: agy-opus
    #   agent: agy
    #   model: claude-4-6-opus
    #   tier: standard

    # capable — planning, verification, dogfooding (grok first: prior default
    # for dev-plan / dev-verify / dev-review / dev-brainstorm)
    - name: pi-k3
      agent: pi
      model: "k3[1m]"
      tier: capable
    - name: grok
      agent: grok
      tier: capable
    - name: claude
      agent: claude
      tier: capable
    - name: codex
      agent: codex
      tier: capable
    - name: omp-deepseek
      agent: omp
      model: deepseek/deepseek-v4-pro
      tier: capable

  # `default-by-phase` retired 2026-07-26 (ADR-033). It was deprecated, emitted a
  # warning on every resolve, and — being authoritative when present — shadowed
  # stage routing entirely for the phases it listed. Routing now comes from the
  # stage registry's `model_policy` (packages/domain/src/stage-registry/), with
  # preference expressed by executor order above.

  # ── Teams (feature M) — declarative rosters materialized by `spur team up` ──
  # A sample team so the Teams board tabs (Roster / Messages / Activity /
  # Terminal) have data to render. `spur team up demo` writes agent specs to
  # .spur/agents/<teamId>-<localId>.yaml; members are NOT autostarted (autostart
  # defaults to false) — start one explicitly with `spur team start <agent-id>`
  # to populate Terminal / Messages / Activity with live data.
  team:
    demo:
      name: "Team Spur"
      work_dir: ~/xprojects/spur-new
      members:
        - executor: claude
          purpose: "Lead — planning & review"
        - executor: omp-zai
          purpose: "Implementer — code generation"
        - executor: codex
          purpose: "Verifier — second opinion"

rules:
  paths:
    - .spur/rules/**/*.yaml

workflows:
  paths:
    - .spur/workflows/

redaction:
  enabled: false

# ── Tasks configuration (design §9 — absorbed from docs/.tasks/config.jsonc) ──
tasks:
  active: docs/tasks2
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary
    docs/tasks2:
      baseCounter: 128
      label: Phase 2
