# Spur project configuration for spur-new
# Generated by `spur init`

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1"
name: spur-new

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# ── Spur app section (validated by a local zod schema — UNCHANGED keys) ──
agent:
  default: omp
  executors:
    - name: omp
      agent: omp
    - name: omp-zai
      agent: omp
      model: zai/glm-5.2
    - name: omp-zai-volc
      agent: omp
      model: volc/glm-5.2
    - name: omp-deepseek
      agent: omp
      model: deepseek/deepseek-v4-pro
    - name: minimax
      agent: omp
      model: minimax/MiniMax-M3
    - name: codex
      agent: codex
    - name: claude
      agent: claude
  default-by-phase:
    dev-brainstorm: claude
    dev-fixall: omp-zai
    dev-plan: claude
    dev-run: omp-zai
    dev-changelog: omp-zai
    dev-gitmsg: minimax
    dev-review: claude
    dev-verify: claude

rules:
  paths:
    - .spur/rules/**/*.yaml

workflows:
  paths:
    - .spur/workflows/

redaction:
  enabled: false

# ── Tasks configuration (design §9 — absorbed from docs/.tasks/config.jsonc) ──
tasks:
  active: docs/tasks2
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary
    docs/tasks2:
      baseCounter: 128
      label: Phase 2
