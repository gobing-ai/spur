# Spur project configuration for spur-new
# Generated by `spur init` — maintained as the monorepo dogfood surface.

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.1"
name: spur-new

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# ── Spur app section (validated by spurConfigSchema in @gobing-ai/spur-config) ──
agent:
  default: omp

  # ── Executors (ADR-033 adaptive model routing) ──
  # `tier` is DECLARED, never inferred. Without it, agent-service falls back to a
  # regex over `name + model + agent` which misclassifies silently — e.g.
  # `deepseek-v4-pro` matched `\bpro\b` and became the only `capable` executor,
  # while `claude`/`codex`/`grok` fell to `standard` and were excluded from every
  # capable-tier stage.
  #
  # Selection: a stage takes the CHEAPEST executor whose tier >= its `min_tier`
  # (cheap=1 < standard=2 < capable-1=3 < capable-2=4 < capable-3=5). Sub-tiers
  # replace array-order *across* capable-1/2/3; array order remains the last-
  # resort tie-break only for executors that share the exact same tier value.
  executors:
    # cheap — mechanical, high-volume work
    - name: minimax
      agent: omp
      model: minimax/MiniMax-M3
      tier: cheap

    # standard — implementation, tests, wrap-up (omp first: the working default)
    - name: omp
      agent: omp
      tier: standard
    - name: omp-zai
      agent: omp
      model: zai/glm-5.2
      tier: standard
    # - name: omp-zai-nvidia
    #   agent: omp
    #   model: nvidia/z-ai/glm-5.2
    #   tier: standard
    # - name: omp-zai-opencode
    #   agent: omp
    #   model: opencode/glm-5.2
    #   tier: standard
    # - name: omp-zai-volc
    #   agent: omp
    #   model: volc/glm-5.2
    #   tier: standard
    - name: omp-zai-ollama
      agent: omp
      model: ollama/glm-5.2:cloud
      tier: standard
    - name: omp-dsv4-flash-ollama
      agent: omp
      model: deepseek-v4-flash:0731-cloud
      tier: standard
    # - name: agy-gemini
    #   agent: agy
    #   model: gemini-3.6-flash-high
    #   # model: gemini-3.1-pro
    #   tier: standard
    # - name: agy-opus
    #   agent: agy
    #   model: claude-4-6-opus
    #   tier: standard
    - name: codex-luna
      agent: codex
      model: gpt-5.6-luna
      tier: standard

    # capable-1/2/3 — planning, verification, dogfooding (0343)
    # 1 = low output quality within the capable band, 3 = high. Declare
    # explicitly — inference never invents capable-2/3.
    - name: pi-k3
      agent: pi
      model: "k3[1m]"
      tier: capable-1
    - name: omp-deepseek
      agent: omp
      model: deepseek/deepseek-v4-flash
      tier: capable-1
    - name: grok
      agent: grok
      tier: capable-2
    - name: claude
      agent: claude
      tier: capable-3
    - name: codex-sol
      agent: codex
      model: gpt-5.6-sol
      tier: capable-3

  # `default-by-phase` removed from schema (0452). Was a
  # backward-compat shim that emits a one-time deprecation warning. When present
  # it is still authoritative for matching phases and shadows stage routing —
  # do not re-enable unless you intentionally need that fail-fast map.
  # default-by-phase:
  #   dev-run: omp-zai
  #   dev-review: claude

  # ── Teams (feature M) — declarative rosters materialized by `spur team up` ──
  # A sample team so the Teams board tabs (Roster / Messages / Activity /
  # Terminal) have data to render. `spur team up demo` writes agent specs to
  # .spur/agents/<teamId>-<localId>.yaml; members are NOT autostarted (autostart
  # defaults to false) — start one explicitly with `spur team start <agent-id>`
  # to populate Terminal / Messages / Activity with live data.
  team:
    demo:
      name: "Team Spur"
      work_dir: ~/xprojects/spur-new
      members:
        - executor: claude
          purpose: "Lead — planning & review"
        - executor: omp-zai
          purpose: "Implementer — code generation"
        - executor: codex-sol
          purpose: "Verifier — second opinion"

rules:
  paths:
    - .spur/rules/**/*.yaml

workflows:
  paths:
    - .spur/workflows/

redaction:
  enabled: false

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks3
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary
    docs/tasks2:
      baseCounter: 128
      label: Phase 2
    docs/tasks3:
      baseCounter: 348
      label: Phase 3
  # severity:
  #   L3.plan-format: off

features:
  dir: docs/features
