# Spur project configuration for spur-new
# Generated by `spur init` — maintained as the monorepo dogfood surface.

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.2"
name: spur-new

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: true
    # Periodic executions live here and nowhere else (task 0750). A tick
    # enqueues `scheduler.custom`, which the server's job worker runs through
    # /bin/sh -c in the project root. Use the repo-local CLI, never a global
    # `spur` that may be a stale bundle (AGENTS.md history-validation rule).
    jobs:
      # Incremental refresh, waking hours only (07:00-23:50; the cron hour range
      # keeps 00:00-06:59 quiet). `history daily` = import + analyze; analyze is
      # what refreshes the Board History rollups (token usage included) - import
      # alone never does. Checkpoint resume + the rollup-freshness short-circuit
      # keep a no-op tick cheap (I81).
      - name: history-refresh
        cron: "*/15 7-23 * * *"
        command: bun apps/cli/src/index.ts --no-logo history daily

      # 05:00 daily: full-corpus import (checkpoint resume self-heals gaps),
      # then the twelve-section history-anatomy diagnostic report headless. On
      # a cache hit the workflow skips the token-expensive model stages and
      # republishes provenance (ADR-079), so a ready report costs no tokens.
      # Ends with database maintenance (PRAGMA optimize + wal_checkpoint).
      - name: history-daily-report
        cron: "0 5 * * *"
        command: >-
          bun apps/cli/src/index.ts --no-logo history import --source all &&
          bun apps/cli/src/index.ts --no-logo workflow run config/workflows/history-anatomy.yaml --quiet &&
          bun apps/cli/src/index.ts --no-logo self maintain

      # 04:00 Sunday weekly: deep database maintenance (VACUUM defragmentation +
      # page compaction, PRAGMA optimize, and WAL checkpoint truncation).
      - name: database-weekly-maintenance
        cron: "0 4 * * 0"
        command: bun apps/cli/src/index.ts --no-logo self maintain --vacuum

# ── Teams (feature M) — declarative rosters materialized by `spur team up` ──
# The sample team below keeps the Teams board tabs (Roster / Messages /
# Activity / Terminal) populated. `spur team up demo` writes agent specs to
# .spur/agents/<teamId>-<localId>.yaml — those files are runtime scratch
# (gitignored, ADR-086); this roster is the committed source of truth.
# Members are NOT autostarted (autostart defaults to false) — start one
# explicitly with `spur team start <agent-id>` to populate live data.
agent:
  # Project-level executor overrides — merge into the global `executors` block by `name`
  # (config-global config.yaml carries the canonical agent/model/tier list).
  # These overrides add `executionCapabilities` to specific executors so capability
  # attestation (0706 R5) can satisfy stage `requiresCapabilities` (fsWrite,
  # processSpawn, fsRead). The pi agent actively edits files and spawns processes,
  # so native-known is the honest provenance; operator-configured would also work.
  executors:
    - name: pi-dsv4-flash-volc
      agent: pi
      # tier: standard
      executionCapabilities:
        version: 1
        axes:
          fsRead:
            state: available
            provenance: native-known
          fsWrite:
            state: available
            provenance: native-known
          processSpawn:
            state: available
            provenance: native-known
    - name: pi-zai
      agent: pi
      executionCapabilities:
        version: 1
        axes:
          fsRead:
            state: available
            provenance: native-known
          fsWrite:
            state: available
            provenance: native-known
          processSpawn:
            state: available
            provenance: native-known
  team:
    demo:
      name: "Team Spur"
      work_dir: ~/xprojects/spur-new
      members:
        - executor: claude
          purpose: "Lead — planning & review"
        - executor: omp-zai
          purpose: "Implementer — code generation"
        - executor: codex-sol
          purpose: "Verifier — second opinion"

rules:
  paths:
    - .spur/rules/**/*.yaml

# workflows:
#   paths:
#     - .spur/workflows/

redaction:
  enabled: false

# ── Planning (design §2.1 / §9) ──
tasks:
