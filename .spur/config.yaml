# Spur project configuration for spur-new
# Generated by `spur init`

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1"
name: spur-new

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# ── Spur app section (validated by a local zod schema — UNCHANGED keys) ──
agent:
  default: omp
  executors:
    - name: omp
      agent: omp
    - name: omp-zai
      agent: omp
      model: zai/glm-5.2
    - name: omp-xf
      agent: omp
      model: astron-code-latest
    - name: pi-xf
      agent: pi
      model: astron-code-latest
    - name: omp-zai-volc
      agent: omp
      model: volc/glm-5.2
    - name: omp-deepseek
      agent: omp
      model: deepseek/deepseek-v4-pro
    - name: minimax
      agent: omp
      model: minimax/MiniMax-M3
    - name: codex
      agent: codex
    - name: claude
      agent: claude
    - name: grok
      agent: grok
  default-by-phase:
    dev-brainstorm: grok
    dev-fixall: omp-xf
    dev-plan: grok
    dev-run: omp-xf
    dev-runall: omp-xf
    dev-changelog: omp-xf
    dev-gitmsg: minimax
    dev-review: grok
    dev-verify: grok

  # ── Teams (feature M) — declarative rosters materialized by `spur team up` ──
  # A sample team so the Teams board tabs (Roster / Messages / Activity /
  # Terminal) have data to render. `spur team up demo` writes agent specs to
  # .spur/agents/<teamId>-<localId>.yaml; members are NOT autostarted (autostart
  # defaults to false) — start one explicitly with `spur team start <agent-id>`
  # to populate Terminal / Messages / Activity with live data.
  team:
    demo:
      name: "Sample team"
      work_dir: ~/xprojects/spur-new
      members:
        - executor: claude
          purpose: "Lead — planning & review"
        - executor: omp-zai
          purpose: "Implementer — code generation"
        - executor: codex
          purpose: "Verifier — second opinion"

rules:
  paths:
    - .spur/rules/**/*.yaml

workflows:
  paths:
    - .spur/workflows/

redaction:
  enabled: false

# ── Tasks configuration (design §9 — absorbed from docs/.tasks/config.jsonc) ──
tasks:
  active: docs/tasks2
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary
    docs/tasks2:
      baseCounter: 128
      label: Phase 2
