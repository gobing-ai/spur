# Spur project configuration for spur-new
# Generated by `spur init` — maintained as the monorepo dogfood surface.

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.2"
name: spur-new

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: true
    # Periodic executions live here and nowhere else (task 0750). A tick
    # enqueues `scheduler.custom`, which the server's job worker runs through
    # /bin/sh -c in the project root. Use the repo-local CLI, never a global
    # `spur` that may be a stale bundle (AGENTS.md history-validation rule).
    jobs:
      # Incremental refresh, waking hours only (07:00-23:50; the cron hour range
      # keeps 00:00-06:59 quiet). `history import` incrementally imports and refreshes
      # the Board History rollups (via refreshHistoryRollups). Checkpoint resume + the
      # rollup-freshness short-circuit keep a no-op tick cheap (I81).
      - name: history-refresh
        cron: "*/20 7-23 * * *"
        command: bun apps/cli/src/index.ts --no-logo history import

      # 04:30 daily: database maintenance (PRAGMA optimize + wal_checkpoint).
      # Decoupled from the daily report so maintenance runs reliably even if
      # report generation fails.
      - name: database-daily-maintenance
        cron: "30 4 * * *"
        command: bun apps/cli/src/index.ts --no-logo self maintain

      # 05:00 daily: full-corpus import (checkpoint resume self-heals gaps),
      # then the twelve-section history-anatomy diagnostic report headless. On
      # a cache hit the workflow skips the token-expensive model stages and
      # republishes provenance (ADR-079), so a ready report costs no tokens.
      - name: history-daily-report
        cron: "0 5 * * *"
        # Total child budget. Measured 2026-10-19..21 on pi-dsv4.1-flash-volc: enrich alone
        # runs 45-52 min (vs 5-15 min on the prior elected executors), so the old 1h bound
        # SIGTERMed validate (exit 143) at exactly 3600s on both days. 1h45m covers enrich +
        # a normal validate, stays under the server queue's 2h visibility timeout, and still
        # finishes before the 07:00 history-refresh window.
        timeoutMs: 6300000
        command: >-
          bun apps/cli/src/index.ts --no-logo history import --source all &&
          bun apps/cli/src/index.ts --no-logo workflow run config/workflows/history-anatomy.yaml --quiet

      # 04:00 Sunday weekly: deep database maintenance (VACUUM defragmentation +
      # page compaction, PRAGMA optimize, and WAL checkpoint truncation).
      - name: database-weekly-maintenance
        cron: "0 4 * * 0"
        command: bun apps/cli/src/index.ts --no-logo self maintain --vacuum

      # 20261012, every 30 min from 04:00: refresh quota-owned executor availability, because a
      # spent balance is invisible until a run needs the executor. `spur agent usage` is run-once BY
      # DESIGN ("Schedule it externally (cron/launchd); spur serve never runs it"), so nothing else
      # keeps the ladder honest — and on 2026-10-12 the elected coder/reviewer/planner executor
      # (grok-4.7) answered 402 mid-run, which ended the safety gate and the run with it. The capture
      # demotes an exhausted executor to `disabled(quota)` and every role re-elects from the ladder,
      # so the 04:30 daily job starts against measured availability. The 04:00 tick is deliberate: it
      # lands after the roster settles and before kk-daily-ai-voice reads it. CodexBar credentials and
      # the provider endpoints are the operator's; a provider that errors is skipped, never treated as
      # recovery (the command's own contract), and the job is read-only against the project.
      - name: agent-usage-refresh
        cron: "0,30 4-23 * * *"
        timeoutMs: 600000
        command: spur --no-logo agent usage

rules:
  paths:
    - .spur/rules/**/*.yaml

# workflows:
#   paths:
#     - .spur/workflows/

redaction:
  enabled: false

# ── Release (spur builder bump-ver / drop-tags) ──
# Release plumbing knobs, declared explicitly. Values match the built-in
# defaults; adjust here instead of patching release code when conventions
# change (schema: packages/config/src/index.ts BuilderBumpVerConfigSchema).
builder:
  # A92 / docs/design/sdlc-actions.md §3.5: `bun` binds the reserved action
  # vocabulary to this repo's bun scripts (the default, declared so the dogfood
  # exercises the map); the custom actions below are this repo's own names, each
  # bound to a script that already exists in package.json and runnable only via
  # `spur self exec <name>`.
  preset: bun
  actions:
    test-repo-wide: bun run test-repo-wide
    plugin-smoke: bun run plugin-smoke
    corpus-check: bun run corpus-check
    eval: bun run eval
  bump-ver:
    # The published package whose own tag triggers publish.yml. Not needed here — the root
    # manifest is `@gobing-ai/spur`, which the built-in root-name discovery already matches.
    # Declare it in repos whose root manifest name is unscoped (root `knowledge-kit` never
    # matches `@gobing-ai/knowledge-kit`, so `--all` would skip the CLI entirely).
    tagVersionSeparator: "-v"
    publishWorkflow: publish.yml
    releaseCommitType: chore
    releaseCommitScope: release
    ghRunListLimit: 5
    # The CLI's binaryVersion literal (src/config.ts) declared as an explicit
    # ts-literal carrier — values are the built-in defaults; dogfoods the
    # registry (apps/cli/src/version-carriers.ts).
    versionCarriers:
      - type: ts-literal
      # The private desktop shell has no workspace dependents, so `--all` would
      # skip it; carry its package.json version with the release explicitly.
      - type: plugin-manifest
        paths: [apps/desktop/package.json]

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks5
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary
    docs/tasks2:
      baseCounter: 128
      label: Phase 2
    docs/tasks3:
      baseCounter: 348
      label: Phase 3
    docs/tasks4:
      baseCounter: 488
      label: Phase 4
    docs/tasks5:
      baseCounter: 855
      label: Phase 5

features:
  dir: docs/features

# ── Agent fleet (G65 / docs/design/fleet-config-declaration.md) ──
# Project-layer only. `enabled: true` makes `spur serve` materialize and
# autostart every enabled member; preview with `spur projects list --fleet`.
# Role-only members resolve their executor through the global tier ladder
# (~/.config/spur/config.yaml agent.roles/executors); pin `executor:` to override.
agent:
  fleet:
    enabled: false
    # rest = no autonomous dispatch (drive work with `--agent fleet`);
    # gtd = auto-dispatch todo tasks tagged `fleet:auto`, by priority.
    strategy: gtd
    orchestrator: planner-1
    members:
      - { role: planner, purpose: orchestrator }  # planner-1
      - { role: coder, executor: pi-k3, id: coder-1 } # coder-1 (volc + zai standard quotas exhausted 2026-10-03; id pinned per ADR-126 A4 rename guard)
      - { role: reviewer, executor: agy-opus-5.5 } # reviewer-1 (agy-gemini flash-high burned its turn budget on 1276's large diff and exited 0 with an empty answer file — 2026-10-22; pin per the role-only escape hatch above)

  # Routing-ladder kill-switch (111 R1) — merges into the global agent.executors entry by
  # name: the agy-gemini flash-high reviewer burned its turn budget on 1276's large diff
  # twice on 2026-10-22 (exit 0 with an EMPTY answer file, 8.7 min then 2.4 min); the
  # reviewer ladder falls through to agy-opus-5.5. Flip back when the model holds a full
  # review turn again.
  executors:
    - name: agy-gemini
      agent: antigravity-cli
      model: gemini-3.8-flash-high
      tier: capable-1
      disabled: true
