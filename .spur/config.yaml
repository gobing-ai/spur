# Spur project configuration for spur-new
# Generated by `spur init` — maintained as the monorepo dogfood surface.

$schema: "@gobing-ai/spur/schemas/spur-config.schema.json"
version: "1.2"
name: spur-new

# ── Portable bootstrap (consumed by @gobing-ai/ts-infra runNodeApplication) ──
# Shared across spur and (future) spur-server. Keys map 1:1 to ts-infra's
# LoggingOptions / TelemetryOptions / database / SchedulerOptions.
bootstrap:
  logging:
    enabled: true
    level: debug
    console: false
    json: false
    file: true
    filePath: .spur/logs/spur.log
  telemetry:
    enabled: false
    serviceName: spur
    environment: development
  database:
    enabled: true
    driver: bun-sqlite
    url: .spur/spur.db
  scheduler:
    enabled: false

# # ── Spur app section (validated by spurConfigSchema in
# @gobing-ai/spur-config) ──
# agent:
#   # Role-based default (0542): a role id selects its tier's cheapest eligible
# # executor. An executor name here only works through the
# agent-default-executor
# # transition shim (warns once; removal condition is this file naming no
# executor).
#   default: coder

#   # Role → tier map (SSOT: DEFAULT_AGENT_ROLES in packages/config, task 0572 /
# # ADR-061; plugins/sp/references/roles.md is a parity-gated projection — it
# is
# # NOT a config key). Resolution: role → tier → cheapest USABLE executor
# whose
# # tier >= the role's tier, climbing the ladder across gaps. Keep at least
# one
# # usable executor at or above each rung or that role fails loudly at
# dispatch:
#   #   scribe=cheap · coder=standard · reviewer=capable-1 · planner=capable-2
#   # Stage floors (stage-registry model_policy): changelog=cheap;
#   # implement/test/wrap/review/refine/brainstorm=standard;
#   # verify/dogfood=capable-1; plan=capable-2. A stage's fallback ladder
#   # (auth / resource-exhaustion / gate-fail) only advances when a higher rung
#   # has a usable executor — an empty rung turns a quota failure into a hang.
# # Optional per-project override (`roles:`) mirrors config.example.yaml
# (0572).

#   # ── Executors (ADR-033 adaptive model routing) ──
# # `tier` is DECLARED, never inferred. Without it, agent-service falls back
# to a
#   # regex over `name + model + agent` which misclassifies silently — e.g.
# # `deepseek-v4-pro` matched `\bpro\b` and became the only `capable`
# executor,
# # while `claude`/`codex`/`grok` fell to `standard` and were excluded from
# every
#   # capable-tier stage.
#   #
# # `model` is pinned on every entry. Omitting it defers to the agent CLI's
# own
#   # default, which drifts with CLI upgrades and account state — an unpinned
#   # executor silently changes behavior when the vendor changes the default.
#   # Pin what the CLI would resolve today (`grok models`, omp config.yml
#   # modelRoles.default, ~/.codex/config.toml, ~/.claude.json).
#   #
#   # Pairing classes (2026-08): native pairs (vendor model on the vendor CLI —
#   # codex-sol, claude, grok, agy-*) anchor the capable rungs; portable models
#   # (deepseek-v4-*, glm-5.x) ride omp/pi at cheap/standard. Promote a portable
#   # model into a capable rung only on history-plane evidence.
#   #
# # Selection: a stage takes the CHEAPEST executor whose tier >= its
# `min_tier`
# # (cheap=1 < standard=2 < capable-1=3 < capable-2=4 < capable-3=5).
# Sub-tiers
#   # replace array-order *across* capable-1/2/3; array order remains the last-
#   # resort tie-break only for executors that share the exact same tier value.
#   executors:
#     # cheap — mechanical, high-volume work
#     - name: minimax
#       agent: omp
#       model: minimax/MiniMax-M3
#       tier: cheap

#     # standard — implementation, tests, wrap-up
# # omp-dsv4-flash-volc first: the available implementation executor (omp
# opencode
# # is quota-exhausted as of 2026-08-21; role-coder cheapest-eligible picks
# this).
#     - name: omp-dsv4-flash-volc
#       agent: omp
#       model: volc/deepseek-v4-flash-ga-260731
#       tier: standard
#     - name: omp
#       agent: omp
#       model: opencode/deepseek-v4-flash
#       tier: standard
#     - name: omp-zai
#       agent: omp
#       model: zai/glm-5.3
#       tier: standard
#     - name: omp-zai-cn
#       agent: omp
#       model: zai-cn/glm-5.3
#       tier: standard
#     - name: omp-zai-nvidia
#       agent: omp
#       model: nvidia/z-ai/glm-5.2
#       tier: standard
#     # - name: omp-zai-opencode
#     #   agent: omp
#     #   model: opencode/glm-5.2
#     #   tier: standard
#     - name: omp-dsv4-flash-opencode
#       agent: omp
#       model: opencode/deepseek-v4-flash
#       tier: standard
#     - name: omp-zai-volc
#       agent: omp
#       model: volc/glm-5.2
#       tier: standard
#     # - name: omp-zai-ollama
#     #   agent: omp
#     #   model: ollama/glm-5.2:cloud
#     #   tier: standard
#     # - name: omp-dsv4-flash-ollama
#     #   agent: omp
#     #   model: deepseek-v4-flash:0731-cloud
#     #   tier: standard
#     - name: agy-gemini
#       agent: antigravity-cli
#       model: gemini-3.6-flash-high
#       # model: gemini-3.1-pro
#       tier: standard
#     - name: agy-opus
#       agent: antigravity-cli
#       model: claude-4-6-opus
#       tier: standard
#     - name: codex-luna
#       agent: codex
#       model: gpt-5.6-luna
#       tier: standard

#     # capable-1/2/3 — planning, verification, dogfooding (0343)
#     # 1 = low output quality within the capable band, 3 = high. Declare
#     # explicitly — inference never invents capable-2/3.
#     - name: omp-deepseek
#       agent: omp
#       model: deepseek/deepseek-v4-flash
#       tier: standard
#     # - name: pi-k3
#     #   agent: pi
#     #   model: "k3"
#     #   tier: capable-1
#     - name: grok
#       agent: grok
#       model: grok-4.6
#       tier: capable-2
#     - name: codex-sol
#       agent: codex
#       model: gpt-5.6-sol
#       tier: capable-3
#     - name: claude
#       agent: claude
#       model: k3
#       tier: capable-3

#   # `default-by-phase` removed from schema (0452). Was a
# # backward-compat shim that emits a one-time deprecation warning. When
# present
#   # it is still authoritative for matching phases and shadows stage routing —
#   # do not re-enable unless you intentionally need that fail-fast map.
#   # default-by-phase:
#   #   dev-run: omp-zai
#   #   dev-review: claude

# ── Teams (feature M) — declarative rosters materialized by `spur team up` ──
# The sample team below keeps the Teams board tabs (Roster / Messages /
# Activity / Terminal) populated. `spur team up demo` writes agent specs to
# .spur/agents/<teamId>-<localId>.yaml — those files are runtime scratch
# (gitignored, ADR-086); this roster is the committed source of truth.
# Members are NOT autostarted (autostart defaults to false) — start one
# explicitly with `spur team start <agent-id>` to populate live data.
agent:
  team:
    demo:
      name: "Team Spur"
      work_dir: ~/xprojects/spur-new
      members:
        - executor: claude
          purpose: "Lead — planning & review"
        - executor: omp-zai
          purpose: "Implementer — code generation"
        - executor: codex-sol
          purpose: "Verifier — second opinion"

rules:
  paths:
    - .spur/rules/**/*.yaml

# workflows:
#   paths:
#     - .spur/workflows/

redaction:
  enabled: false

# ── History refresh (task 0696) ──
# While `spur serve` runs, the server scheduler enqueues the coalesced
# `history.refresh` job every N minutes: import-all (checkpoint-resumed,
# per-source isolation) → analyze → artifact. Opt-in; unset = off.
history:
  refresh:
    schedule_minutes: 10

# ── Planning (design §2.1 / §9) ──
tasks:
  active: docs/tasks4
  folders:
    docs/tasks:
      baseCounter: 0
      label: Primary
    docs/tasks2:
      baseCounter: 128
      label: Phase 2
    docs/tasks3:
      baseCounter: 348
      label: Phase 3
    docs/tasks4:
      baseCounter: 488
      label: Phase 4

features:
  dir: docs/features
