commit-msg:
  commands:
    cog:
      run: cog verify --file {0}

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,tsx,jsx,json}"
      run: bunx biome check --staged --write --no-errors-on-unmatched
      stage_fixed: true
      # Skip ONLY this command in a spawn-restricted sandbox (e.g. Claude Code),
      # where lefthook cannot exec child processes. Other hooks (cog) still run.
      # Run the gate manually before bypassing:
      #   bunx biome check --staged --write --no-errors-on-unmatched
      skip: [{ run: test "$LEFTHOOK_SANDBOX" = "1" }]

pre-push:
  commands:
    cog:
      run: cog check
    lint:
      run: bun run lint
